<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:16px;font-size:14px}
button{padding:14px;width:100%;margin:8px 0;font-size:16px;border-radius:12px;border:0;background:#e11d1d;color:#fff}
pre{white-space:pre-wrap;word-break:break-all;background:#111;padding:10px;border-radius:8px;min-height:120px}
</style>
</head>
<body>
<h3>Тест входа через Google</h3>
<button onclick="login()">Войти через Google</button>
<button onclick="check()">Проверить сессию</button>
<pre id="out"></pre>
<script>
const db=supabase.createClient(
  "https://fwvvnzrprjffsmkpvhrl.supabase.co",
  "sb_publishable_wJYMx4Gs-NlZXUBFedcVaQ_H30wRYUz",
  {auth:{detectSessionInUrl:true,flowType:"pkce"}}
);
const out=document.getElementById("out");
function log(s){ out.textContent+=s+"\n"; }

log("Адрес при загрузке:\n"+location.href);

db.auth.onAuthStateChange((ev,s)=>{
  log("Событие: "+ev+" | email: "+(s?.user?.email||"нет"));
});

async function login(){
  const {error}=await db.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:location.origin+"/test/"}
  });
  log("Старт входа: "+(error?("ОШИБКА: "+error.message):"ok"));
}

async function check(){
  const {data,error}=await db.auth.getSession();
  if(error) return log("getSession ОШИБКА: "+error.message);
  log("Сессия: "+(data.session?("ЕСТЬ, "+data.session.user.email):"НЕТ"));
}
</script>
</body>
</html>
