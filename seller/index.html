<style>
:root{--r:#dc2626;--r2:#ef4444;--rd:#7f1d1d;--k:#0a0a0a;--card:#141414;--card2:#1c1c1c;--line:#2a2a2a;--t:#f5f5f5;--m:#a3a3a3;--ok:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--k);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding-bottom:86px}
body.nologin{padding-bottom:0}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.logo{font-weight:900;letter-spacing:-.5px;font-size:20px;cursor:pointer;line-height:1}
.logo b{color:var(--r)}
.logo small{display:block;font-size:9px;letter-spacing:3px;color:var(--m);font-weight:600;margin-top:2px}
.burger{background:none;border:0;color:var(--t);font-size:24px;padding:6px 8px;cursor:pointer}
main{max-width:520px;margin:0 auto;padding:14px 14px 20px;animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
h2{font-size:22px;font-weight:900;letter-spacing:-.4px;margin:14px 0 10px}
h3{font-size:13px;font-weight:800;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.7px;color:var(--m)}
.hero{background:linear-gradient(135deg,var(--r) 0%,var(--rd) 55%,#0a0a0a 100%);border-radius:24px;padding:20px;position:relative;overflow:hidden;box-shadow:0 14px 34px #dc262655;display:flex;gap:14px;align-items:center}
.hero:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff14;right:-80px;top:-90px}
.hero>*{position:relative;z-index:1}
.av{width:64px;height:64px;border-radius:50%;background:#0a0a0a;border:2px solid #fff;overflow:hidden;flex:0 0 64px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:var(--r2)}
.av img{width:100%;height:100%;object-fit:cover}
.hi{font-size:19px;font-weight:900;letter-spacing:-.3px;word-break:break-all}
.hs{font-size:13px;opacity:.92;margin-top:4px;line-height:1.4}
.hs2{font-size:12px;opacity:.8;margin-top:2px}
.greet{background:linear-gradient(90deg,#1c0a0a,#141414);border:1px solid var(--rd);border-radius:20px;padding:14px 16px;margin:12px 0}
.greet b{font-size:15px;font-weight:800}
.greet div{color:var(--m);font-size:13px;margin-top:3px}
.btn{display:block;width:100%;background:var(--r);color:#fff;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:800;margin:10px 0;cursor:pointer;transition:background .2s,transform .1s;box-shadow:0 8px 20px #dc262640;font-family:inherit}
.btn:hover{background:var(--r2)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.75;cursor:default}
.btn.sent{background:var(--ok);box-shadow:0 8px 20px #16a34a40}
.btn.line{background:transparent;border:1px solid var(--r);color:var(--t);box-shadow:none}
.btn.dark{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--t)}
.btn.sm{display:inline-block;width:auto;padding:10px 14px;font-size:14px;margin:4px 6px 0 0;border-radius:12px}
.btn.del{background:transparent;color:#fca5a5;border:1px solid var(--rd);box-shadow:none;width:auto;display:inline-block;padding:10px 14px;font-size:14px;margin:4px 0 0}
.link{background:none;border:0;color:var(--r2);font-weight:700;font-size:14px;cursor:pointer;padding:8px 0;font-family:inherit}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
input,select,textarea{width:100%;padding:14px;margin:6px 0;border:1px solid var(--line);border-radius:14px;font-size:16px;background:var(--card2);color:var(--t);font-family:inherit;transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:#6b6b6b}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--r)}
input.bad,select.bad,textarea.bad,.drop.bad{border-color:var(--r)!important;box-shadow:0 0 0 3px #dc262633}
.ferr{color:var(--r2);font-size:13px;font-weight:700;margin:-2px 2px 8px;min-height:0}
.hint{color:var(--m);font-size:12px;margin:-2px 2px 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{background:transparent;color:var(--m);border:0;border-radius:11px;padding:11px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--r);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--m);margin:8px 0 4px;line-height:1.4}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--r);flex:0 0 20px}
.chk a{color:var(--r2);font-weight:700}
.err{color:var(--r2);font-size:14px;font-weight:700;margin-top:10px;min-height:18px;line-height:1.4}
.ok{color:#4ade80;font-size:14px;font-weight:700;margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;background-size:cover;background-position:center;transition:border-color .2s}
.tile:hover{border-color:var(--r)}
.tile .em{font-size:28px}
.tile b{font-size:11px;font-weight:800;padding:0 6px;line-height:1.2;margin-top:4px}
.tile.img{justify-content:flex-end}
.tile.img:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#000d 100%)}
.tile.img b{position:relative;z-index:1;padding-bottom:9px}
.catrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin:8px 0;cursor:pointer}
.catrow .ci{width:54px;height:54px;border-radius:14px;background:var(--card2) center/cover;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 54px}
.catrow b{flex:1;font-size:15px;font-weight:700}
.catrow i{color:var(--r);font-style:normal;font-size:22px;font-weight:700}
.crumbs{font-size:13px;color:var(--m);margin:6px 0 10px;line-height:1.5}
.crumbs a{color:var(--r2);text-decoration:none;font-weight:700}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--m);margin-bottom:10px}
.pill b{color:var(--t)}
.prod{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin:10px 0}
.prow{display:flex;gap:12px}
.pimg{width:80px;height:80px;border-radius:16px;object-fit:cover;background:var(--card2);flex:0 0 80px}
.pph{width:80px;height:80px;border-radius:16px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 80px;color:var(--m)}
.pt{flex:1;min-width:0}
.pt b{display:block;font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{color:var(--r2);font-weight:900;font-size:15px;margin-top:2px}
.badge{display:inline-block;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;margin-top:6px}
.note{color:var(--m);font-size:12px;margin-top:6px;line-height:1.5}
.warn2{background:#1c0a0a;border:1px solid var(--rd);color:#fca5a5;border-radius:14px;padding:10px;font-size:13px;margin-top:10px;line-height:1.45}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.sec h4{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.req{background:var(--r);color:#fff;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.drop{border:1.5px dashed #3a3a3a;border-radius:16px;padding:12px;background:var(--card2);transition:border-color .2s}
.drop.bad{border-color:var(--r)}
.addph{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--r);color:#fff;border-radius:14px;padding:14px;font-weight:800;cursor:pointer;font-size:15px}
.addph input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumbs:empty{display:none}
.thumbs .th{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#000}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:4px;right:4px;background:#000c;color:#fff;border:0;border-radius:999px;width:26px;height:26px;cursor:pointer;font-size:15px;line-height:26px;text-align:center;padding:0;width:26px}
.thumbs .cover{position:absolute;left:4px;bottom:4px;background:var(--r);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px}
.pcard{position:relative;width:100%;aspect-ratio:1.586;border-radius:22px;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#000 0%,var(--rd) 55%,var(--r) 100%);box-shadow:0 14px 30px #dc262640;overflow:hidden;margin:4px 0 10px}
.pcard:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#ffffff12;right:-90px;top:-110px}
.pcard .chip{width:42px;height:31px;border-radius:7px;background:linear-gradient(135deg,#fde68a,#f59e0b)}
.pcard .pbank{font-weight:800;font-size:14px;position:relative}
.pcard .pnum{font-size:18px;letter-spacing:2px;font-family:ui-monospace,Menlo,Consolas,monospace;position:relative}
.pcard .copy{position:absolute;right:12px;top:12px;background:#ffffff26;color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;z-index:2;font-family:inherit}
.warn{background:#1c0a0a;border:1px solid var(--rd);border-radius:14px;padding:12px;font-size:14px;line-height:1.5;color:#fecaca;margin:10px 0}
.bottom{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;bottom:0;z-index:25;background:#0d0d0d;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
body.nologin .bottom{display:none}
.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--m);padding:2px 0}
.bottom a i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:19px;height:36px;width:46px;margin:0 auto;border-radius:14px;transition:background .2s}
.bottom a span{display:block;font-size:11px;font-weight:700;margin-top:3px}
.bottom a.on{color:var(--r2)}
.bottom a.on i{background:var(--r);color:#fff}
.bottom a.plus i{background:var(--r);color:#fff;font-weight:900;font-size:24px}
.sheet{position:fixed;inset:0;background:#000b;display:none;z-index:40;align-items:stretch;justify-content:flex-end}
.sheet.open{display:flex}
.sheet-box{background:var(--card);border-left:1px solid var(--line);width:78%;max-width:320px;height:100%;padding:18px;overflow:auto;animation:fi .25s ease}
.sheet-box a,.sheet-box button.mi{display:block;width:100%;text-align:left;background:none;border:0;color:var(--t);text-decoration:none;font-size:16px;font-weight:700;padding:14px 10px;border-radius:12px;cursor:pointer;font-family:inherit}
.sheet-box a:hover,.sheet-box button.mi:hover{background:var(--card2)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-130px);top:14px;z-index:60;background:var(--card2);border:1px solid var(--line);color:var(--t);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:700;transition:transform .3s;max-width:92%;box-shadow:0 10px 30px #0008;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--rd);color:#fecaca}
.toast.ok{border-color:#14532d;color:#bbf7d0}
.clog{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;height:56vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--r);color:#fff;border-bottom-right-radius:4px}
.msg.admin{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg img{display:block;max-width:100%;max-height:240px;border-radius:12px;margin-bottom:6px}
.mt{font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.cform{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.cform textarea{flex:1;height:50px;margin:0;resize:none}
.clip{background:var(--card2);border:1px solid var(--line);border-radius:14px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex:0 0 50px}
.clip input{display:none}
.cprev{display:none;align-items:center;gap:10px;margin-top:8px}
.cprev.on{display:flex}
.cprev img{width:60px;height:60px;object-fit:cover;border-radius:12px}
.about{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;font-size:16px;line-height:1.7}
.muted{color:var(--m);font-size:13px;line-height:1.5}
</style>
</head>
<body class="nologin">
<header>
  <div class="logo" onclick="go('#/')"><b>700</b><small>OPTOM</small></div>

<main id="app"></main>
<nav class="bottom">

    <div class="logo" style="margin-bottom:16px"><b>700</b><small>OPTOM</small></div>
    <button class="mi" onclick="menuGo('#/chat')">💬 Чат с админом</button>
    <button class="mi" onclick="menuGo('#/about')">ℹ️ О нас</button>

  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const SB_URL="https://fwvvnzrprjffsmkpvhrl.supabase.co";
const SB_KEY="sb_publishable_wJYMx4Gs-NlZXUBFedcVaQ_H30wRYUz";
const SITE=location.origin+location.pathname;
const CARD_NUMBER="5058270378663669";
const CARD_BANK="Душанбе Сити";
const FEE_TEXT="1 сомони таджикский";
const PHOTO_MONTHS=5;
const DAY=86400000;
const ICON={"Женщинам":"👗","Мужчинам":"👔","Детям":"🧸","Обувь":"👟","Аксессуары":"👜","Электроника":"📱","Дом и уют":"🏠","Красота и гигиена":"💄","Спорт и отдых":"🏋️","Игрушки":"🧩","Продукты питания":"🥫"};
const icon=n=>ICON[n]||"🛍️";
const ST={pending_review:["На проверке","#7c3aed"],published:["Опубликован","#16a34a"],rejected:["Отклонён","#dc2626"],awaiting_payment:["Не отправлен","#d97706"],draft:["Черновик","#737373"]};
const ERR=[
  ["already registered","Этот email уже зарегистрирован. Нажмите «Войти»."],
  ["Invalid login credentials","Неверный пароль или неверный email."],
  ["Email not confirmed","Email не подтверждён. Проверьте почту."],
  ["at least 6","Пароль должен быть не короче 6 символов."],
  ["Password should be","Пароль должен быть не короче 6 символов."],
  ["For security purposes","Слишком частые запросы. Подождите минуту."],
  ["rate limit","Слишком много писем. Попробуйте позже."]
];
const errText=e=>{const m=e?.message||"";const f=ERR.find(([k])=>m.includes(k));return f?f[1]:"Ошибка: "+m;};
const db=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const go=h=>{ if(location.hash===h) route(); else location.hash=h; };
const fdate=t=>new Date(t).toLocaleDateString("ru-RU");
const fmt=t=>new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function ago(t){
  const d=Math.floor((Date.now()-new Date(t))/DAY);
  if(d<1) return "сегодня";
  if(d<7) return d+" дн. назад";
  if(d<30) return Math.floor(d/7)+" нед. назад";
  if(d<365) return Math.floor(d/30)+" мес. назад";
  return Math.floor(d/365)+" г. назад";
}
const isExpired=p=>p.status==="published"&&!!p.photos_until&&new Date(p.photos_until)<=new Date();
const isLive=p=>p.status==="published"&&!isExpired(p);

let user=null, CATS=[], COUNTRIES=[], CITIES=[], MODE="login", TIMER=null, CURRENT_DRAFTS=0;
let recovery=location.hash.includes("type=recovery");
let PHOTOS=[], RECEIPT=null, CHAT_PHOTO=null, CHAT_KEY=null;

// ---------- ЗВУК НА КАЖДУЮ КНОПКУ ----------
let AC=null;
function beep(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.07);
  }catch(e){}
}
document.addEventListener("click",e=>{ if(e.target.closest("button,a,.tile,.catrow")) beep(); },true);

// ---------- УВЕДОМЛЕНИЯ ----------
let TT=null;
function toast(msg,type){
  const t=$("#toast"); t.textContent=msg; t.className="toast show "+(type||"");
  clearTimeout(TT); TT=setTimeout(()=>{ t.className="toast"; },2800);
}
function toggleSheet(on){ $("#sheet").classList.toggle("open",on); }
function menuGo(h){ toggleSheet(false); go(h); }
async function menuLogout(){ toggleSheet(false); await logout(); }

// ---------- СТАРТ И МАРШРУТЫ ----------
async function init(){
  const {data}=await db.auth.getSession();
  user=data.session?.user||null;
  if(user && await isAdmin()) return location.replace("../admin/");
  window.addEventListener("hashchange",()=>route());
  await loadRefs();
  route();
}
async function isAdmin(){
  const {data}=await db.from("admins").select("user_id").eq("user_id",user.id);
  return !!(data&&data.length);
}
function renderNav(){ document.body.classList.toggle("nologin",!user); }
function setTab(t){ document.querySelectorAll(".bottom a").forEach(a=>a.classList.toggle("on",a.dataset.tab===t)); }
function stopPoll(){ clearInterval(TIMER); TIMER=null; }
async function logout(){
  stopPoll();
  await db.auth.signOut();
  user=null; renderNav(); location.hash="#/"; route();
  toast("Вы вышли из аккаунта","ok");
}
async function route(){
  stopPoll(); renderNav(); window.scrollTo(0,0);
  if(recovery) return recoveryView();
  if(!user) return loginView();
  const [,page,arg]=(location.hash||"#/").split("/");
  if(page==="cats") return catsView(arg?+arg:null);
  if(page==="new") return productForm(null,+arg);
  if(page==="edit") return productForm(+arg,null);
  if(page==="chat") return chatView();
  if(page==="account") return accountView();
  if(page==="about") return aboutView();
  return homeView();
}
async function loadRefs(){
  const [{data:cats},{data:countries},{data:cities}]=await Promise.all([
    db.from("categories").select("*").order("name"),

async function doLogin(){
  const btn=$("#go"), err=$("#authErr");
  err.textContent="";
  const email=$("#em").value.trim(), pw=$("#pw").value;
  const bad=[]; if(!email) bad.push("em"); if(!pw) bad.push("pw");
  markBad(bad);
  if(bad.length){ err.textContent="Введите email и пароль."; return; }
  busy(btn,true);
  const {data,error}=await db.auth.signInWithPassword({email,password:pw});
  busy(btn,false);
  if(error){ markBad(["em","pw"]); err.textContent=errText(error); return; }
  user=data.user;
  if(await isAdmin()) return location.replace("../admin/");
  renderNav(); go("#/"); toast("Добро пожаловать!","ok");
}
async function doRegister(){
  const btn=$("#go"), err=$("#authErr");
  err.textContent="";
  const un=$("#un").value.trim(), email=$("#em").value.trim(), pw=$("#pw").value, pw2=$("#pw2").value;
  const bad=[], msgs=[];
  if(un.length<3||/\s/.test(un)){ bad.push("un"); msgs.push("username: минимум 3 символа, без пробелов"); }
  if(!/^\S+@\S+\.\S+$/.test(email)){ bad.push("em"); msgs.push("введите правильный email"); }
  if(pw.length<6){ bad.push("pw"); msgs.push("пароль: минимум 6 символов"); }
  if(pw2!==pw||!pw2){ bad.push("pw2"); msgs.push("пароли не совпадают"); }
  markBad(bad);
  if(!$("#agree").checked) msgs.push("отметьте согласие с политикой");
  if(msgs.length){ err.textContent="Заполните правильно: "+msgs.join("; "); return; }
  busy(btn,true);
  const {data,error}=await db.auth.signUp({email,password:pw,options:{data:{username:un}}});
  busy(btn,false);
  if(error){ markBad(["em"]); err.textContent=errText(error); return; }
  if(!data.session){ MODE="login"; loginView(); toast("Аккаунт создан. Войдите по email и паролю.","ok"); return; }
  user=data.user; renderNav(); go("#/"); toast("Аккаунт создан. Добро пожаловать!","ok");
}

}

async function toJpegBlob(file,max=1200,q=0.82){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Не удалось сжать фото")),"image/jpeg",q));
  }finally{ URL.revokeObjectURL(url); }
}
async function saveProduct(id,catId,live){
  const v=k=>($("#f_"+k)?.value??"").trim();
  const fields={
    title:v("title"), description:v("desc")||null, category_id:catId,
    country_id:+$("#f_country").value, city_id:+$("#f_city").value,
    price:+v("price"), min_order:+v("min"),
    quality:v("quality"), origin_country:v("origin"), address:v("address"),
    seller_phone:v("phone")||null, seller_email:v("email")||null, instagram:v("ig")||null
  };
  if(live){
    const {error}=await db.from("products").update(fields).eq("id",id);
    if(error) throw new Error(error.message);
    toast("Изменения сохранены","ok"); return go("#/");
  }
  let drafts=null;
  if(PHOTOS.length){
    drafts=[];
    for(let i=0;i<PHOTOS.length;i++){
      const blob=await toJpegBlob(PHOTOS[i],1200,0.82);
      const path=`${user.id}/${Date.now()}_${i}.jpg`;
      const {error}=await db.storage.from("product-drafts").upload(path,blob,{contentType:"image/jpeg"});
      if(error) throw new Error(error.message);
      drafts.push(path);
    }
  }
  const rblob=await toJpegBlob(RECEIPT,1400,0.85);
  const rpath=`${user.id}/fee_${Date.now()}.jpg`;
  const {error:er}=await db.storage.from("receipts").upload(rpath,rblob,{contentType:"image/jpeg"});
  if(er) throw new Error("чек: "+er.message);
  const common={...fields,status:"pending_review",receipt_url:rpath,payment_comment:v("comment"),owner_email:user.email};
  if(!id){
    const {error}=await db.from("products").insert({...common,seller_id:user.id,draft_photos:drafts});
    if(error) throw new Error(error.message);
  } else {
    const row={...common};
    if(drafts){
      const {data:old}=await db.from("products").select("draft_photos").eq("id",id).maybeSingle();
      row.draft_photos=drafts;
      if(old?.draft_photos?.length) await db.storage.from("product-drafts").remove(old.draft_photos);
    }
    const {error}=await db.from("products").update(row).eq("id",id);
    if(error) throw new Error(error.message);
  }
  toast("Заявка отправлена. Ответ: 5–30 минут","ok");
  go("#/");
}

// ---------- ЧАТ С АДМИНОМ ----------
function chatView(){
  setTab("chat");
  CHAT_KEY="seller:"+user.id;
  CHAT_PHOTO=null;
  $("#app").innerHTML=`
    <h2>Чат с админом</h2>
    <p class="muted">Если заявка долго не принимается или вы отправили чек, напишите здесь. Ответ придёт в этот чат.</p>
    <div class="clog" id="clog"><div class="muted" style="margin:auto;text-align:center">Загрузка...</div></div>
    <div class="cprev" id="cprev"><img id="cpimg"><button class="btn sm dark" type="button" onclick="clearChatPhoto()">Убрать</button></div>
    <form class="cform" onsubmit="sendChat(event)">
      <label class="clip">📷<input type="file" accept="image/*" onchange="pickChatPhoto(this.files[0])"></label>
      <textarea id="ctxt" placeholder="Напишите сообщение…" maxlength="1000"></textarea>
      <button class="btn sm" id="csend" type="submit">Отправить</button>
    </form>
    <p class="err" id="cerr"></p>`;
  loadChat(true);
  TIMER=setInterval(()=>loadChat(false),10000);
}
async function loadChat(scroll){
  const log=$("#clog"); if(!log) return;
  const {data,error}=await db.rpc("support_history",{p_key:CHAT_KEY});
  if(!$("#clog")) return;
  if(error){ $("#cerr").textContent="Ошибка: "+error.message; return; }
  const near=log.scrollHeight-log.scrollTop-log.clientHeight<100;
  const list=data||[];
  log.innerHTML=list.length
    ? list.map(m=>`<div class="msg ${m.sender==="admin"?"admin":"user"}">${m.attachment?`<img src="${esc(m.attachment)}">`:""}${m.body&&m.body!=="📷 Фото"?esc(m.body):""}<div class="mt">${fmt(m.created_at)}</div></div>`).join("")
    : '<div class="muted" style="margin:auto;text-align:center">Напишите первое сообщение</div>';
  if(scroll||near) log.scrollTop=log.scrollHeight;
}
async function toDataUrl(file,max=800){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=0.7, out=c.toDataURL("image/jpeg",q);
    while(out.length>330000&&q>0.3){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
    if(out.length>330000) throw new Error("Фото слишком большое");
    return out;
  }finally{ URL.revokeObjectURL(url); }
}
async function pickChatPhoto(f){
  if(!f) return;
  try{ CHAT_PHOTO=await toDataUrl(f); $("#cpimg").src=CHAT_PHOTO; $("#cprev").classList.add("on"); $("#cerr").textContent=""; }
  catch(e){ CHAT_PHOTO=null; $("#cerr").textContent=e.message; }
}
function clearChatPhoto(){ CHAT_PHOTO=null; const p=$("#cprev"); if(p) p.classList.remove("on"); }
async function sendChat(e){
  e.preventDefault();
  const t=$("#ctxt"), body=t.value.trim();
  if(!body&&!CHAT_PHOTO){ $("#cerr").textContent="Напишите сообщение или прикрепите фото."; return; }
  const btn=$("#csend"); btn.disabled=true; $("#cerr").textContent="";
  const {error}=await db.rpc("support_send",{p_key:CHAT_KEY,p_body:body,p_email:user.email,p_attach:CHAT_PHOTO});
  btn.disabled=false;
  if(error){ $("#cerr").textContent=error.message; return; }
  t.value=""; clearChatPhoto(); await loadChat(true);
}

// ---------- ПРОФИЛЬ ----------
function accountView(){
  setTab("acc");
  const av=user.user_metadata?.avatar, name=user.user_metadata?.username||"";
  $("#app").innerHTML=`
    <h2>Профиль</h2>
    <div class="card" style="text-align:center">
      <div class="av" style="width:96px;height:96px;margin:4px auto 10px;font-size:34px">${av?`<img src="${esc(av)}">`:esc((user.email||"?")[0].toUpperCase())}</div>
      ${name?`<div style="font-weight:900;font-size:17px">${esc(name)}</div>`:""}
      <div class="muted" style="word-break:break-all">${esc(user.email)}</div>
      <label class="addph" style="margin-top:12px">📷 Фото профиля<input type="file" accept="image/*" onchange="uploadAvatar(this.files[0])"></label>
    </div>
    <div class="card">
      <b>Смена пароля</b>
      <input id="npw" type="password" placeholder="Новый пароль (не короче 6 символов)">
      <button class="btn line" onclick="changePassword()">Сохранить пароль</button>
    </div>
    <button class="btn dark" onclick="logout()">Выйти из аккаунта</button>
    <button class="btn del" style="width:100%;margin-top:6px" onclick="deleteAccount()">Удалить аккаунт</button>
    <p class="muted" style="text-align:center">Удаление аккаунта удаляет все ваши товары и заявки.</p>`;
}
async function changePassword(){
  const p=$("#npw").value;
  if(p.length<6){ toast("Пароль должен быть не короче 6 символов","err"); return; }
  const {error}=await db.auth.updateUser({password:p});
  if(error) return toast(errText(error),"err");
  $("#npw").value=""; toast("Пароль изменён","ok");
}
async function uploadAvatar(file){
  if(!file) return;
  try{
    const blob=await toJpegBlob(file,512,0.85);
    const path=`${user.id}/avatar_${Date.now()}.jpg`;
    const {error}=await db.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});
    if(error) throw new Error(error.message);
    const url=db.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    const {data,error:e2}=await db.auth.updateUser({data:{avatar:url}});
    if(e2) throw new Error(e2.message);
    user=data.user; toast("Фото профиля сохранено","ok"); accountView();
  }catch(err){ toast("Ошибка: "+err.message,"err"); }
}
async function deleteAccount(){
  if(!confirm("Удалить аккаунт? Все ваши товары и заявки будут удалены без восстановления.")) return;
  const {error}=await db.rpc("delete_my_account");
  if(error) return toast("Ошибка: "+error.message,"err");
  await db.auth.signOut();
  user=null; renderNav(); location.hash="#/";
  toast("Аккаунт удалён","ok"); route();
}
