<link rel="preconnect" href="https://fonts.googleapis.com">

header b{font-size:18px;font-weight:800}
header a{color:#fff;text-decoration:none;font-size:14px;font-weight:600}
main{padding:12px 12px 20px}
h3{font-size:16px;font-weight:700;margin:18px 0 8px}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;font-family:inherit}
button{background:var(--p);color:#fff;border:0;padding:12px 16px;border-radius:12px;font-size:15px;font-weight:600;width:100%;margin:6px 0;cursor:pointer}
button.s{width:auto;background:#6b6b80;padding:7px 11px;font-size:13px;margin:3px 4px 0 0}
button.r{width:auto;background:#e11d48;padding:7px 11px;font-size:13px;margin:3px 4px 0 0}
button:disabled{opacity:.5}

.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 0;gap:8px;flex-wrap:wrap}
.muted{color:var(--mut);font-size:13px}
.err{color:#dc2626;font-size:14px}
.note{background:#fff3cd;border-radius:10px;padding:8px;margin:6px 0;font-size:14px}
.gal{display:flex;overflow-x:auto;gap:8px;margin:6px 0}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 2px 8px #0001}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--p)}
.stat span{font-size:12px;color:var(--mut)}
.item{background:#fff;border-radius:16px;padding:12px;margin:8px 0;box-shadow:0 2px 8px #0001;cursor:pointer}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.badge{background:#e11d48;color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;margin-right:6px}
.prev{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.log{background:#f7f5fc;border-radius:12px;padding:10px;height:48vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.admin{align-self:flex-end;background:var(--p);color:#fff;border-bottom-right-radius:4px}
.msg img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:6px}
.time{font-size:11px;opacity:.6;margin-top:3px;text-align:right}

.rform textarea{flex:1;height:50px;margin:0}
.rform button{width:auto;margin:0;padding:0 16px}

<div class="app">
<header><b>Админ-панель</b><div id="nav"></div></header>
<main id="app">Загрузка...</main>
</div>
<script>
const SB_URL="https://fwvvnzrprjffsmkpvhrl.supabase.co";
const SB_KEY="sb_publishable_wJYMx4Gs-NlZXUBFedcVaQ_H30wRYUz";
const FEE_TEXT="1 сомони таджикский";
const PHOTO_MONTHS=5;
const db=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const fdate=t=>new Date(t).toLocaleDateString("ru-RU");
const DAY=86400000;
function ago(t){
  const d=Math.floor((Date.now()-new Date(t))/DAY);
  if(d<1) return "сегодня";
  if(d<7) return d+" дн. назад";
  if(d<30) return Math.floor(d/7)+" нед. назад";
  if(d<365) return Math.floor(d/30)+" мес. назад";
  return Math.floor(d/365)+" г. назад";
}
let user=null, CATS=[], COUNTRIES=[], CITIES=[], TIMER=null;
let CHATS=[], OPEN=null, UNREAD=0, PENDING=0, SELLERS=0;
const SEEN="adm_seen";
const seen=()=>{ try{ return JSON.parse(localStorage.getItem(SEEN)||"{}"); }catch(e){ return {}; } };
const setSeen=o=>{ try{ localStorage.setItem(SEEN,JSON.stringify(o)); }catch(e){} };

// ---------- ОТПЕЧАТОК ФОТО ----------
const gray=(d,k)=>0.299*d[k]+0.587*d[k+1]+0.114*d[k+2];
function loadImg(src){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.crossOrigin="anonymous";
    im.onload=()=>res(im);
    im.onerror=()=>rej(new Error("image"));
    im.src=src;
  });
}
async function dhash(src){
  const im=await loadImg(src);
  const c=document.createElement("canvas");
  c.width=9; c.height=8;
  const x=c.getContext("2d");
  x.drawImage(im,0,0,9,8);
  const d=x.getImageData(0,0,9,8).data;
  let bits="";
  for(let y=0;y<8;y++) for(let i=0;i<8;i++){
    const a=gray(d,(y*9+i)*4), b=gray(d,(y*9+i+1)*4);
    bits+=a>b?"1":"0";
  }
  return BigInt("0b"+bits).toString(16).padStart(16,"0");
}
const pathOf=u=>{
  const m=String(u||"").split("/object/public/product-photos/")[1];
  return m?decodeURIComponent(m.split("?")[0]):null;
};

// ---------- ВХОД ----------
async function init(){
  const {data}=await db.auth.getSession();
  user=data.session?.user||null;
  if(!user) return loginView();
  if(!(await isAdmin())) return location.replace("../");
  panel();
}
async function isAdmin(){
  const {data}=await db.from("admins").select("user_id").eq("user_id",user.id);
  return !!(data&&data.length);
}
function loginView(){
  $("#app").innerHTML=`
    <h3>Вход</h3>
    <input id="em" type="email" placeholder="Email">
    <input id="pw" type="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <p id="msg" class="muted"></p>`;
}
async function login(){
  const {data,error}=await db.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(error){ $("#msg").textContent="Неверный email или пароль."; return; }
  user=data.user;
  if(!(await isAdmin())) return location.replace("../");

}
async function logout(){ await db.auth.signOut(); location.replace("../"); }

// ---------- ПАНЕЛЬ ----------
function panel(){
  $("#nav").innerHTML=`<a href="#" onclick="logout();return false">Выход</a>`;
  $("#app").innerHTML=`
    <div class="alert" id="notice">Страница обновляется каждые 20 секунд.</div>
    <h3>Статистика</h3><div id="stats" class="stat"></div>
    <h3>Сохибкорон</h3><div id="sellers">Загрузка...</div>
    <h3>Чаты поддержки</h3><div id="chatlist">Загрузка...</div><div id="chatbox"></div>
    <h3>Заявки на товары</h3><div id="mod">Загрузка...</div>
    <h3>Каталог магазина</h3>
    <button onclick="openForm(null)">+ Добавить товар в каталог</button>
    <div id="formbox"></div>
    <div id="catalog"></div>
    <h3>Категории</h3><div id="cats"></div>
    <h3>Страны</h3><div id="countries"></div>
    <h3>Города</h3><div id="cities"></div>`;
  refreshAll();
  loadTaxonomy();
  clearInterval(TIMER);
  TIMER=setInterval(refreshAll,20000);
}
async function refreshAll(){
  await cleanExpired();
  await Promise.all([loadChats(),loadSellers(),loadMod(),loadCatalog()]);
  renderStats();
  updateTitle();
}
function updateTitle(){
  const n=PENDING+UNREAD;
  document.title=n?`(${n}) Админ`:"Админ";
  const el=$("#notice");
  if(el) el.textContent=n
    ? `Новых: ${UNREAD} сообщений поддержки, ${PENDING} заявок на товары.`
    : "Новых сообщений и заявок нет. Страница обновляется каждые 20 секунд.";
}
function renderStats(){
  const el=$("#stats"); if(!el) return;
  el.innerHTML=`
    <div><b>${SELLERS}</b><span>сохибкор</span></div>
    <div><b>${PENDING}</b><span>заявок</span></div>
    <div><b>${UNREAD}</b><span>сообщений</span></div>`;
}

// ---------- ФОТО, СРОК 5 МЕСЯЦЕВ ----------
async function cleanExpired(){
  const {data}=await db.from("products").select("id,photos")
    .eq("status","published").lte("photos_until",new Date().toISOString());
  for(const p of (data||[]).filter(x=>x.photos?.length)){
    const paths=p.photos.map(pathOf).filter(Boolean);
    if(paths.length) await db.storage.from("product-photos").remove(paths);
    await db.from("products").update({photos:[]}).eq("id",p.id);
  }
}

// ---------- ПРОДАВЦЫ ----------
async function loadSellers(){
  const {data,error}=await db.rpc("admin_sellers");
  if(!$("#sellers")) return;
  if(error){ $("#sellers").innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  const list=data||[];
  SELLERS=list.length;
  $("#sellers").innerHTML=list.map(s=>`
    <div class="row">
      <div><b>${esc(s.email||"—")}</b><div class="muted">${fdate(s.created_at)} · товаров: ${s.products_count}</div></div>
      <button class="r" onclick="delSeller('${s.user_id}','${esc(s.email)}')">Удалить</button>
    </div>`).join("")||'<p class="muted">Сохибкоров пока нет</p>';
}
async function delSeller(uid,email){
  if(!confirm(`Удалить аккаунт ${email} и все его товары?`)) return;
  const {error}=await db.rpc("admin_delete_seller",{p_uid:uid});
  if(error) return alert("Ошибка: "+error.message);
  refreshAll();
}

// ---------- ЧАТЫ ПОДДЕРЖКИ ----------
async function loadChats(){
  const {data,error}=await db.from("support_messages")
    .select("id,conv_key,sender,body,seller_email,attachment,created_at").order("created_at");
  if(!$("#chatlist")) return;
  if(error){ $("#chatlist").innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  CHATS=data||[];
  renderChatList();
  if(OPEN) loadOpenChat(false);
}
function groups(){
  const map={};
  CHATS.forEach(m=>{
    const g=map[m.conv_key]||(map[m.conv_key]={key:m.conv_key,last:null,email:"",unread:0});
    g.last=m;
    if(m.seller_email) g.email=m.seller_email;
  });
  const sn=seen();
  CHATS.forEach(m=>{
    if(m.sender!=="user") return;
    const s=sn[m.conv_key];
    if(!s||new Date(m.created_at)>new Date(s)) map[m.conv_key].unread++;
  });
  return Object.values(map).sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at));
}
function renderChatList(){
  const gs=groups();
  UNREAD=gs.reduce((s,g)=>s+g.unread,0);
  $("#chatlist").innerHTML=gs.map(g=>`
    <div class="item" onclick="openChat('${g.key}')">
      <div class="top">
        <b>${esc(g.email||"Гость")}</b>
        <span>${g.unread?`<span class="badge">${g.unread}</span>`:""}<span class="muted">${fmt(g.last.created_at)}</span></span>
      </div>
      <div class="muted prev">${g.last.sender==="admin"?"Вы: ":""}${esc(g.last.body)}</div>
    </div>`).join("")||'<p class="muted">Сообщений пока нет</p>';
}
function openChat(key){
  OPEN=key;
  const g=groups().find(x=>x.key===key);
  $("#chatbox").innerHTML=`
    <div class="card">
      <div class="chat-head"><button class="s" onclick="closeChat()">✕ Закрыть</button><b>${esc(g?.email||"Гость")}</b></div>
      <div id="log" class="log"></div>
      <form class="rform" onsubmit="reply(event)">
        <textarea id="rt" placeholder="Ответ клиенту..." maxlength="1000"></textarea>
        <button id="rbtn">Отправить</button>
      </form>
      <p id="rerr" class="err"></p>
    </div>`;
  loadOpenChat(true);
  renderChatList();
}
function closeChat(){
  OPEN=null;
  $("#chatbox").innerHTML="";
  renderChatList();
}
function loadOpenChat(scroll){
  const log=$("#log"); if(!log||!OPEN) return;
  const near=log.scrollHeight-log.scrollTop-log.clientHeight<100;
  const list=CHATS.filter(m=>m.conv_key===OPEN);
  log.innerHTML=list.map(m=>`
    <div class="msg ${m.sender==="admin"?"admin":"user"}">${m.attachment?`<img src="${esc(m.attachment)}">`:""}${m.body&&m.body!=="📷 Фото"?esc(m.body):""}<div class="time">${fmt(m.created_at)}</div></div>`).join("")
    ||'<p class="muted">Сообщений нет</p>';
  if(scroll||near) log.scrollTop=log.scrollHeight;
  const sn=seen(); sn[OPEN]=new Date().toISOString(); setSeen(sn);
}
async function reply(e){
  e.preventDefault();
  const t=$("#rt"), body=t.value.trim();
  if(!body) return;
  $("#rbtn").disabled=true; $("#rerr").textContent="";
  const {error}=await db.rpc("support_admin_reply",{p_key:OPEN,p_body:body});
  $("#rbtn").disabled=false;
  if(error){ $("#rerr").textContent=error.message; return; }
  t.value="";
  await loadChats();
}

// ---------- ЗАЯВКИ НА ТОВАРЫ ----------
async function loadMod(){
  const {data,error}=await db.from("products")
    .select("id,title,price,min_order,created_at,draft_photos,owner_email,seller_phone,seller_email,instagram,quality,origin_country,address,payment_comment,receipt_url,cities(name),countries(name),categories(name)")
    .eq("status","pending_review").order("created_at");
  if(!$("#mod")) return;
  if(error){ $("#mod").innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  const list=data||[];
  PENDING=list.length;
  if(!list.length){ $("#mod").innerHTML='<p class="muted">Заявок нет</p>'; return; }
  const rows=await Promise.all(list.map(async p=>{
    let photos=[];
    if(p.draft_photos?.length){
      const {data:ds}=await db.storage.from("product-drafts").createSignedUrls(p.draft_photos,3600);
      photos=(ds||[]).map(d=>d.signedUrl).filter(Boolean);
    }
    let receiptUrl="#";
    if(p.receipt_url){
      const {data:rc}=await db.storage.from("receipts").createSignedUrl(p.receipt_url,3600);
      receiptUrl=rc?.signedUrl||"#";
    }
    return `<div class="card">
      <b>${esc(p.title)}</b> · ${p.price} ₽ · мин. ${p.min_order} шт
      <div class="muted">Подано: ${ago(p.created_at)} (${fdate(p.created_at)})</div>
      <div class="muted">${esc(p.countries?.name||"")}, ${esc(p.cities?.name||"")} · ${esc(p.categories?.name||"")}</div>
      <div class="muted">Качество: ${esc(p.quality||"—")} · Производство: ${esc(p.origin_country||"—")}</div>
      <div class="muted">Адрес: ${esc(p.address||"—")}</div>
      <div class="muted">Сохибкор: ${esc(p.owner_email||"—")} · Тел: ${esc(p.seller_phone||"—")} · Email: ${esc(p.seller_email||"—")}${p.instagram?` · Instagram: ${esc(p.instagram)}`:""}</div>
      <div class="note">Комментарий к переводу: <b>${esc(p.payment_comment||"—")}</b></div>
      <a href="${esc(receiptUrl)}" target="_blank" rel="noopener">Открыть чек (${FEE_TEXT})</a>
      <div class="gal">${photos.map(u=>`<img src="${esc(u)}">`).join("")}</div>
      <button onclick="approve(${p.id})">Разрешить</button>
      <button class="s" onclick="reject(${p.id})">Отменить</button>
    </div>`;
  }));
  $("#mod").innerHTML=rows.join("");
}
async function approve(id){
  try{
    const {data:p,error:e0}=await db.from("products").select("id,draft_photos").eq("id",id).maybeSingle();
    if(e0||!p) throw new Error(e0?.message||"товар не найден");
    const drafts=p.draft_photos||[];
    if(drafts.length<3) throw new Error("у товара меньше 3 фото");
    const urls=[]; let hash=null;
    for(const [i,path] of drafts.entries()){
      const {data:blob,error:e1}=await db.storage.from("product-drafts").download(path);
      if(e1||!blob) throw new Error(e1?.message||"фото не найдено");
      if(i===0){ try{ hash=await dhash(URL.createObjectURL(blob)); }catch(e){} }
      const np=`${user.id}/${Date.now()}_${i}.jpg`;
      const {error:e2}=await db.storage.from("product-photos").upload(np,blob,{contentType:blob.type||"image/jpeg"});
      if(e2) throw new Error(e2.message);
      urls.push(db.storage.from("product-photos").getPublicUrl(np).data.publicUrl);
    }
    const now=new Date(); const until=new Date(now); until.setMonth(until.getMonth()+PHOTO_MONTHS);
    const row={photos:urls,draft_photos:[],status:"published",published_at:now.toISOString(),photos_until:until.toISOString()};
    if(hash) row.img_hash=hash;
    const {error:e3}=await db.from("products").update(row).eq("id",id);
    if(e3) throw new Error(e3.message);
    await db.storage.from("product-drafts").remove(drafts);
    refreshAll();
  }catch(err){
    alert("Ошибка: "+err.message);
  }
}
async function reject(id){
  const {error}=await db.from("products").update({status:"rejected"}).eq("id",id);
  if(error) alert("Ошибка: "+error.message);
  refreshAll();
}

// ---------- КАТАЛОГ МАГАЗИНА ----------
async function loadCatalog(){
  const {data}=await db.from("products").select("id,title,price").is("seller_id",null).order("created_at",{ascending:false});

  $("#catalog").innerHTML=(data||[]).map(p=>`
    <div class="row">
      <div><b>${esc(p.title)}</b><div class="muted">${p.price} ₽</div></div>
      <div><button class="s" onclick="openForm(${p.id})">Изменить</button> <button class="r" onclick="delCatalog(${p.id})">Удалить</button></div>

}

    const {data}=await db.from("products").select("*").eq("id",id).maybeSingle();
    if(!data) return;
    p=data;

    <div class="card">

      <input id="f_t" placeholder="Название" value="${esc(p.title)}">
      <textarea id="f_d" rows="3" placeholder="Описание">${esc(p.description)}</textarea>
      <select id="f_c"><option value="">Категория или модель телефона</option>${catOptions(CATS,p.category_id,true)}</select>

      <input id="f_ph" type="tel" placeholder="Телефон" value="${esc(p.seller_phone)}">
      <input id="f_em" type="email" placeholder="Email" value="${esc(p.seller_email)}">
      <input id="f_ig" placeholder="Instagram (необязательно)" value="${esc(p.instagram)}">
      <p class="muted">Фото: ${id?"если выберете новые, они заменят старые":"от 1 до 6"}, из галереи.</p>
      <input id="f_files" type="file" accept="image/*" multiple>
      <button onclick="saveCatalog(${id?id:"null"})">Сохранить</button>
      <button class="s" onclick="$('#formbox').innerHTML=''">Отмена</button>
      <p id="f_msg" class="muted"></p>
    </div>`;
  $("#formbox").scrollIntoView();
}
function fCountry(){
  const k=$("#f_k").value;
  $("#f_ci").innerHTML=`<option value="">Город</option>${k?cityOptions(k,null):""}`;
}
async function saveCatalog(id){
  const msg=$("#f_msg");
  const title=$("#f_t").value.trim(), desc=$("#f_d").value.trim();
  const cat=+$("#f_c").value, country=+$("#f_k").value, city=+$("#f_ci").value;
  const price=+$("#f_p").value, min=+$("#f_m").value;
  const phone=$("#f_ph").value.trim(), email=$("#f_em").value.trim(), ig=$("#f_ig").value.trim();
  const files=[...$("#f_files").files];
  if(!title||!price||!min||!cat||!country||!city){ msg.textContent="Заполните название, категорию, страну, город, цену и минимальный заказ."; return; }
  if(!id&&files.length<1){ msg.textContent="Добавьте хотя бы 1 фото."; return; }
  if(files.length>6){ msg.textContent="Не больше 6 фото."; return; }
  msg.textContent="Сохраняем...";
  try{
    const row={title,description:desc,category_id:cat,country_id:country,city_id:city,price,min_order:min,
      seller_phone:phone||null,seller_email:email||null,instagram:ig||null};
    if(files.length){
      const photos=[];
      for(const [i,f] of files.entries()){
        const path=`${user.id}/${Date.now()}_${i}.jpg`;
        const {error}=await db.storage.from("product-photos").upload(path,f,{contentType:f.type||"image/jpeg"});
        if(error) throw new Error(error.message);
        photos.push(db.storage.from("product-photos").getPublicUrl(path).data.publicUrl);
      }
      row.photos=photos;
      try{ row.img_hash=await dhash(URL.createObjectURL(files[0])); }catch(e){}
    }
    if(id){
      const {error}=await db.from("products").update(row).eq("id",id);
      if(error) throw new Error(error.message);
    } else {
      row.seller_id=null; row.status="published";
      row.published_at=new Date().toISOString();
      row.photos_until="2099-12-31T00:00:00Z";
      const {error}=await db.from("products").insert(row);
      if(error) throw new Error(error.message);
    }
    $("#formbox").innerHTML="";
    refreshAll();
  }catch(err){
    msg.textContent="Ошибка: "+err.message;
  }
}
async function delCatalog(id){
  if(!confirm("Удалить товар из каталога?")) return;
  const {error}=await db.from("products").delete().eq("id",id);
  if(error) return alert("Ошибка: "+error.message);
  loadCatalog();
}

// ---------- КАТЕГОРИИ, СТРАНЫ, ГОРОДА ----------
async function loadRefs(){
  const [{data:cats},{data:countries},{data:cities}]=await Promise.all([
    db.from("categories").select("*").order("name"),
    db.from("countries").select("*").order("name"),
    db.from("cities").select("*").order("name")
  ]);
  CATS=cats||[]; COUNTRIES=countries||[]; CITIES=cities||[];
}
function treeOrder(list){
  const byParent={};
  list.forEach(c=>{ const k=c.parent_id??"root"; (byParent[k]??=[]).push(c); });
  const out=[];
  const walk=(pid,d)=>(byParent[pid]||[]).forEach(c=>{ out.push({c,d}); walk(c.id,d+1); });
  walk("root",0);
  return out;
}
function catOptions(list,sel,leafOnly){
  const items=treeOrder(list||[]);
  const hasKids=id=>items.some(x=>x.c.parent_id===id);
  return items.filter(x=>!leafOnly||!hasKids(x.c.id))
    .map(({c,d})=>`<option value="${c.id}" ${c.id==sel?"selected":""}>${"— ".repeat(d)}${esc(c.name)}</option>`).join("");
}
function countryOptions(sel){
  return COUNTRIES.map(k=>`<option value="${k.id}" ${k.id==sel?"selected":""}>${esc(k.name)}</option>`).join("");
}
function cityOptions(countryId,sel){
  return CITIES.filter(c=>!countryId||c.country_id==countryId)
    .map(c=>`<option value="${c.id}" ${c.id==sel?"selected":""}>${esc(c.name)}</option>`).join("");
}
function isDescendant(x,anc){
  let cur=CATS.find(c=>c.id===x);
  for(let i=0;cur&&i<50;i++){
    if(cur.parent_id===anc) return true;
    cur=CATS.find(c=>c.id===cur.parent_id);
  }
  return false;
}
async function loadTaxonomy(){
  await loadRefs();
  if(!$("#cats")) return;
  $("#cats").innerHTML=`
    <div class="card">
      <input id="cn" placeholder="Название категории или модели телефона">
      <select id="pc"><option value="">— корневая категория —</option>${catOptions(CATS,null,false)}</select>
      <button onclick="addCat()">Добавить категорию</button>
    </div>
    ${treeOrder(CATS).map(({c,d})=>`
      <div class="row" id="cat-${c.id}">
        <span>${"&nbsp;&nbsp;&nbsp;&nbsp;".repeat(d)}${esc(c.name)}</span>
        <div><button class="s" onclick="editCat(${c.id})">Изменить</button> <button class="r" onclick="delCat(${c.id})">Удалить</button></div>
      </div>`).join("")}`;
  $("#countries").innerHTML=`
    <div class="card">
      <input id="kn" placeholder="Название страны">
      <button onclick="addCountry()">Добавить страну</button>
    </div>
    ${COUNTRIES.map(k=>`
      <div class="row">
        <span>${esc(k.name)}</span>
        <div><button class="s" onclick="editCountry(${k.id})">Изменить</button> <button class="r" onclick="delCountry(${k.id})">Удалить</button></div>
      </div>`).join("")}`;
  const countryName=id=>COUNTRIES.find(k=>k.id==id)?.name||"";
  $("#cities").innerHTML=`
    <div class="card">
      <select id="cc"><option value="">— страна —</option>${countryOptions(null)}</select>
      <input id="ctn" placeholder="Название города">
      <button onclick="addCity()">Добавить город</button>
    </div>
    ${CITIES.map(c=>`
      <div class="row">
        <span>${esc(c.name)} <span class="muted">(${esc(countryName(c.country_id))})</span></span>
        <div><button class="s" onclick="editCity(${c.id})">Изменить</button> <button class="r" onclick="delCity(${c.id})">Удалить</button></div>
      </div>`).join("")}`;
}
async function addCat(){
  const name=$("#cn").value.trim(); if(!name) return;
  const pid=$("#pc").value;
  const {error}=await db.from("categories").insert({name,parent_id:pid?+pid:null});
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
function editCat(id){
  const c=CATS.find(x=>x.id===id); if(!c) return;
  const options=CATS.filter(x=>x.id!==id&&!isDescendant(x.id,id));
  $("#cat-"+id).outerHTML=`
    <div class="card" id="cat-${id}">
      <input id="ecn-${id}" value="${esc(c.name)}">
      <select id="epc-${id}">
        <option value="" ${c.parent_id==null?"selected":""}>— корневая категория —</option>
        ${catOptions(options,c.parent_id,false)}
      </select>
      <button onclick="saveCat(${id})">Сохранить</button>
      <button class="s" onclick="loadTaxonomy()">Отмена</button>
    </div>`;
}
async function saveCat(id){
  const name=$("#ecn-"+id).value.trim();
  const pid=$("#epc-"+id).value;
  if(!name) return alert("Введите название");
  const {error}=await db.from("categories").update({name,parent_id:pid?+pid:null}).eq("id",id);
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function delCat(id){
  if(!confirm("Удалить категорию вместе с вложенными?")) return;
  const {error}=await db.from("categories").delete().eq("id",id);
  if(error) return alert("Нельзя удалить: "+error.message);
  loadTaxonomy();
}
async function addCountry(){
  const name=$("#kn").value.trim(); if(!name) return;
  const {error}=await db.from("countries").insert({name});
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function editCountry(id){
  const k=COUNTRIES.find(x=>x.id===id);
  const name=prompt("Новое название страны",k?k.name:"");
  if(!name||!name.trim()) return;
  const {error}=await db.from("countries").update({name:name.trim()}).eq("id",id);
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function delCountry(id){
  if(!confirm("Удалить страну? Это невозможно, если в ней есть города или товары.")) return;
  const {error}=await db.from("countries").delete().eq("id",id);
  if(error) return alert("Нельзя удалить: "+error.message);
  loadTaxonomy();
}
async function addCity(){
  const name=$("#ctn").value.trim(), cid=+$("#cc").value;
  if(!name||!cid) return alert("Выберите страну и введите город");
  const {error}=await db.from("cities").insert({name,country_id:cid});
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function editCity(id){
  const c=CITIES.find(x=>x.id===id);
  const name=prompt("Новое название города",c?c.name:"");
  if(!name||!name.trim()) return;
  const {error}=await db.from("cities").update({name:name.trim()}).eq("id",id);
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function delCity(id){
  if(!confirm("Удалить город?")) return;
  const {error}=await db.from("cities").delete().eq("id",id);
  if(error) return alert("Нельзя удалить: "+error.message);
  loadTaxonomy();
}

init();
