<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://fwvvnzrprjffsmkpvhrl.supabase.co; base-uri 'self'; form-action 'self'">
<title>Кабинет продавца · 700 OPTOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--r:#e11d1d;--r2:#ff3b3b;--rd:#7f1d1d;--k:#000;--card:#101010;--card2:#171717;--line:#1e1e1e;--t:#f5f5f5;--m:#8a8a8a;--ok:#16a34a;--gold:#facc15;--wa:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding-bottom:104px}
body.nologin{padding-bottom:0}
body.nologin .bottom{display:none}
body.chatmode{padding-bottom:0}
body.chatmode .bottom{display:none}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 14px 8px;background:#000}
.logo{cursor:pointer;display:flex;flex-direction:column;line-height:1;user-select:none}
.logo .l7{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-style:italic;font-size:26px;letter-spacing:-2px;position:relative;display:inline-block}
.logo .l7:after{content:"";position:absolute;right:-12px;top:11px;width:19px;height:4px;background:var(--r);transform:skewX(-30deg);box-shadow:0 0 8px var(--r)}
.logo .lo{font-weight:800;font-size:10px;letter-spacing:5px;margin-top:3px;padding-left:3px}
.logo .lo2{font-size:9px;letter-spacing:3px;color:var(--m);font-weight:700;margin-top:2px}
.ibtn{width:44px;height:44px;border-radius:50%;background:#121212;border:1px solid #232323;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-decoration:none;font-size:18px}
.wrap{max-width:620px;margin:0 auto;padding:10px 14px 20px;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
h2{font-size:22px;font-weight:900;letter-spacing:-.4px;margin:12px 0 8px}
h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--m);margin:20px 0 8px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;background:linear-gradient(135deg,#e11d1d 0%,#7f1d1d 55%,#000 100%);box-shadow:0 14px 34px #e11d1d55;display:flex;gap:14px;align-items:center;margin-top:4px}
.hero:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff14;right:-80px;top:-90px}
.hero>*{position:relative;z-index:1}
.av{width:62px;height:62px;border-radius:50%;background:#000;border:2px solid #fff;overflow:hidden;flex:0 0 62px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.hi{font-size:18px;font-weight:900;word-break:break-all}
.hs{font-size:13px;opacity:.92;margin-top:4px;line-height:1.4}
.hrev{display:inline-block;margin-top:8px;background:#000c;border:0;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:15px;border:0;background:linear-gradient(180deg,#ef2a2a,#c81616);color:#fff;font:800 15px Inter,sans-serif;box-shadow:0 8px 22px #e11d1d55;cursor:pointer;margin:8px 0;text-decoration:none;transition:transform .1s,background .25s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.sm{width:auto;height:40px;padding:0 16px;font-size:13px;border-radius:12px;margin:0}
.btn.ok{background:#16a34a!important;box-shadow:0 8px 22px #16a34a55}
.btn.n{background:#1a1a1a;border:1px solid #2a2a2a;box-shadow:none}
.btn.no{background:#b91c1c}
.btn.dl{background:#2a0a0a;border:1px solid #5a1313;color:#fca5a5;box-shadow:none}
.btn.busy{background:#4a4a4a!important;box-shadow:none}
.btn.fail{background:#7f1d1d!important}
.btn:disabled{cursor:default}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
.link{background:none;border:0;color:var(--r2);font-weight:700;font-size:14px;cursor:pointer;padding:8px 0;font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.sec h4{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.req{background:var(--r);color:#fff;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap}
input,select,textarea{width:100%;padding:14px;margin:6px 0;border:1px solid #222;border-radius:14px;font-size:16px;background:var(--card2);color:var(--t);font-family:inherit}
input::placeholder,textarea::placeholder{color:#5f5f5f}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--r)}
.bad{border-color:var(--r)!important;box-shadow:0 0 0 3px #e11d1d33}
.ferr{color:var(--r2);font-size:13px;font-weight:700;margin:-2px 2px 6px;min-height:0}
.hint{color:var(--m);font-size:12px;margin:-2px 2px 8px;line-height:1.5}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{background:transparent;color:var(--m);border:0;border-radius:12px;padding:11px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.seg button.on{background:linear-gradient(180deg,#ef2a2a,#c81616);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--m);margin:8px 0 4px;line-height:1.4}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--r);flex:0 0 20px}
.chk a{color:var(--r2);font-weight:700}
.err{color:var(--r2);font-size:14px;font-weight:700;margin-top:10px;min-height:18px;line-height:1.4}
.okt{color:#4ade80;font-size:14px;font-weight:700;margin-top:10px}
.muted{color:var(--m);font-size:13px;line-height:1.5}
.crumbs{font-size:13px;color:var(--m);margin:6px 0 10px;line-height:1.5}
.crumbs a{color:var(--r2);text-decoration:none;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{position:relative;border-radius:20px;background:var(--card);border:1px solid var(--line);aspect-ratio:1.4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}
.tile span{font-size:30px}
.tile b{font-size:14px;font-weight:800;padding:0 8px}
.tile.img:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#000d 100%)}
.tile.img b{position:relative;z-index:1;align-self:flex-end;padding-bottom:12px}
.catrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin:8px 0;cursor:pointer}
.catrow .ci{width:54px;height:54px;border-radius:14px;background:var(--card2) center/cover;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 54px}
.catrow b{flex:1;font-size:15px;font-weight:700}
.catrow i{color:var(--r);font-style:normal;font-size:22px;font-weight:700}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--m);margin-bottom:10px}
.pill b{color:var(--t)}
.prod{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin:10px 0}
.prow{display:flex;gap:12px}
.pimg{width:80px;height:80px;border-radius:16px;object-fit:cover;background:var(--card2);flex:0 0 80px}
.pph{width:80px;height:80px;border-radius:16px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 80px}
.pt{flex:1;min-width:0}
.pt b{display:block;font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{color:#fca5a5;font-weight:900;font-size:15px;margin-top:2px}
.badge{display:inline-block;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;margin-top:6px}
.note{color:var(--m);font-size:12px;margin-top:6px;line-height:1.5}
.warn2{background:#1c0a0a;border:1px solid var(--rd);color:#fca5a5;border-radius:14px;padding:10px;font-size:13px;margin-top:10px;line-height:1.45}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.drop{border:1.5px dashed #3a3a3a;border-radius:16px;padding:12px;background:var(--card2)}
.drop.bad{border-color:var(--r)}
.addph{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#ef2a2a,#c81616);color:#fff;border-radius:14px;padding:14px;font-weight:800;cursor:pointer;font-size:15px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumbs:empty{display:none}
.thumbs .th{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#000}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:4px;right:4px;background:#000c;color:#fff;border:0;border-radius:999px;width:26px;height:26px;cursor:pointer;font-size:15px;padding:0}
.thumbs .cover{position:absolute;left:4px;bottom:4px;background:var(--r);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.tcard{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;color:var(--t);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:3px}
.tcard b{font-size:15px;font-weight:900}
.tcard span{font-size:11px;color:var(--m);line-height:1.35}
.tcard em{font-style:normal;font-size:12px;font-weight:800;margin-top:4px}
.tcard.on{border-color:var(--r);box-shadow:0 0 0 2px #e11d1d55}
.tcard.t3{background:linear-gradient(135deg,#2a2100,var(--card2))}
.tcard.t3 b,.tcard.t3 em{color:var(--gold)}
.tcard.t3.on{border-color:var(--gold);box-shadow:0 0 0 2px #facc1555}
.tinfo{font-size:13px;color:#fecaca;background:#1c0a0a;border:1px solid var(--rd);border-radius:12px;padding:10px;line-height:1.45;margin-top:6px}
.pcard{position:relative;width:100%;aspect-ratio:1.586;border-radius:22px;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#000 0%,var(--rd) 55%,var(--r) 100%);box-shadow:0 14px 30px #e11d1d40;overflow:hidden;margin:4px 0 10px}
.pcard:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#ffffff12;right:-90px;top:-110px}
.pcard .chip{width:42px;height:31px;border-radius:7px;background:linear-gradient(135deg,#fde68a,#f59e0b)}
.pcard .pbank{font-weight:800;font-size:14px;position:relative}
.pcard .pnum{font-size:18px;letter-spacing:2px;font-family:ui-monospace,Menlo,Consolas,monospace;position:relative}
.pcard .copy{position:absolute;right:12px;top:12px;background:#ffffff26;color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;z-index:2;font-family:inherit}
.warn{background:#1c0a0a;border:1px solid var(--rd);border-radius:14px;padding:12px;font-size:14px;line-height:1.5;color:#fecaca;margin:10px 0}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:8px 0;cursor:pointer;position:relative}
.item .ib{flex:1;min-width:0}
.it{display:flex;justify-content:space-between;gap:8px}
.prev{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--m);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--r2);flex:0 0 10px;box-shadow:0 0 0 4px #ef444433}

/* ЧАТ: пурра саросарӣ */
.chatwrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;display:flex;flex-direction:column;background:#000;z-index:30;overflow:hidden}
.wm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:0;user-select:none}
.wm b{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:min(58vw,240px);letter-spacing:-6px;line-height:.85;color:rgba(225,29,29,.06)}
.wm small{font-family:Inter,sans-serif;font-weight:800;font-size:min(8vw,28px);letter-spacing:.6em;padding-left:.6em;color:rgba(255,255,255,.05);margin-top:8px}
.chead{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:rgba(0,0,0,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #161616;position:relative;z-index:3}
.cbk{width:34px;height:34px;border-radius:50%;border:0;background:#161616;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:0 0 3px;flex:0 0 34px}
.cav{width:38px;height:38px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 38px;overflow:hidden;font-size:15px}
.cname{flex:1;min-width:0}
.cname b{display:block;font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cname span{font-size:12px;color:var(--m)}
.cmsgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:10px 10px 8px;position:relative;z-index:1}
.dsep{align-self:center;margin:8px 0 4px;font-size:11px;color:#bdbdbd;background:#161616cc;border:1px solid #222;border-radius:999px;padding:4px 11px}
.bub{max-width:80%;padding:7px 11px 5px;border-radius:18px;font-size:15px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere;position:relative}
.bub.me{align-self:flex-end;background:linear-gradient(180deg,#f0262a,#c81616);color:#fff;border-bottom-right-radius:6px;box-shadow:0 4px 12px #e11d1d33}
.bub.them{align-self:flex-start;background:#1a1a1a;color:#f2f2f2;border-bottom-left-radius:6px}
.bub.voice{padding:6px 8px 4px}
.bub a{color:#ffc2c2}
.bub img{display:block;max-width:100%;max-height:240px;border-radius:12px;margin-bottom:4px}
.vm{width:230px;max-width:100%;height:40px;display:block;margin-bottom:2px}
.bt{font-size:10px;opacity:.65;margin-top:2px;text-align:right}
.pcard2{align-self:flex-end;max-width:72%;display:flex;gap:8px;align-items:center;background:#161616;border:1px solid #2a2a2a;border-radius:14px;padding:6px;text-decoration:none;color:var(--t)}
.pcard2 img{width:50px;height:50px;border-radius:10px;object-fit:cover;background:#000;flex:0 0 50px}
.pcard2 .pi{min-width:0}
.pcard2 .pi b{display:block;font-size:12px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard2 .pi em{font-style:normal;font-size:12px;font-weight:900;color:#fca5a5;display:block;margin-top:2px}
.cprev{display:none;align-items:center;gap:8px;padding:6px 10px 0;position:relative;z-index:3;background:#000}
.cprev.on{display:flex}
.cprev img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.cx{background:#161616;border:1px solid #222;color:#fff;border-radius:999px;width:24px;height:24px;cursor:pointer;font-size:14px;padding:0}
.cform{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.92);border-top:1px solid #161616;position:relative;z-index:3}
.cpill{flex:1;min-width:0;display:flex;align-items:flex-end;gap:6px;background:#161616;border:1px solid #242424;border-radius:22px;padding:4px 8px 4px 6px;min-height:44px}
.cpill textarea{flex:1;min-width:0;border:0;background:none;color:#fff;font:15px/1.3 Inter,sans-serif;padding:9px 4px;margin:0;resize:none;max-height:110px;outline:none;width:auto}
.clip2{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:#9a9a9a;margin-bottom:3px}
.clip2 input{display:none}
.recbar{display:none;flex:1;min-width:0;align-items:center;gap:9px;height:44px;padding:0 14px;border-radius:22px;background:#2a0808;border:1px solid #5a1313;color:#fecaca;font-size:14px}
.recbar .rdot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:blink 1s infinite;flex:0 0 10px}
.recbar span{font-variant-numeric:tabular-nums;font-weight:700;min-width:36px}
.recbar em{font-style:normal;color:#e5a5a5;font-size:12px;margin-left:auto;white-space:nowrap}
.act{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:0;background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 6px 16px #22c55e55;touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.act svg{pointer-events:none}
.err2{color:#fca5a5;font-size:12px;font-weight:700;padding:0 14px 6px;background:#000;position:relative;z-index:3}
.cmt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:8px 0}
.cmt .rep{background:var(--card2);border-left:3px solid var(--r);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.rrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0;font-size:14px}
.stars{color:var(--gold);letter-spacing:1px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--m);margin:5px 0}
.bar span{width:34px}
.bar i{flex:1;height:8px;border-radius:6px;background:var(--card2);overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--r),var(--gold))}
.bar em{width:24px;text-align:right;font-style:normal}

/* НИЖНЕЕ МЕНЮ */
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:600px;height:76px;z-index:25;display:flex;align-items:center;justify-content:space-around;padding:0 6px;border-radius:999px;background:rgba(12,12,12,.94);border:1px solid #3a1212;box-shadow:0 0 28px #e11d1d44,inset 0 1px 0 #ffffff14;backdrop-filter:blur(12px)}
.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;text-decoration:none;font-size:11px;font-weight:600;height:100%;position:relative}
.bottom a svg{width:24px;height:24px}
.bottom a.on:after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:44px;height:3px;border-radius:3px;background:var(--r);box-shadow:0 0 10px var(--r)}
.bottom a.plus{flex:0 0 96px;max-width:96px;height:64px;margin-top:-6px;border-radius:999px;background:linear-gradient(180deg,#ff2d2d,#b91c1c);box-shadow:0 0 24px #e11d1d99,inset 0 1px 0 #ffffff33}
.bottom a.plus.on:after{display:none}
.bottom a.plus span{font-size:12px;font-weight:800}
.bottom a.plus svg{width:26px;height:26px}
.bottom .bd{position:absolute;top:-3px;left:calc(50% + 10px);background:var(--r2);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;min-width:16px;line-height:14px;text-align:center}

/* ХАБАРНОМА (ба монанди iOS) */

function beep(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.07);
  }catch(e){}
}

function toast(msg,type){
  const t=$("#toast"); if(!t) return;
  t.textContent=msg; t.className="toast show "+(type||"");
  clearTimeout(TT); TT=setTimeout(()=>{ t.className="toast"; },2800);
}
async function act(btn,fn,doneCls){
  if(!btn||btn.disabled) return false;
  const label=btn.dataset.label||btn.textContent.trim();
  btn.dataset.label=label;
  btn.disabled=true; btn.classList.add("busy");
  btn.innerHTML='<span class="spin"></span>Загрузка...';
  try{
    await fn();
    btn.classList.remove("busy");
    if(doneCls) btn.classList.add(doneCls);
    btn.innerHTML="✓ "+label;
    return true;
  }catch(e){
    btn.classList.remove("busy"); btn.classList.add("fail");
    btn.innerHTML="✕ "+label;
    toast(e.message||"Ошибка","err");
    setTimeout(()=>{ btn.disabled=false; btn.classList.remove("fail"); btn.innerHTML=label; },1600);
    return false;
  }
}

async function toDataUrl(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=0.7, out=c.toDataURL("image/jpeg",q);
    while(out.length>330000&&q>0.3){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
    if(out.length>330000) throw new Error("Фото слишком большое");
    return out;
  }finally{ URL.revokeObjectURL(url); }
}
async function toJpeg(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Не удалось сжать фото")),"image/jpeg",q));
  }finally{ URL.revokeObjectURL(url); }
}

      throw new Error(errText(error));
    }
    if(data.session) user=data.user;
    else note="Аккаунт создан. Войдите по email и паролю.";
  },"ok");
  if(done){
    if(user){ renderNav(); go("#/"); }
    else { MODE="login"; loginView(); const m=$("#authMsg"); if(m) m.textContent=note; }
  }
}
async function doLogin(btn){
  clearAll();
  const em=($("#em").value||"").trim(), pw=$("#pw").value;
  let ok=true;
  if(!em){ ferr("em","Введите email"); ok=false; }
  if(!pw){ ferr("pw","Введите пароль"); ok=false; }
  if(!ok) return;
  const done=await act(btn,async()=>{
    const {data,error}=await db.auth.signInWithPassword({email:em,password:pw});
    if(error){
      ferr("em","Неверный пароль или неверный email");
      ferr("pw","Неверный пароль или неверный email");
      throw new Error(errText(error));
    }
    user=data.user;
    if(await isAdmin()){ location.replace("../admin/"); throw new Error("Переход в админ-панель"); }
  },"ok");
  if(done){ renderNav(); go("#/"); }
}
async function forgot(){

async function thumbUrl(p){
  if(isLive(p)&&p.photos?.length) return p.photos[0];
  if(p.draft_photos?.length){
    const {data}=await db.storage.from("product-drafts").createSignedUrl(p.draft_photos[0],3600);

  }
  return "";
}
function prodRow(p,thumb){
  const expired=isExpired(p);
  const [label,color]=expired?["Срок размещения истёк","#d97706"]:(ST[p.status]||[p.status,"#737373"]);
  const tv=p.status==="published"?(p.tier||0):(p.requested_tier||0);
  const tn=(TIERS.find(t=>t.v===tv)||TIERS[0]).name;
  const dates=[`Добавлено: ${ago(p.created_at)}`,`Размещение: ${tn}`];
  if(isLive(p)&&p.photos_until) dates.push(`До: ${fdate(p.photos_until)}`);
  let b="";
  if(isLive(p)) b+=`<button class="btn sm n" onclick="go('#/edit/${p.id}')">✎ Изменить</button>`;
  if(expired||["rejected","awaiting_payment","draft"].includes(p.status)) b+=`<button class="btn sm" onclick="go('#/edit/${p.id}')">${expired?"Загрузить заново":"Исправить и отправить"}</button>`;
  if(p.status==="pending_review") b+=`<span class="muted">Ответ админа: 5–30 минут</span>`;
  b+=`<button class="btn sm dl" onclick="delProduct(${p.id})">🗑 Удалить</button>`;

  return `<div class="prod">
    <div class="prow">
      ${thumb?`<img class="pimg" src="${esc(thumb)}">`:`<div class="pph">📷</div>`}
      <div class="pt">
        <b>${esc(p.title)}</b>
        <div class="price">${p.price} ₽</div>
        <span class="badge" style="background:${color}">${label}</span>

function pickReceipt(f){

function setErr(key,msg){
  const e=document.querySelector(`.ferr[data-for="${key}"]`);
  if(e) e.textContent=msg||"";

function clearErrors(){
  document.querySelectorAll(".ferr").forEach(e=>e.textContent="");

function mark(key){
  const id={photos:"f_photos",contact:"f_phone",receipt:null,comment:"f_comment"}[key]??("f_"+key);
  const el=id?$("#"+id):null; if(el) el.classList.add("bad");

function validate(live){
  clearErrors();
  const v=k=>($("#f_"+k)?.value??"").trim();
  let ok=true;
  const need=(key,cond,msg)=>{ if(!cond){ setErr(key,msg); mark(key); ok=false; } };
  need("title",!!v("title"),"Заполните название товара");
  need("quality",!!v("quality"),"Укажите качество");
  need("origin",!!v("origin"),"Укажите страну производства");
  need("address",!!v("address"),"Укажите адрес");
  need("country",!!$("#f_country").value,"Выберите страну продажи");
  need("city",!!$("#f_city").value,"Выберите город");
  need("price",+v("price")>0,"Укажите цену за штуку");
  need("min",+v("min")>0,"Укажите минимальный заказ");
  need("contact",!!(v("phone")||v("email")),"Укажите телефон или email для связи");
  if(!live){
    need("photos",PHOTOS.length?(PHOTOS.length>=3&&PHOTOS.length<=6):(CURRENT_DRAFTS>=3),"Добавьте от 3 до 6 фото (обязательно)");
    if(feeOf(TIER_SEL)>0){
      need("receipt",!!RECEIPT,"Загрузите скриншот чека");
      need("comment",!!v("comment"),"Напишите название товара в комментарии к переводу");
    }
  }
  if(!ok) toast("Заполните отмеченные шаги (красным)","err");
  return ok;
}
async function submitProduct(btn,id,catId,live){
  if(!validate(live)) return;
  await act(btn,()=>saveProduct(id,catId,live),"ok");
}
async function saveProduct(id,catId,live){
  const v=k=>($("#f_"+k)?.value??"").trim();
  const fields={
    title:v("title"), description:v("desc")||null, category_id:catId,
    country_id:+$("#f_country").value, city_id:+$("#f_city").value,
    price:+v("price"), min_order:+v("min"),
    quality:v("quality"), origin_country:v("origin"), address:v("address"),
    seller_phone:v("phone")||null, seller_email:v("email")||null, instagram:v("ig")||null
  };
  if(live){
    const {error}=await db.from("products").update(fields).eq("id",id);
    if(error) throw new Error(error.message);
    toast("Изменения сохранены","ok"); return go("#/");
  }
  let drafts=null;
  if(PHOTOS.length){
    drafts=[];
    for(let i=0;i<PHOTOS.length;i++){
      const blob=await toJpeg(PHOTOS[i],1200,0.82);
      const path=`${user.id}/${Date.now()}_${i}.jpg`;
      const {error}=await db.storage.from("product-drafts").upload(path,blob,{contentType:"image/jpeg"});
      if(error) throw new Error(error.message);
      drafts.push(path);
    }
  }
  const fee=feeOf(TIER_SEL);
  let rpath=null;
  if(fee>0){
    const rblob=await toJpeg(RECEIPT,1400,0.85);
    rpath=`${user.id}/fee_${Date.now()}.jpg`;
    const {error:er}=await db.storage.from("receipts").upload(rpath,rblob,{contentType:"image/jpeg"});
    if(er) throw new Error("чек: "+er.message);
  }
  const common={...fields,requested_tier:TIER_SEL,status:"pending_review",receipt_url:rpath,
    payment_comment:fee>0?v("comment"):null,owner_email:user.email};
  if(!id){
    const {error}=await db.from("products").insert({...common,seller_id:user.id,draft_photos:drafts});
    if(error) throw new Error(error.message);
  } else {
    const row={...common};
    if(drafts){
      const {data:old}=await db.from("products").select("draft_photos").eq("id",id).maybeSingle();
      row.draft_photos=drafts;
      if(old?.draft_photos?.length) await db.storage.from("product-drafts").remove(old.draft_photos);
    }
    const {error}=await db.from("products").update(row).eq("id",id);
    if(error) throw new Error(error.message);
  }
  toast("Заявка отправлена. Ответ: 5–30 минут","ok");
  go("#/");
}

async function pollBadge(){
  if(!user) return;
  const {data}=await db.rpc("my_threads");
  const list=(data||[]).filter(t=>t.i_am_seller);
  const sn=seen(), nt=notified();
  let unread=0; const fresh=[];
  list.forEach(t=>{
    const isNew=!!t.last_at&&t.last_sender_id!==user.id&&(!sn[t.thread_id]||new Date(t.last_at)>new Date(sn[t.thread_id]));
    if(isNew){ unread++; if(!FIRST&&nt[t.thread_id]!==t.last_at) fresh.push(t); }
    nt[t.thread_id]=t.last_at;
  });
  setNotified(nt);
  const b=$("#bdChat"); if(b) b.textContent=unread||"";
  fresh.forEach(incomingNotice);
  FIRST=false;
  if($("#tl")) renderThreads(list);
}
function chatList(){
  setTab("chat");
  $("#app").innerHTML=`<div class="wrap"><h2>Чат с покупателями</h2><div id="tl"><p class="muted">Загрузка...</p></div></div>`;
  renderThreads();
}
async function renderThreads(preload){
  const data=preload||(await db.rpc("my_threads")).data;
  const el=$("#tl"); if(!el) return;
  const list=(preload||data||[]).filter(t=>t.i_am_seller);
  const sn=seen();
  el.innerHTML=list.map(t=>{
    const isNew=t.last_at&&t.last_sender_id!==user.id&&(!sn[t.thread_id]||new Date(t.last_at)>new Date(sn[t.thread_id]));
    return `<div class="item" onclick="go('#/chat/${t.thread_id}')">
      <div class="cav" style="width:44px;height:44px;flex:0 0 44px">${ini(t.other_name)}</div>
      <div class="ib"><div class="it"><b>${esc(t.other_name)}</b><span class="muted">${t.last_at?fmt(t.last_at):""}</span></div>
      <div class="prev">${esc(t.last_body||kindLabel(t))}</div></div>
      ${isNew?'<span class="dot"></span>':""}
    </div>`;
  }).join("")||'<p class="muted">Покупатели пока не писали. Когда напишут, диалоги появятся здесь.</p>';
}

// ---------- ЧАТ: ФУНКСИЯҲОИ ЁРИРАСОН ----------
function parseProductShare(body){
  const m=/🛍\s*(.+?)\s*—\s*(\d+(?:\.\d+)?)\s*₽/u.exec(body||"");
  const link=/https?:\/\/\S+#\/product\/(\d+)/.exec(body||"");
  if(!m||!link) return null;
  return {title:m[1],price:m[2],id:+link[1]};
}
async function productCard(pid){
  const {data}=await db.from("products").select("id,title,price,photos").eq("id",pid).maybeSingle();
  if(!data) return "";
  const img=data.photos?.[0]||"";
  return `<a class="pcard2" href="${esc(location.origin+location.pathname.replace(/seller\/?$/,"")+"#/product/"+data.id)}" target="_blank" rel="noopener">
    ${img?`<img src="${esc(img)}">`:`<div style="width:50px;height:50px;border-radius:10px;background:#000;flex:0 0 50px"></div>`}
    <div class="pi"><b>${esc(data.title)}</b><em>${data.price} ₽</em></div>
  </a>`;
}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>");
}
function bubbleHtml(m,mine){
  const a=m.attachment||"";
  const isVoice=a.startsWith("data:audio/");
  const media=isVoice?`<audio class="vm" controls preload="metadata" src="${esc(a)}"></audio>`:(a?`<img src="${esc(a)}">`:"");
  const txt=m.body?linkify(m.body):"";
  return `<div class="bub ${mine?"me":"them"}${isVoice?" voice":""}">${media}${txt}<div class="bt">${tm(m.created_at)}</div></div>`;
}

// ---------- ЧАТ С ПОКУПАТЕЛЕМ ----------
async function chatThread(tid){
  setTab("chat");
  const {data}=await db.rpc("my_threads");
  const t=(data||[]).find(x=>x.thread_id===tid&&x.i_am_seller);
  if(!t){ toast("Диалог не найден","err"); return go("#/chat"); }
  CH={tid,photo:null};
  const sn=seen(); sn[tid]=new Date().toISOString(); setSeen(sn);
  $("#app").innerHTML=`<div class="chatwrap">
    <div class="wm"><b>700</b><small>ОПТОМ</small></div>
    <div class="chead">
      <button class="cbk" onclick="go('#/chat')" aria-label="Назад">‹</button>
      <div class="cav">${ini(t.other_name)}</div>
      <div class="cname"><b>${esc(t.other_name)}</b><span>покупатель</span></div>
    </div>
    <div class="cmsgs" id="cmsgs"><p class="muted" style="margin:auto">Загрузка...</p></div>
    <div class="cprev" id="cprev"><img id="cpimg"><button class="cx" onclick="clearPhoto()">×</button></div>
    <form class="cform" onsubmit="sendMsg(event)">
      <div class="cpill" id="cpill">
        <label class="clip2">📎<input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this.files[0])"></label>
        <textarea id="ctxt" rows="1" placeholder="Сообщение" maxlength="1000" oninput="syncSend()"></textarea>
      </div>
      <div class="recbar" id="recbar"><i class="rdot"></i><span id="rtime">0:00</span><em>Отпустите, чтобы отправить</em></div>
      <button class="act" id="csend" type="submit" style="display:none" aria-label="Отправить">${SEND_SVG}</button>
      <button class="act" id="cmic" type="button" aria-label="Голосовое" oncontextmenu="return false"
        onpointerdown="recStart(event)" onpointerup="recStop(true)" onpointercancel="recStop(false)">${MIC_SVG}</button>
    </form>
    <p class="err2" id="cerr"></p>
  </div>`;
  syncSend();
  await loadMsgs(true);
  clearInterval(TIMER);
  TIMER=setInterval(()=>loadMsgs(false),8000);
}
async function loadMsgs(scroll){
  const box=$("#cmsgs"); if(!box||!CH.tid) return;
  const {data,error}=await db.from("buyer_messages").select("id,sender_id,body,attachment,created_at").eq("thread_id",CH.tid).order("created_at");
  if(!$("#cmsgs")) return;
  if(error){ box.innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  const rows=[];
  let lastDay="";
  for(const m of (data||[])){
    const d=new Date(m.created_at).toDateString();
    if(d!==lastDay){ rows.push(`<div class="dsep">${new Date(m.created_at).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}</div>`); lastDay=d; }
    const mine=m.sender_id===user.id;
    const pv=!mine?parseProductShare(m.body):null;
    if(pv){
      const card=await productCard(pv.id);
      const rest=(m.body||"").split("\n").filter(l=>!/🛍|https?:\/\//.test(l)).join("\n").trim();
      if(rest) rows.push(bubbleHtml({...m,body:rest,attachment:null},false));
      rows.push(card);
    } else {
      rows.push(bubbleHtml(m,mine));
    }
  }
  box.innerHTML=rows.join("")||'<p class="muted" style="margin:auto;text-align:center;font-size:13px">Напишите первое сообщение</p>';
  if(scroll||near) box.scrollTop=box.scrollHeight;
}
function syncSend(){
  const has=!!(($("#ctxt")?.value||"").trim()||CH.photo);
  const s=$("#csend"), m=$("#cmic");
  if(s) s.style.display=has?"flex":"none";
  if(m) m.style.display=has?"none":"flex";
}
async function pickPhoto(f){
  if(!f) return;
  try{ CH.photo=await toDataUrl(f,800); $("#cpimg").src=CH.photo; $("#cprev").classList.add("on"); $("#cerr").textContent=""; }
  catch(e){ CH.photo=null; $("#cerr").textContent=e.message; }
  syncSend();
}
function clearPhoto(){
  CH.photo=null;
  const p=$("#cprev"); if(p) p.classList.remove("on");
  const i=$("#cpimg"); if(i) i.src="";
  syncSend();
}
async function sendPayload(body,attach){
  const {error}=await db.rpc("send_buyer_message",{p_thread:CH.tid,p_body:body||"",p_attach:attach||null});
  if(error) throw new Error(error.message);
  const t=$("#ctxt"); if(t&&body) t.value="";
  clearPhoto();
  syncSend();
  await loadMsgs(true);
}
async function sendMsg(e){
  e.preventDefault();
  const body=($("#ctxt").value||"").trim();
  if(!body&&!CH.photo) return;
  try{ await sendPayload(body,CH.photo); }
  catch(err){ toast(err.message,"err"); }
}

// ---------- ГОЛОСОВОЕ ----------
function recUI(on){
  const cp=$("#cpill"), rb=$("#recbar");
  if(cp) cp.style.display=on?"none":"flex";
  if(rb) rb.style.display=on?"flex":"none";
  if(on){
    if($("#rtime")) $("#rtime").textContent="0:00";
    RECI=setInterval(()=>{ const s=Math.floor((Date.now()-RECT)/1000); const el=$("#rtime"); if(el) el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); },250);
  } else { clearInterval(RECI); RECI=null; }
}
async function recStart(e){
  e.preventDefault();
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  if(REC||HOLD) return;
  HOLD=true;
  if(!navigator.mediaDevices||!window.MediaRecorder){ HOLD=false; toast("Голосовые не поддерживаются в этом браузере","err"); return; }
  try{ RECS=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(err){ HOLD=false; toast("Разрешите доступ к микрофону","err"); return; }
  if(!HOLD){ RECS.getTracks().forEach(t=>t.stop()); RECS=null; return; }
  const cand=["audio/webm;codecs=opus","audio/webm","audio/mp4"];
  const mime=cand.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  const chunks=[];
  try{ REC=new MediaRecorder(RECS,mime?{mimeType:mime}:{}); }
  catch(err){ RECS.getTracks().forEach(t=>t.stop()); RECS=null; HOLD=false; toast("Не удалось начать запись","err"); return; }
  REC._chunks=chunks;
  REC.ondataavailable=ev=>{ if(ev.data&&ev.data.size) chunks.push(ev.data); };
  REC.start(250);
  RECT=Date.now();
  recUI(true);
  if(navigator.vibrate) navigator.vibrate(12);
}
function recStop(send){
  HOLD=false;
  if(!REC) return;
  const r=REC, stream=RECS, dur=Date.now()-RECT, chunks=r._chunks;
  REC=null; RECS=null;
  recUI(false);
  r.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    if(!send||dur<800||!chunks.length) return;
    const type=(r.mimeType||"audio/webm").split(";")[0];
    const blob=new Blob(chunks,{type});
    try{
      const url=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(new Error("Ошибка записи")); fr.readAsDataURL(blob); });
      if(url.length>380000) throw new Error("Голосовое слишком длинное (до ~1 минуты)");
      await sendPayload("",url);
    }catch(err){ toast(err.message,"err"); }
  };
  try{ r.stop(); }catch(err){ stream.getTracks().forEach(t=>t.stop()); }
}

// ---------- ОТЗЫВЫ ----------
function toggleReply(id){
  const b=$("#rb"+id); if(b) b.style.display=b.style.display==="block"?"none":"block";
}
async function replyComment(btn,id){
  const body=($("#rt"+id)?.value||"").trim();
  if(!body){ toast("Напишите ответ","err"); return; }
  const ok=await act(btn,async()=>{
    const {error}=await db.rpc("reply_seller_comment",{p_id:id,p_body:body});
    if(error) throw new Error(error.message);
  },"ok");
  if(ok){ toast("Ответ отправлен","ok"); reviewsView(); }
}
async function reviewsView(){
  setTab("");
  $("#app").innerHTML=`<div class="wrap"><button class="btn sm n" style="margin:0 0 8px" onclick="go('#/')">← Назад</button><h2 style="margin:0 0 10px">Отзывы</h2><div id="rv"><p class="muted">Загрузка...</p></div></div>`;
  const [{data:st},{data:rv},{data:cm}]=await Promise.all([
    db.rpc("seller_stats",{p_seller:user.id}),
    db.rpc("my_reviews"),
    db.rpc("my_comments")
  ]);
  const el=$("#rv"); if(!el) return;
  const s=st?.[0]||{avg_stars:0,cnt:0,s5:0,s4:0,s3:0,s2:0,s1:0};
  const bars=[5,4,3,2,1].map(n=>{
    const c=s[`s${n}`]||0, pct=s.cnt?Math.round(c*100/s.cnt):0;
    return `<div class="bar"><span>${n} ★</span><i><b style="width:${pct}%"></b></i><em>${c}</em></div>`;
  }).join("");
  const ratings=(rv||[]).map(r=>`<div class="rrow"><span>${esc(r.reviewer_name)}</span><span class="stars">${"★".repeat(r.stars)}<span style="color:#3f3f3f">${"★".repeat(5-r.stars)}</span></span></div>`).join("")||'<p class="muted">Оценок пока нет</p>';
  const comments=(cm||[]).map(c=>`<div class="cmt">
      <div class="it"><b>${esc(c.author_name)}</b><span class="muted">${fmt(c.created_at)}</span></div>
      <div style="margin-top:6px;line-height:1.45">${esc(c.body)}</div>
      ${c.reply?`<div class="rep"><b>Ваш ответ:</b> ${esc(c.reply)}</div>`:""}
      <button class="btn sm n" onclick="toggleReply(${c.id})">${c.reply?"Изменить ответ":"Ответить"}</button>
      <div id="rb${c.id}" style="display:none">
        <textarea id="rt${c.id}" rows="2" placeholder="Ваш ответ покупателю" maxlength="500">${esc(c.reply||"")}</textarea>
        <button class="btn sm" data-label="Отправить ответ" onclick="replyComment(this,${c.id})">Отправить ответ</button>
      </div>
    </div>`).join("")||'<p class="muted">Комментариев пока нет</p>';
  el.innerHTML=`
    <div class="card" style="text-align:center">
      <div style="font-size:42px;font-weight:900;font-family:Unbounded,Inter,sans-serif">★ ${s.avg_stars}</div>
      <div class="muted">Отзывов: ${s.cnt}</div>
    </div>
    <div class="card">${bars}</div>
    <h3>Комментарии покупателей (${(cm||[]).length})</h3>
    ${comments}
    <h3>Оценки покупателей</h3>
    ${ratings}`;
}

async function accountView(){
  setTab("acc");
  const av=user.user_metadata?.avatar, name=user.user_metadata?.username||"";
  $("#app").innerHTML=`<div class="wrap">
    <h2>Профиль</h2>
    <div class="card" style="text-align:center">
      <div class="av" style="width:96px;height:96px;margin:4px auto 10px"><img src="${esc(av||DEF_AV)}" alt=""></div>
      ${name?`<div style="font-weight:900;font-size:17px">${esc(name)}</div>`:""}
      <div class="muted" style="word-break:break-all">${esc(user.email)}</div>
      <label class="addph" style="margin-top:12px">Изменить фото профиля<input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this.files[0])"></label>
    </div>
    <div class="card">
      <b>Смена пароля</b>
      <input id="npw" type="password" placeholder="Новый пароль (минимум 6 символов)" oninput="clearF('npw')">
      <div class="ferr" data-for="npw"></div>
      <button class="btn n" data-label="Сохранить пароль" onclick="changePassword(this)">Сохранить пароль</button>
    </div>
    <a class="btn n" href="../support/">💬 Поддержка 24/7</a>
    <button class="btn n" onclick="enableNotif()">🔔 Включить уведомления</button>
    <button class="btn n" onclick="logout()">Выйти из аккаунта</button>
    <button class="btn dl" style="width:100%;margin-top:6px" onclick="deleteAccount()">Удалить аккаунт</button>
    <p class="muted" style="text-align:center">Удаление аккаунта удаляет все ваши товары и заявки.</p>
  </div>`;
}
async function changePassword(btn){
  const p=$("#npw").value;
  if(p.length<6){ ferr("npw","Минимум 6 символов"); return; }
  await act(btn,async()=>{
    const {error}=await db.auth.updateUser({password:p});
    if(error) throw new Error(errText(error));
  },"ok");
  const i=$("#npw"); if(i) i.value="";
}
async function uploadAvatar(file){
  if(!file) return;
  try{
    const blob=await toJpeg(file,512,0.85);
    const path=`${user.id}/avatar_${Date.now()}.jpg`;
    const {error}=await db.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});
    if(error) throw new Error(error.message);
    const url=db.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    const {data,error:e2}=await db.auth.updateUser({data:{avatar:url}});
    if(e2) throw new Error(e2.message);
    user=data.user;
    toast("Фото профиля сохранено","ok");
    accountView();
  }catch(err){ toast("Ошибка: "+err.message,"err"); }
}
async function logout(){
  menu(false);
  await db.auth.signOut();
  user=null; clearInterval(TIMER); TIMER=null;
  MODE="login"; renderNav(); location.hash="#/"; route();
  toast("Вы вышли из аккаунта","ok");
}
async function deleteAccount(){
  if(!confirm("Удалить аккаунт? Все ваши товары и заявки будут удалены без восстановления.")) return;
  const {error}=await db.rpc("delete_my_account");
  if(error) return toast("Ошибка: "+error.message,"err");
  await db.auth.signOut();
  user=null; renderNav(); location.hash="#/";
  toast("Аккаунт удалён","ok"); route();
}
