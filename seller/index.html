<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Кабинет продавца</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#7c3aed;--p2:#a855f7;--bg:#f5f3ff;--ink:#1f1235}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;padding:14px 16px;position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;z-index:5}
header b{font-size:18px;cursor:pointer}
header a{color:#fff;text-decoration:none;margin-left:12px;font-size:14px}
main{padding:12px 14px 60px;max-width:640px;margin:auto}
h2,h3{margin:16px 0 8px}
input,select,textarea{width:100%;padding:14px;margin:6px 0;border:1px solid #d5d0e6;border-radius:12px;font-size:16px;background:#fff}
.btn-big{display:block;width:100%;background:var(--p);color:#fff;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:600;margin:10px 0;cursor:pointer}
.btn-ghost{display:inline-block;background:#fff;color:var(--p);border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600;margin-top:10px;cursor:pointer}
button.s{background:#6b6b80;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:14px;margin:4px 4px 0 0;cursor:pointer}
button.danger{background:#dc2626}
.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 16px #7c3aed55}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001}
.cat{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:16px;margin:8px 0;box-shadow:0 2px 6px #0001;cursor:pointer;font-weight:600;font-size:16px}
.cat span:last-child{color:var(--p);font-size:22px}
.crumbs{font-size:14px;color:#666;margin:6px 0 10px;word-break:break-word}
.crumbs a{color:var(--p);text-decoration:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px
