// ---------- ЗВУК И КНОПКИ ----------
function beep(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.07);
  }catch(e){}
}
document.addEventListener("click",e=>{ if(e.target.closest("button,a,.item,.catrow,.tile")) beep(); },true);
function toast(msg,type){
  const t=$("#toast"); if(!t) return;
  t.textContent=msg; t.className="toast show "+(type||"");
  clearTimeout(TT); TT=setTimeout(()=>{ t.className="toast"; },2800);
}
async function act(btn,fn,doneCls){
  if(!btn||btn.disabled) return false;
  const label=btn.dataset.label||btn.textContent.trim();
  btn.dataset.label=label;
  btn.disabled=true; btn.classList.add("busy");
  btn.innerHTML='<span class="spin"></span>Загрузка...';
  try{
    await fn();
    btn.classList.remove("busy");
    if(doneCls) btn.classList.add(doneCls);
    btn.innerHTML="✓ "+label;
    return true;
  }catch(e){
    btn.classList.remove("busy"); btn.classList.add("fail");
    btn.innerHTML="✕ "+label;
    toast(e.message||"Ошибка","err");
    setTimeout(()=>{ btn.disabled=false; btn.classList.remove("fail"); btn.innerHTML=label; },1600);
    return false;
  }
}
function menu(on){ $("#sheet").classList.toggle("open",!!on); }
function ferr(key,msg){
  const e=document.querySelector(`.ferr[data-for="${key}"]`); if(e) e.textContent=msg;
  const i=$("#"+key); if(i) i.classList.add("bad");
}
function clearF(key){
  const e=document.querySelector(`.ferr[data-for="${key}"]`); if(e) e.textContent="";
  const i=$("#"+key); if(i) i.classList.remove("bad");
}
function clearAll(){
  document.querySelectorAll(".ferr").forEach(e=>e.textContent="");
  document.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
  const m=$("#authMsg"); if(m){ m.textContent=""; m.className="err"; }
}
async function toDataUrl(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=0.7, out=c.toDataURL("image/jpeg",q);
    while(out.length>330000&&q>0.3){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
    if(out.length>330000) throw new Error("Фото слишком большое");
    return out;
  }finally{ URL.revokeObjectURL(url); }
}
async function toJpeg(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Не удалось сжать фото")),"image/jpeg",q));
  }finally{ URL.revokeObjectURL(url); }
}

// ---------- СТАРТ И НАВИГАЦИЯ ----------
async function init(){
  const {data}=await db.auth.getSession();
  user=data.session?.user||null;
  if(user && await isAdmin()) return location.replace("../admin/");
  db.auth.onAuthStateChange((ev,s)=>{ user=s?.user||null; renderNav(); });
  await loadRefs();
  window.addEventListener("hashchange",route);
  renderNav(); route();
  clearInterval(BADGE_T);
  BADGE_T=setInterval(pollBadge,20000);
  pollBadge();
}
async function isAdmin(){
  const {data}=await db.from("admins").select("user_id").eq("user_id",user.id);
  return !!(data&&data.length);
}
async function loadRefs(){
  const [{data:cats},{data:countries},{data:cities}]=await Promise.all([
    db.from("categories").select("*"),
    db.from("countries").select("*").order("name"),
    db.from("cities").select("*").order("name")
  ]);
  CATS=cats||[]; COUNTRIES=countries||[]; CITIES=cities||[];
}
function renderNav(){ document.body.classList.toggle("nologin",!user); }
function setTab(t){ document.querySelectorAll(".bottom a").forEach(a=>a.classList.toggle("on",a.dataset.t===t)); }
function route(){
  clearInterval(TIMER); TIMER=null;
  if(recovery) return recoveryView();
  renderNav();
  if(!user) return loginView();
  const parts=(location.hash||"#/").slice(2).split("/");
  const page=parts[0]||"", arg=parts[1];
  window.scrollTo(0,0); menu(false);
  if(page==="cats") return catsView(arg?+arg:null);
  if(page==="new") return productForm(null,+arg);
  if(page==="edit") return productForm(+arg,null);
  if(page==="chat") return arg?chatThread(+arg):chatList();
  if(page==="reviews") return reviewsView();
  if(page==="account") return accountView();
  return homeView();
}
function countryOptions(sel){
  return COUNTRIES.map(k=>`<option value="${k.id}" ${k.id==sel?"selected":""}>${esc(k.name)}</option>`).join("");
}
function cityOptions(countryId,sel){
  return CITIES.filter(c=>!countryId||c.country_id==countryId)
    .map(c=>`<option value="${c.id}" ${c.id==sel?"selected":""}>${esc(c.name)}</option>`).join("");
}
function fillCities(){

  $("#f_city").innerHTML=`<option value="">Город</option>${k?cityOptions(k,null):""}`;

function setMode(m){ MODE=m; loginView(); }
async function checkUn(){
  const un=($("#un")?.value||"").trim();
  if(un.length<3) return;
  const {data}=await db.rpc("username_taken",{p:un});
  if(data) ferr("un","Этот ник уже занят");
}
async function doRegister(btn){
  clearAll();
  const un=($("#un").value||"").trim(), em=($("#em").value||"").trim();
  const pw=$("#pw").value, pw2=$("#pw2").value;
  let ok=true;
  if(un.length<3||/\s/.test(un)){ ferr("un","Ник: минимум 3 символа, без пробелов"); ok=false; }
  if(!/^\S+@\S+\.\S+$/.test(em)){ ferr("em","Введите правильный email"); ok=false; }
  if(pw.length<6){ ferr("pw","Пароль: минимум 6 символов"); ok=false; }
  if(pw2!==pw){ ferr("pw2","Пароли не совпадают"); ok=false; }
  if(!$("#agree").checked){ ferr("agree","Нужно согласие с политикой"); ok=false; }
  if(!ok){ toast("Исправьте отмеченные поля","err"); return; }
  let note="";
  const done=await act(btn,async()=>{
    const {data:taken}=await db.rpc("username_taken",{p:un});
    if(taken){ ferr("un","Этот ник уже занят"); throw new Error("Ник занят"); }
    const {data,error}=await db.auth.signUp({email:em,password:pw,options:{data:{username:un,role:"seller"}}});
    if(error){
      if(/already/i.test(error.message)){ ferr("em","Этот email уже зарегистрирован. Нажмите «Войти»."); throw new Error("Email уже зарегистрирован"); }
      throw new Error(errText(error));
    }
    if(data.session) user=data.user;
    else note="Аккаунт создан. Войдите по email и паролю.";
  },"ok");
  if(done){
    if(user){ renderNav(); go("#/"); }
    else { MODE="login"; loginView(); const m=$("#authMsg"); if(m) m.textContent=note; }
  }
}
async function doLogin(btn){
  clearAll();
  const em=($("#em").value||"").trim(), pw=$("#pw").value;
  let ok=true;
  if(!em){ ferr("em","Введите email"); ok=false; }
  if(!pw){ ferr("pw","Введите пароль"); ok=false; }
  if(!ok) return;
  const done=await act(btn,async()=>{
    const {data,error}=await db.auth.signInWithPassword({email:em,password:pw});
    if(error){
      ferr("em","Неверный пароль или неверный email");
      ferr("pw","Неверный пароль или неверный email");
      throw new Error(errText(error));
    }
    user=data.user;
    if(await isAdmin()){ location.replace("../admin/"); throw new Error("Переход в админ-панель"); }
  },"ok");
  if(done){ renderNav(); go("#/"); }
}
async function forgot(){
  clearAll();
  const em=($("#em").value||"").trim();
  if(!/^\S+@\S+\.\S+$/.test(em)){ ferr("em","Сначала введите email"); return; }
  const {error}=await db.auth.resetPasswordForEmail(em,{redirectTo:SITE});
  const m=$("#authMsg");
  m.className=error?"err":"okt";
  m.textContent=error?errText(error):"Ссылка для нового пароля отправлена на "+em+". Проверьте почту и папку «Спам».";
}

async function setNewPw(btn){
  const p=$("#np").value;
  if(p.length<6){ ferr("np","Минимум 6 символов"); return; }
  const done=await act(btn,async()=>{
    const {data,error}=await db.auth.updateUser({password:p});

async function thumbUrl(p){
  if(isLive(p)&&p.photos?.length) return p.photos[0];
  if(p.draft_photos?.length){
    const {data}=await db.storage.from("product-drafts").createSignedUrl(p.draft_photos[0],3600);
    return data?.signedUrl||"";
  }
  return "";
}
function prodRow(p,thumb){
  const expired=isExpired(p);
  const [label,color]=expired?["Срок фото истёк","#d97706"]:(ST[p.status]||[p.status,"#737373"]);
  const dates=[`Добавлено: ${ago(p.created_at)}`];
  if(isLive(p)&&p.photos_until) dates.push(`Фото до: ${fdate(p.photos_until)}`);
  let b="";
  if(isLive(p)) b+=`<button class="btn sm n" onclick="go('#/edit/${p.id}')">Цена и данные</button>`;
  if(expired||["rejected","awaiting_payment","draft"].includes(p.status)) b+=`<button class="btn sm" onclick="go('#/edit/${p.id}')">${expired?"Загрузить фото заново":"Исправить и отправить"}</button>`;
  if(p.status==="pending_review") b+=`<span class="muted">Ответ админа: 5–30 минут</span>`;
  if(p.status!=="pending_review") b+=`<button class="btn del" onclick="delProduct(${p.id})">Удалить</button>`;
  const warn=expired?`<div class="warn2">Фото удалены по истечении ${PHOTO_MONTHS} месяцев (${fdate(p.photos_until)}). Загрузите фото заново, и товар снова пройдёт проверку.</div>`:"";
  return `<div class="prod">
    <div class="prow">
      ${thumb?`<img class="pimg" src="${esc(thumb)}">`:`<div class="pph">📷</div>`}
      <div class="pt">
        <b>${esc(p.title)}</b>
        <div class="price">${p.price} ₽</div>
        <span class="badge" style="background:${color}">${label}</span>
        <div class="note">${dates.join(" · ")}</div>
      </div>
    </div>
    ${warn}
    <div class="acts">${b}</div>
  </div>`;
}
async function delProduct(id){
  if(!confirm("Удалить товар?")) return;
  const {error}=await db.from("products").delete().eq("id",id);
  if(error) return toast("Ошибка: "+error.message,"err");
  toast("Товар удалён","ok"); homeView();
}

// ---------- КАТЕГОРИИ ----------
function catsView(parent){
  setTab("add");
  const current=parent?CATS.find(c=>c.id===parent):null;
  const children=CATS.filter(c=>(c.parent_id??null)===(parent??null))
    .sort((a,b)=>(a.sort_order??0)-(b.sort_order??0)||a.name.localeCompare(b.name));
  const crumbs=[]; let cur=current;
  while(cur){ crumbs.unshift(cur); cur=CATS.find(c=>c.id===cur.parent_id); }
  const isLeaf=!!current&&!CATS.some(c=>c.parent_id===current.id);
  const top=`<div class="crumbs"><a href="#/">Главная</a> › <a href="#/cats">Категории</a>${crumbs.map(c=>` › <a href="#/cats/${c.id}">${esc(c.name)}</a>`).join("")}</div>`;
  if(isLeaf){
    $("#app").innerHTML=`<div class="wrap">${top}
      <div class="card" style="text-align:center;padding:24px">
        <div style="font-size:44px">${icon(crumbs[0]?.name)}</div>
        <div class="muted" style="margin-top:6px">Товар будет добавлен в категорию</div>
        <div style="font-size:20px;font-weight:900;margin:6px 0 16px">${esc(current.name)}</div>
        <button class="btn" onclick="go('#/new/${current.id}')">Добавить товар сюда</button>
      </div></div>`;
    return;
  }
  $("#app").innerHTML=`<div class="wrap">${top}
    <h2>${current?esc(current.name):"Категории"}</h2>
    <p class="muted">${current?`Выберите подкатегорию в «${esc(current.name)}»`:"Выберите раздел"}</p>
    ${current
      ?children.map(c=>`<div class="catrow" onclick="go('#/cats/${c.id}')"><div class="ci" ${c.image?`style="background-image:url('${esc(c.image)}')"`:""}>${c.image?"":icon(c.name)}</div><b>${esc(c.name)}</b><i>›</i></div>`).join("")
      :`<div class="tiles">${children.map(c=>`<div class="tile ${c.image?"img":""}" ${c.image?`style="background-image:url('${esc(c.image)}')"`:""} onclick="go('#/cats/${c.id}')">${c.image?"":`<span>${icon(c.name)}</span>`}<b>${esc(c.name)}</b></div>`).join("")}</div>`}
    ${children.length?"":'<p class="muted">Здесь пока пусто. Категории добавляет владелец сайта.</p>'}
  </div>`;
}

      <h4>Данные товара</h4>
      <input id="f_title" placeholder="Название товара" value="${esc(p.title)}" oninput="clearF('f_title')">
      <div class="ferr" data-for="title"></div>
      <textarea id="f_desc" rows="3" placeholder="Описание">${esc(p.description)}</textarea>
      <input id="f_quality" placeholder="Качество (например: премиум, 1 сорт)" value="${esc(p.quality)}" oninput="clearF('f_quality')">
      <div class="ferr" data-for="quality"></div>
      <input id="f_origin" placeholder="Страна производства" value="${esc(p.origin_country)}" oninput="clearF('f_origin')">
      <div class="ferr" data-for="origin"></div>
      <input id="f_address" placeholder="Адрес (склад / пункт выдачи)" value="${esc(p.address)}" oninput="clearF('f_address')">
      <div class="ferr" data-for="address"></div>
    </div>
    <div class="sec">
      <h4>Продажа и цена</h4>
      <select id="f_country" onchange="fillCities();clearF('f_country')"><option value="">Страна продажи</option>${countryOptions(p.country_id)}</select>
      <div class="ferr" data-for="country"></div>
      <select id="f_city" onchange="clearF('f_city')"><option value="">Город</option>${p.country_id?cityOptions(p.country_id,p.city_id):""}</select>
      <div class="ferr" data-for="city"></div>
      <input id="f_price" type="number" placeholder="Цена за штуку, ₽" value="${p.price??""}" oninput="clearF('f_price')">
      <div class="ferr" data-for="price"></div>
      <input id="f_min" type="number" placeholder="Минимальный заказ, шт" value="${p.min_order??""}" oninput="clearF('f_min')">
      <div class="ferr" data-for="min"></div>
    </div>
    <div class="sec">
      <h4>Контакты для покупателей</h4>
      <input id="f_phone" type="tel" placeholder="Телефон" value="${esc(p.seller_phone)}" oninput="clearF('f_phone')">
      <input id="f_email" type="email" placeholder="Email" value="${esc(p.seller_email)}" oninput="clearF('f_email')">
      <input id="f_ig" placeholder="Instagram (необязательно)" value="${esc(p.instagram)}">
      <div class="ferr" data-for="contact"></div>
    </div>
    ${live?"":payBlock()}
    <button class="btn" id="sendBtn" data-label="${esc(btnLabel)}" onclick="submitProduct(this,${id?id:"null"},${categoryId},${live})">${esc(btnLabel)}</button>
  </div>`;
  renderThumbs();
}
function addPhotos(el){
  const arr=[...el.files]; el.value="";
  const room=6-PHOTOS.length;
  if(arr.length>room) toast(room>0?`Можно добавить ещё ${room} фото (максимум 6)`:"Максимум 6 фото","err");
  PHOTOS=PHOTOS.concat(arr.slice(0,Math.max(room,0)));
  renderThumbs();
  setErr("photos","");
  const d=$("#f_photos"); if(d) d.classList.remove("bad");
}
function removePhoto(i){ PHOTOS.splice(i,1); renderThumbs(); }
function renderThumbs(){
  const box=$("#thumbs"); if(!box) return;
  box.innerHTML=PHOTOS.map((f,i)=>`<div class="th"><img src="${URL.createObjectURL(f)}"><button class="x" onclick="removePhoto(${i})">×</button>${i===0?'<span class="cover">Главное</span>':""}</div>`).join("");
}
function pickReceipt(f){
  RECEIPT=f||null;
  $("#recName").textContent=f?("Чек: "+f.name):"";
  setErr("receipt","");
}
function setErr(key,msg){
  const e=document.querySelector(`.ferr[data-for="${key}"]`);
  if(e) e.textContent=msg||"";
}
function clearErrors(){
  document.querySelectorAll(".ferr").forEach(e=>e.textContent="");
  document.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
}
function mark(key){
  const id={photos:"f_photos",contact:"f_phone",receipt:null,comment:"f_comment"}[key]??("f_"+key);
  const el=id?$("#"+id):null; if(el) el.classList.add("bad");
}
function validate(live){
  clearErrors();
  const v=k=>($("#f_"+k)?.value??"").trim();
  let ok=true;
  const need=(key,cond,msg)=>{ if(!cond){ setErr(key,msg); mark(key); ok=false; } };
  need("title",!!v("title"),"Заполните название товара");
  need("quality",!!v("quality"),"Укажите качество");
  need("origin",!!v("origin"),"Укажите страну производства");
  need("address",!!v("address"),"Укажите адрес");
  need("country",!!$("#f_country").value,"Выберите страну продажи");
  need("city",!!$("#f_city").value,"Выберите город");
  need("price",+v("price")>0,"Укажите цену за штуку");
  need("min",+v("min")>0,"Укажите минимальный заказ");
  need("contact",!!(v("phone")||v("email")),"Укажите телефон или email для связи");
  if(!live){
    need("photos",PHOTOS.length?(PHOTOS.length>=3&&PHOTOS.length<=6):(CURRENT_DRAFTS>=3),"Добавьте от 3 до 6 фото (обязательно)");
    need("receipt",!!RECEIPT,"Загрузите скриншот чека");
    need("comment",!!v("comment"),"Напишите название товара в комментарии к переводу");
  }
  if(!ok) toast("Заполните отмеченные шаги (красным)","err");
  return ok;
}
async function submitProduct(btn,id,catId,live){
  if(!validate(live)) return;
  await act(btn,()=>saveProduct(id,catId,live),"ok");
}
async function saveProduct(id,catId,live){
  const v=k=>($("#f_"+k)?.value??"").trim();
  const fields={
    title:v("title"), description:v("desc")||null, category_id:catId,
    country_id:+$("#f_country").value, city_id:+$("#f_city").value,
    price:+v("price"), min_order:+v("min"),
    quality:v("quality"), origin_country:v("origin"), address:v("address"),
    seller_phone:v("phone")||null, seller_email:v("email")||null, instagram:v("ig")||null
  };
  if(live){
    const {error}=await db.from("products").update(fields).eq("id",id);
    if(error) throw new Error(error.message);
    toast("Изменения сохранены","ok"); return go("#/");
  }
  let drafts=null;
  if(PHOTOS.length){
    drafts=[];
    for(let i=0;i<PHOTOS.length;i++){
      const blob=await toJpeg(PHOTOS[i],1200,0.82);
      const path=`${user.id}/${Date.now()}_${i}.jpg`;
      const {error}=await db.storage.from("product-drafts").upload(path,blob,{contentType:"image/jpeg"});
      if(error) throw new Error(error.message);
      drafts.push(path);
    }
  }
  const rblob=await toJpeg(RECEIPT,1400,0.85);
  const rpath=`${user.id}/fee_${Date.now()}.jpg`;
  const {error:er}=await db.storage.from("receipts").upload(rpath,rblob,{contentType:"image/jpeg"});
  if(er) throw new Error("чек: "+er.message);
  const common={...fields,status:"pending_review",receipt_url:rpath,payment_comment:v("comment"),owner_email:user.email};
  if(!id){
    const {error}=await db.from("products").insert({...common,seller_id:user.id,draft_photos:drafts});
    if(error) throw new Error(error.message);
  } else {
    const row={...common};
    if(drafts){
      const {data:old}=await db.from("products").select("draft_photos").eq("id",id).maybeSingle();
      row.draft_photos=drafts;
      if(old?.draft_photos?.length) await db.storage.from("product-drafts").remove(old.draft_photos);
    }
    const {error}=await db.from("products").update(row).eq("id",id);
    if(error) throw new Error(error.message);
  }
  toast("Заявка отправлена. Ответ: 5–30 минут","ok");
  go("#/");
}

// ---------- ЧАТ С ПОКУПАТЕЛЯМИ ----------
async function pollBadge(){
  if(!user) return;
  const {data}=await db.rpc("my_threads");
  const sn=seen();
  const n=(data||[]).filter(t=>t.i_am_seller&&t.last_at&&(!sn[t.thread_id]||new Date(t.last_at)>new Date(sn[t.thread_id]))).length;
  const b=$("#bdChat"); if(b) b.textContent=n||"";
  if($("#tl")) renderThreads(data);
}
function chatList(){
  setTab("chat");
  $("#app").innerHTML=`<div class="wrap"><h2>Чат с покупателями</h2><div id="tl"><p class="muted">Загрузка...</p></div></div>`;
  renderThreads();
}
async function renderThreads(preload){
  const data=preload||(await db.rpc("my_threads")).data;
  const el=$("#tl"); if(!el) return;
  const list=(data||[]).filter(t=>t.i_am_seller);
  const sn=seen();
  el.innerHTML=list.map(t=>{
    const isNew=t.last_at&&(!sn[t.thread_id]||new Date(t.last_at)>new Date(sn[t.thread_id]));
    return `<div class="item" onclick="go('#/chat/${t.thread_id}')">
      <div style="width:44px;height:44px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 44px">${ini(t.other_name)}</div>
      <div class="ib"><div class="it"><b>${esc(t.other_name)}</b><span class="muted">${t.last_at?fmt(t.last_at):""}</span></div>
      <div class="prev">${esc(t.last_body||"Фото")}</div></div>
      ${isNew?'<span class="dot"></span>':""}
    </div>`;
  }).join("")||'<p class="muted">Покупатели пока не писали. Когда напишут, диалоги появятся здесь.</p>';
}
async function chatThread(tid){
  setTab("chat");
  const {data}=await db.rpc("my_threads");
  const t=(data||[]).find(x=>x.thread_id===tid&&x.i_am_seller);
  if(!t){ toast("Диалог не найден","err"); return go("#/chat"); }
  CH={tid,photo:null};
  const sn=seen(); sn[tid]=new Date().toISOString(); setSeen(sn);
  $("#app").innerHTML=`<div class="wrap chatwrap">
    <div class="chead">
      <button class="ibtn" onclick="go('#/chat')" aria-label="Назад">←</button>
      <div class="cav" style="width:42px;height:42px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;font-weight:900">${ini(t.other_name)}</div>
      <div><b>${esc(t.other_name)}</b><div class="muted">Покупатель</div></div>
    </div>
    <div class="cmsgs" id="cmsgs"><p class="muted" style="margin:auto">Загрузка...</p></div>
    <div class="cprev" id="cprev"><img id="cpimg"><button class="btn sm n" onclick="clearPhoto()">Убрать</button></div>
    <form class="cform" onsubmit="sendMsg(event)">
      <label class="clip">📷<input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this.files[0])"></label>
      <textarea id="ctxt" rows="1" placeholder="Сообщение…" maxlength="1000"></textarea>
      <button class="send" id="csend" type="submit">➤</button>
    </form>
    <p class="err" id="cerr"></p>
  </div>`;
  await loadMsgs(true);
  clearInterval(TIMER);
  TIMER=setInterval(()=>loadMsgs(false),8000);
}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>");
}
async function loadMsgs(scroll){
  const box=$("#cmsgs"); if(!box||!CH.tid) return;
  const {data,error}=await db.from("buyer_messages").select("id,sender_id,body,attachment,created_at").eq("thread_id",CH.tid).order("created_at");
  if(!$("#cmsgs")) return;
  if(error){ box.innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  box.innerHTML=(data||[]).map(m=>{
    const mine=m.sender_id===user.id;
    return `<div class="bub ${mine?"me":"them"}">${m.attachment?`<img src="${esc(m.attachment)}">`:""}${m.body?linkify(m.body):""}<div class="bt">${fmt(m.created_at)}</div></div>`;
  }).join("")||'<p class="muted" style="margin:auto;text-align:center">Напишите первое сообщение</p>';
  if(scroll||near) box.scrollTop=box.scrollHeight;
}
async function pickPhoto(f){
  if(!f) return;
  try{ CH.photo=await toDataUrl(f,800); $("#cpimg").src=CH.photo; $("#cprev").classList.add("on"); $("#cerr").textContent=""; }
  catch(e){ CH.photo=null; $("#cerr").textContent=e.message; }
}
function clearPhoto(){
  CH.photo=null;
  const p=$("#cprev"); if(p) p.classList.remove("on");
  const i=$("#cpimg"); if(i) i.src="";
}
async function sendMsg(e){
  e.preventDefault();
  const t=$("#ctxt"), body=t.value.trim();
  if(!body&&!CH.photo){ $("#cerr").textContent="Напишите сообщение или прикрепите фото."; return; }
  const btn=$("#csend");
  const ok=await act(btn,async()=>{
    const {error}=await db.rpc("send_buyer_message",{p_thread:CH.tid,p_body:body,p_attach:CH.photo});
    if(error) throw new Error(error.message);
  },"ok");
  if(ok){ t.value=""; clearPhoto(); }
  setTimeout(()=>{ btn.disabled=false; btn.classList.remove("ok"); btn.innerHTML="➤"; },500);
  await loadMsgs(true);
}

// ---------- ОТЗЫВЫ ----------
function toggleReply(id){
  const b=$("#rb"+id); if(b) b.style.display=b.style.display==="block"?"none":"block";
}
async function replyComment(btn,id){
  const body=($("#rt"+id)?.value||"").trim();
  if(!body){ toast("Напишите ответ","err"); return; }
  const ok=await act(btn,async()=>{
    const {error}=await db.rpc("reply_seller_comment",{p_id:id,p_body:body});
    if(error) throw new Error(error.message);
  },"ok");
  if(ok){ toast("Ответ отправлен","ok"); reviewsView(); }
}
async function reviewsView(){
  setTab("");
  $("#app").innerHTML=`<div class="wrap"><div class="chead"><button class="ibtn" onclick="go('#/')" aria-label="Назад">←</button><h2 style="margin:0">Отзывы</h2></div><div id="rv"><p class="muted">Загрузка...</p></div></div>`;
  const [{data:st},{data:rv},{data:cm}]=await Promise.all([
    db.rpc("seller_stats",{p_seller:user.id}),
    db.rpc("my_reviews"),
    db.rpc("my_comments")
  ]);
  const el=$("#rv"); if(!el) return;
  const s=st?.[0]||{avg_stars:0,cnt:0,s5:0,s4:0,s3:0,s2:0,s1:0};
  const bars=[5,4,3,2,1].map(n=>{
    const c=s[`s${n}`]||0, pct=s.cnt?Math.round(c*100/s.cnt):0;
    return `<div class="bar"><span>${n} ★</span><i><b style="width:${pct}%"></b></i><em>${c}</em></div>`;
  }).join("");
  const ratings=(rv||[]).map(r=>`<div class="rrow"><span>${esc(r.reviewer_name)}</span><span class="stars">${"★".repeat(r.stars)}<span style="color:#3f3f3f">${"★".repeat(5-r.stars)}</span></span></div>`).join("")||'<p class="muted">Оценок пока нет</p>';
  const comments=(cm||[]).map(c=>`<div class="cmt">
      <div class="it"><b>${esc(c.author_name)}</b><span class="muted">${fmt(c.created_at)}</span></div>
      <div style="margin-top:6px;line-height:1.45">${esc(c.body)}</div>
      ${c.reply?`<div class="rep"><b>Ваш ответ:</b> ${esc(c.reply)}</div>`:""}
      <button class="btn sm n" onclick="toggleReply(${c.id})">${c.reply?"Изменить ответ":"Ответить"}</button>
      <div id="rb${c.id}" style="display:none">
        <textarea id="rt${c.id}" rows="2" placeholder="Ваш ответ покупателю" maxlength="500">${esc(c.reply||"")}</textarea>
        <button class="btn sm" data-label="Отправить ответ" onclick="replyComment(this,${c.id})">Отправить ответ</button>
      </div>
    </div>`).join("")||'<p class="muted">Комментариев пока нет</p>';
  el.innerHTML=`
    <div class="card" style="text-align:center">
      <div style="font-size:42px;font-weight:900;font-family:Unbounded,Inter,sans-serif">★ ${s.avg_stars}</div>
      <div class="muted">Отзывов: ${s.cnt}</div>
    </div>
    <div class="card">${bars}</div>
    <h3>Комментарии покупателей (${(cm||[]).length})</h3>
    ${comments}
    <h3>Оценки покупателей</h3>
    ${ratings}`;
}

// ---------- ПРОФИЛЬ ----------
async function accountView(){
  setTab("acc");
  const av=user.user_metadata?.avatar, name=user.user_metadata?.username||"";
  $("#app").innerHTML=`<div class="wrap">
    <h2>Профиль</h2>
    <div class="card" style="text-align:center">
      <div class="av" style="width:96px;height:96px;margin:4px auto 10px;font-size:34px">${av?`<img src="${esc(av)}">`:ini(name||user.email)}</div>
      ${name?`<div style="font-weight:900;font-size:17px">${esc(name)}</div>`:""}
      <div class="muted" style="word-break:break-all">${esc(user.email)}</div>
      <label class="addph" style="margin-top:12px">📷 Фото профиля<input type="file" accept="image/*" onchange="uploadAvatar(this.files[0])"></label>
    </div>
    <div class="card">
      <b>Смена пароля</b>
      <input id="npw" type="password" placeholder="Новый пароль (минимум 6 символов)" oninput="clearF('npw')">
      <div class="ferr" data-for="npw"></div>
      <button class="btn n" data-label="Сохранить пароль" onclick="changePassword(this)">Сохранить пароль</button>
    </div>
    <a class="btn n" href="../support/">💬 Поддержка 24/7</a>
    <button class="btn n" onclick="logout()">Выйти из аккаунта</button>
    <button class="btn del" style="width:100%;margin-top:6px" onclick="deleteAccount()">Удалить аккаунт</button>
    <p class="muted" style="text-align:center">Удаление аккаунта удаляет все ваши товары и заявки.</p>
  </div>`;
}
async function changePassword(btn){
  const p=$("#npw").value;
  if(p.length<6){ ferr("npw","Минимум 6 символов"); return; }
  await act(btn,async()=>{
    const {error}=await db.auth.updateUser({password:p});
    if(error) throw new Error(errText(error));
  },"ok");
  const i=$("#npw"); if(i) i.value="";
}
async function uploadAvatar(file){
  if(!file) return;
  try{
    const blob=await toJpeg(file,512,0.85);
    const path=`${user.id}/avatar_${Date.now()}.jpg`;
    const {error}=await db.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});
    if(error) throw new Error(error.message);
    const url=db.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    const {data,error:e2}=await db.auth.updateUser({data:{avatar:url}});
    if(e2) throw new Error(e2.message);
    user=data.user;
    toast("Фото профиля сохранено","ok");
    accountView();
  }catch(err){ toast("Ошибка: "+err.message,"err"); }
}
async function logout(){
  menu(false);
  await db.auth.signOut();
  user=null; clearInterval(TIMER); TIMER=null;
  MODE="login"; renderNav(); location.hash="#/"; route();
  toast("Вы вышли из аккаунта","ok");
}
async function deleteAccount(){
  if(!confirm("Удалить аккаунт? Все ваши товары и заявки будут удалены без восстановления.")) return;
  const {error}=await db.rpc("delete_my_account");
  if(error) return toast("Ошибка: "+error.message,"err");
  await db.auth.signOut();
  user=null; renderNav(); location.hash="#/";
  toast("Аккаунт удалён","ok"); route();
}

// ---------- СТАРТ ----------
init();
</script>
