<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ec4899">
<title>Кабинет продавца</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#ec4899;--p2:#f9a8d4;--pd:#be185d;--bg:#fff1f8;--ink:#3b0a23;--mut:#9d6b84;--line:#f5d0e3;--bad:#e11d48}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#fbd5e8;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:manipulation}
.app{max-width:480px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:20px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 14px #ec489933}
header b{font-size:18px;font-weight:800;letter-spacing:-.2px;cursor:pointer}
header a{color:#fff;text-decoration:none;margin-left:12px;font-size:14px;font-weight:600}
main{padding:14px 14px 100px}
h2{font-size:22px;font-weight:800;margin:16px 0 10px;letter-spacing:-.4px}
h3{font-size:16px;font-weight:700;margin:16px 0 8px}
input,select,textarea{width:100%;padding:14px;margin:6px 0;border:1px solid var(--line);border-radius:14px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px #ec489922}
.btn{display:block;width:100%;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;margin:10px 0;cursor:pointer;box-shadow:0 8px 18px #ec489944;text-align:center;text-decoration:none}
.btn.light{background:#fff;color:var(--pd);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);box-shadow:none;border:1px solid #fecdd3}
.sm{display:inline-block;background:#fff;color:var(--pd);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;margin:4px 6px 0 0;cursor:pointer}
.sm.red{color:var(--bad);border-color:#fecdd3}
.hero{background:linear-gradient(135deg,var(--p),var(--p2) 70%,#fbcfe8);color:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 28px #ec489955;position:relative;overflow:hidden;display:flex;gap:14px;align-items:center}
.hero:after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:#ffffff22;right:-70px;top:-80px}
.av{width:64px;height:64px;border-radius:50%;background:#ffffff33;border:2px solid #fff;overflow:hidden;flex:0 0 64px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;position:relative;z-index:1}
.av img{width:100%;height:100%;object-fit:cover}
.hero .txt{position:relative;z-index:1;min-width:0}
.hero .hs{opacity:.92;font-size:13px}
.hero .hi{font-size:17px;font-weight:800;word-break:break-all;margin-top:2px}
.hero .hbtn{margin-top:10px;background:#fff;color:var(--pd);border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.tile{background:#fff;border-radius:20px;padding:12px 4px;text-align:center;box-shadow:0 6px 14px #ec48991a;border:1px solid var(--line);cursor:pointer}
.tile span{display:block;font-size:28px;line-height:1.1}
.tile b{display:block;font-size:11px;font-weight:700;margin-top:4px;line-height:1.2}
.card{background:#fff;border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 6px 16px #ec48990f;border:1px solid var(--line)}
.prod{display:flex;gap:12px}
.thumb{width:76px;height:76px;border-radius:14px;object-fit:cover;background:#fce7f3;flex:0 0 76px}
.ph{width:76px;height:76px;border-radius:14px;background:#fce7f3;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 76px}
.pt{flex:1;min-width:0}
.pt b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{font-size:15px;font-weight:800;color:var(--pd);margin-top:2px}
.badge{display:inline-block;color:#fff;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;margin-top:4px}
.note{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4}
.warn2{font-size:12px;color:#9d174d;background:#fdf2f8;border-radius:10px;padding:8px;margin-top:8px;line-height:1.4}
.crumbs{font-size:13px;color:var(--mut);margin:6px 0 10px}
.crumbs a{color:var(--pd);text-decoration:none;font-weight:600}
.cat{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:18px;padding:16px;margin:8px 0;box-shadow:0 4px 10px #ec489914;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:15px}
.cat i{color:var(--p);font-style:normal;font-size:22px}
.big2{font-size:18px;font-weight:800;margin:4px 0 10px;color:var(--pd)}
.pcard{position:relative;width:100%;max-width:420px;margin:12px auto;aspect-ratio:1.586;border-radius:22px;padding:20px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#9d174d 0%,#ec4899 55%,#fbcfe8 100%);box-shadow:0 14px 30px #ec489966;overflow:hidden}
.pcard:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#ffffff1f;right:-90px;top:-110px}
.pcard .chip{width:44px;height:32px;border-radius:7px;background:linear-gradient(135deg,#fde68a,#f59e0b)}
.pcard .pbank{font-weight:800;font-size:15px}
.pcard .pnum{font-size:19px;letter-spacing:2px;font-family:ui-monospace,Menlo,Consolas,monospace}
.pcard .copy{position:absolute;right:14px;top:14px;background:#ffffff40;color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.warn{background:#fdf2f8;border:1px dashed var(--p);border-radius:16px;padding:12px;font-size:14px;color:#9d174d;margin:10px 0;line-height:1.5}
.muted{color:var(--mut);font-size:13px}
.err{color:var(--bad);font-size:14px}
.bottom{display:none;position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px #ec48991a;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
body.in .bottom{display:flex}
.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:21px;line-height:1.1}
.bottom a span{display:block;font-size:11px;font-weight:600;margin-top:3px}
.bottom a.on{color:var(--p)}
.bottom a.on span{color:var(--pd)}
</style>
</head>
<body>
<div class="app">
<header><b onclick="go('#/')">Кабинет продавца</b><div id="nav"></div></header>
<main id="app">Загрузка...</main>
</div>
<nav class="bottom">
  <a href="#/" data-tab="home">🏠<span>Главная</span></a>
  <a href="#/cats" data-tab="cats">➕<span>Добавить</span></a>
  <a href="#/account" data-tab="account">👤<span>Аккаунт</span></a>
</nav>
<script>
const SB_URL="https://fwvvnzrprjffsmkpvhrl.supabase.co";
const SB_KEY="sb_publishable_wJYMx4Gs-NlZXUBFedcVaQ_H30wRYUz";
const SITE=location.origin+location.pathname;
const CARD_NUMBER="5058270378663669";
const CARD_BANK="Душанбе Сити";
const FEE_TEXT="1 сомони таджикский";
const PHOTO_MONTHS=5;
const DAY=86400000;
const ICON={"Женщинам":"👗","Мужчинам":"👔","Детям":"🧸","Обувь":"👟","Аксессуары":"👜","Спорт и отдых":"🏋️","Дом и уют":"🏠","Красота и гигиена":"💄"};
const icon=n=>ICON[n]||"🛍️";
const ST={pending_review:["На проверке","#8b5cf6"],published:["Опубликован","#16a34a"],rejected:["Отклонён","#e11d48"],awaiting_payment:["Не отправлен","#f59e0b"],draft:["Черновик","#9d6b84"]};
const ERR=[
  ["already registered","Этот email уже зарегистрирован. Нажмите «Войти»."],
  ["Invalid login credentials","Неверный email или пароль."],
  ["Email not confirmed","Email не подтверждён. Проверьте почту."],
  ["at least 6","Пароль должен быть не короче 6 символов."],
  ["For security purposes","Слишком частые запросы. Подождите минуту."],
  ["rate limit","Слишком много писем. Попробуйте позже."]
];
const errText=e=>{const m=e?.message||"";const f=ERR.find(([k])=>m.includes(k));return f?f[1]:"Ошибка: "+m;};

const db=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const go=h=>{ if(location.hash===h) route(); else location.hash=h; };
const fdate=t=>new Date(t).toLocaleDateString("ru-RU");
function ago(t){
  const d=Math.floor((Date.now()-new Date(t))/DAY);
  if(d<1) return "сегодня";
  if(d<7) return d+" дн. назад";
  if(d<30) return Math.floor(d/7)+" нед. назад";
  if(d<365) return Math.floor(d/30)+" мес. назад";
  return Math.floor(d/365)+" г. назад";
}
const isExpired=p=>p.status==="published" && !!p.photos_until && new Date(p.photos_until)<=new Date();
const isLive=p=>p.status==="published" && !isExpired(p);
let user=null, CATS=[], COUNTRIES=[], CITIES=[];
let recovery=location.hash.includes("type=recovery");

// ---------- СТАРТ ----------
async function init(){
  const {data}=await db.auth.getSession();
  user=data.session?.user||null;
  if(user && await isAdmin()) return location.replace("../admin/");
  renderNav();
  window.addEventListener("hashchange",()=>route());
  await loadRefs();
  route();
}
async function isAdmin(){
  const {data}=await db.from("admins").select("user_id").eq("user_id",user.id);
  return !!(data&&data.length);
}
function renderNav(){
  document.body.classList.toggle("in",!!user);
  $("#nav").innerHTML=`<a href="../">Сайт</a>`;
}
function setTab(t){
  document.querySelectorAll(".bottom a").forEach(a=>a.classList.toggle("on",a.dataset.tab===t));
}
async function logout(){
  await db.auth.signOut();
  user=null; renderNav(); location.hash="#/"; route();
}
async function route(){
  if(recovery) return recoveryView();
  if(!user) return loginView();
  const [,page,arg]=(location.hash||"#/").split("/");
  if(page==="cats") return catsView(arg?+arg:null);
  if(page==="new") return productForm(null,+arg);
  if(page==="edit") return productForm(+arg,null);
  if(page==="account") return accountView();
  return homeView();
}
async function loadRefs(){
  const [{data:cats},{data:countries},{data:cities}]=await Promise.all([
    db.from("categories").select("*").order("name"),
    db.from("countries").select("*").order("name"),
    db.from("cities").select("*").order("name")
  ]);
  CATS=cats||[]; COUNTRIES=countries||[]; CITIES=cities||[];
}
function countryOptions(sel){
  return COUNTRIES.map(k=>`<option value="${k.id}" ${k.id==sel?"selected":""}>${esc(k.name)}</option>`).join("");
}
function cityOptions(countryId,sel){
  return CITIES.filter(c=>!countryId||c.country_id==countryId)
    .map(c=>`<option value="${c.id}" ${c.id==sel?"selected":""}>${esc(c.name)}</option>`).join("");
}
function fillCities(){
  const k=$("#c_country").value;
  $("#c_city").innerHTML=`<option value="">Город</option>${k?cityOptions(k,null):""}`;
}

// ---------- ВХОД, РЕГИСТРАЦИЯ, ПАРОЛЬ ----------
function loginView(){
  setTab("");
  $("#app").innerHTML=`
    <div class="hero" style="margin-bottom:12px">
      <div class="txt"><div class="hi">Кабинет продавца 💖</div><div class="hs">Войдите или зарегистрируйтесь, чтобы добавлять товары.</div></div>
    </div>
    <div class="card">
      <input id="em" type="email" placeholder="Email">
      <input id="pw" type="password" placeholder="Пароль (не короче 6 символов)">
      <button class="btn" onclick="login()">Войти</button>
      <button class="btn light" onclick="register()">Зарегистрироваться</button>
      <p><a href="#" onclick="forgot();return false" style="color:var(--pd);font-weight:600">Забыли пароль?</a></p>
      <p id="msg" class="muted"></p>
    </div>`;
}
async function login(){
  const {data,error}=await db.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(error){ $("#msg").textContent=errText(error); return; }
  user=data.user;
  if(await isAdmin()) return location.replace("../admin/");
  renderNav(); go("#/");
}
async function register(){
  const email=$("#em").value.trim(), password=$("#pw").value;
  if(!email||password.length<6){ $("#msg").textContent="Введите email и пароль (не короче 6 символов)."; return; }
  const {data,error}=await db.auth.signUp({email,password});
  if(error){ $("#msg").textContent=errText(error); return; }
  if(!data.session){ $("#msg").textContent="Аккаунт создан. Нажмите «Войти»."; return; }
  user=data.user; renderNav(); go("#/");
}
async function forgot(){
  const email=$("#em").value.trim();
  if(!email){ $("#msg").textContent="Сначала введите email."; return; }
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:SITE});
  if(error){ $("#msg").textContent=errText(error); return; }
  $("#msg").textContent="Ссылка для смены пароля отправлена на "+email+".";
}
function recoveryView(){
  $("#app").innerHTML=`
    <div class="card">
      <h3>Новый пароль</h3>
      <input id="np" type="password" placeholder="Новый пароль (не короче 6 символов)">
      <button class="btn" onclick="setNewPassword()">Сохранить пароль</button>
      <p id="msg" class="muted"></p>
    </div>`;
}
async function setNewPassword(){
  const p=$("#np").value;
  if(p.length<6){ $("#msg").textContent="Пароль должен быть не короче 6 символов."; return; }
  const {data,error}=await db.auth.updateUser({password:p});
  if(error){ $("#msg").textContent=errText(error); return; }
  user=data.user; recovery=false;
  history.replaceState(null,"",location.pathname+"#/");
  renderNav(); route();
}
async function changePassword(){
  const p=$("#npw").value, m=$("#pmsg");
  if(p.length<6){ m.textContent="Пароль должен быть не короче 6 символов."; return; }
  const {error}=await db.auth.updateUser({password:p});
  m.textContent=error?errText(error):"Пароль изменён.";
  if(!error) $("#npw").value="";
}

// ---------- ГЛАВНАЯ ----------
async function thumbUrl(p){
  if(isLive(p)&&p.photos?.length) return p.photos[0];
  if(p.draft_photos?.length){
    const {data}=await db.storage.from("product-drafts").createSignedUrl(p.draft_photos[0],3600);
    return data?.signedUrl||"";
  }
  return "";
}
async function homeView(){
  setTab("home");
  const {data:prods,error}=await db.from("products")
    .select("id,title,price,status,created_at,photos_until,photos,draft_photos")
    .eq("seller_id",user.id).order("created_at",{ascending:false});
  if(error){ $("#app").innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  const list=prods||[];
  const thumbs=await Promise.all(list.map(thumbUrl));
  const av=user.user_metadata?.avatar;
  const top=CATS.filter(c=>c.parent_id==null);
  $("#app").innerHTML=`
    <div class="hero">
      <div class="av">${av?`<img src="${esc(av)}">`:esc((user.email||"?")[0].toUpperCase())}</div>
      <div class="txt">
        <div class="hs">Хуш омадед</div>
        <div class="hi">${esc(user.email)}</div>
        <button class="hbtn" onclick="go('#/cats')">+ Добавить товар</button>
      </div>
    </div>
    <h3>Категории</h3>
    <div class="tiles">${top.map(c=>`<div class="tile" onclick="go('#/cats/${c.id}')"><span>${icon(c.name)}</span><b>${esc(c.name)}</b></div>`).join("")}</div>
    <h3>Мои товары (${list.length})</h3>
    ${list.map((p,i)=>prodRow(p,thumbs[i])).join("")||'<p class="muted">Пока нет товаров. Нажмите «+ Добавить товар».</p>'}`;
}
function prodRow(p,thumb){
  const expired=isExpired(p);
  const [label,color]=expired?["Срок фото истёк","#f59e0b"]:(ST[p.status]||[p.status,"#9d6b84"]);
  let b="";
  if(isLive(p)) b+=`<button class="sm" onclick="go('#/edit/${p.id}')">Цена и данные</button>`;
  if(expired) b+=`<button class="sm" onclick="go('#/edit/${p.id}')">Загрузить фото заново</button>`;
  if(["rejected","awaiting_payment","draft"].includes(p.status)) b+=`<button class="sm" onclick="go('#/edit/${p.id}')">Исправить и отправить</button>`;
  if(p.status==="pending_review") b+=`<span class="muted">Ответ: 5–30 минут</span>`;
  if(p.status!=="pending_review") b+=`<button class="sm red" onclick="delProduct(${p.id})">Удалить</button>`;
  const dates=[`Добавлено: ${ago(p.created_at)}`];
  if(isLive(p)&&p.photos_until) dates.push(`Фото до: ${fdate(p.photos_until)}`);
  const warn=expired
    ? `<div class="warn2">Фото удалены по истечении ${PHOTO_MONTHS} месяцев (${fdate(p.photos_until)}). Загрузите фото заново, и товар снова пройдёт проверку.</div>`
    : "";
  return `<div class="card">
    <div class="prod">
      ${thumb?`<img class="thumb" src="${esc(thumb)}">`:`<div class="ph">📷</div>`}
      <div class="pt">
        <b>${esc(p.title)}</b>
        <div class="price">${p.price} ₽</div>
        <span class="badge" style="background:${color}">${label}</span>
        <div class="note">${dates.join(" · ")}</div>
      </div>
    </div>
    ${warn}
    <div style="margin-top:8px">${b}</div>
  </div>`;
}
async function delProduct(id){
  if(!confirm("Удалить товар?")) return;
  const {error}=await db.from("products").delete().eq("id",id);
  if(error) return alert("Ошибка: "+error.message);
  route();
}

// ---------- ВЫБОР КАТЕГОРИИ ----------
async function catsView(parent){
  setTab("cats");
  await loadRefs();
  const current=parent?CATS.find(c=>c.id===parent):null;
  const children=CATS.filter(c=>(c.parent_id??null)===(parent??null));
  const crumbs=[]; let cur=current;
  while(cur){ crumbs.unshift(cur); cur=CATS.find(c=>c.id===cur.parent_id); }
  const isLeaf=!!current&&!CATS.some(c=>c.parent_id===current.id);
  $("#app").innerHTML=`
    <div class="crumbs"><a href="#/">← Главная</a> · <a href="#/cats">Категории</a>${crumbs.map(c=>` › <a href="#/cats/${c.id}">${esc(c.name)}</a>`).join("")}</div>
    ${isLeaf
      ? `<div class="card"><div class="muted">Товар будет добавлен в категорию</div>
          <div class="big2">${esc(current.name)}</div>
          <button class="btn" onclick="go('#/new/${current.id}')">Добавить товар сюда</button></div>`
      : `<p class="muted">${current?`Выберите подкатегорию в «${esc(current.name)}»:`:"Выберите раздел:"}</p>
         ${children.map(c=>`<div class="cat" onclick="go('#/cats/${c.id}')"><span>${current?"":icon(c.name)+" "}${esc(c.name)}</span><i>›</i></div>`).join("")||'<p class="muted">Здесь пока пусто.</p>'}`}`;
}

// ---------- ФОРМА ТОВАРА ----------
function payBlock(){
  return `
    <h3>Оплата публикации: ${FEE_TEXT}</h3>
    <div class="pcard">
      <button class="copy" onclick="copyCard()">Копировать</button>
      <div class="chip"></div>
      <div class="pbank">${esc(CARD_BANK)}</div>
      <div class="pnum">${CARD_NUMBER.replace(/(.{4})/g,"$1 ").trim()}</div>
    </div>
    <div class="warn">Переведите <b>${FEE_TEXT}</b> на эту карту. В комментарии к переводу обязательно напишите название товара, например: <b>«iPhone 11 pro black»</b>. Без этого заявка не будет принята.</div>
    <input id="pc" placeholder="Комментарий к переводу, например: iPhone 11 pro black">
    <p class="muted">Скриншот чека:</p>
    <input id="rc" type="file" accept="image/*">`;
}
async function copyCard(){
  try{ await navigator.clipboard.writeText(CARD_NUMBER); alert("Номер карты скопирован."); }
  catch(e){ alert("Номер карты: "+CARD_NUMBER); }
}
async function productForm(id,catId){
  await loadRefs();
  setTab("cats");
  let p={};
  if(id){
    const {data}=await db.from("products").select("*").eq("id",id).maybeSingle();
    if(!data||data.seller_id!==user.id) return go("#/");
    if(data.status==="pending_review"){ alert("Заявка уже на проверке. Ждите ответа."); return go("#/"); }
    p=data;
  }
  const categoryId=id?p.category_id:catId;
  const cat=CATS.find(c=>c.id===categoryId);
  if(!cat) return go("#/cats");
  const live=!!id&&isLive(p);
  $("#app").innerHTML=`
    <div class="crumbs"><a href="#/">← Главная</a></div>
    <h2>${id?(live?"Изменить товар":"Отправить товар снова"):"Новый товар"}</h2>
    <div class="card">
      <div class="muted">Категория</div>
      <div class="big2">${esc(cat.name)}</div>
      <input id="t" placeholder="Название товара" value="${esc(p.title)}">
      <textarea id="d" rows="3" placeholder="Описание">${esc(p.description)}</textarea>
      <input id="q" placeholder="Качество (например: премиум, 1 сорт)" value="${esc(p.quality)}">
      <input id="o" placeholder="Страна производства" value="${esc(p.origin_country)}">
      <input id="ad" placeholder="Адрес (склад / пункт выдачи)" value="${esc(p.address)}">
      <select id="c_country" onchange="fillCities()"><option value="">Страна продажи</option>${countryOptions(p.country_id)}</select>
      <select id="c_city"><option value="">Город</option>${p.country_id?cityOptions(p.country_id,p.city_id):""}</select>
      <input id="pr" type="number" placeholder="Цена за штуку, ₽" value="${p.price??""}">
      <input id="mo" type="number" placeholder="Минимальный заказ, шт" value="${p.min_order??""}">
      <input id="ph" type="tel" placeholder="Телефон" value="${esc(p.seller_phone)}">
      <input id="em" type="email" placeholder="Email" value="${esc(p.seller_email)}">
      <input id="ig" placeholder="Instagram (необязательно)" value="${esc(p.instagram)}">
      ${live
        ? `<p class="muted">Фото опубликованного товара менять нельзя.</p>`
        : `<p class="muted">Фото: от 3 до 6 из галереи телефона.</p><input id="files" type="file" accept="image/*" multiple>`}
    </div>
    ${live ? "" : `<div class="card">${payBlock()}</div>`}
    <button class="btn" onclick="saveProduct(${id?id:"null"},${categoryId},${live})">${live?"Сохранить":"Отправить заявку"}</button>
    <p id="msg" class="muted"></p>`;
}
async function uploadOne(bucket,file,path){
  const {error}=await db.storage.from(bucket).upload(path,file,{contentType:file.type||"image/jpeg"});
  if(error) throw new Error(error.message);
  return path;
}
async function uploadDrafts(files){
  const out=[];
  for(const [i,f] of files.entries()){
    out.push(await uploadOne("product-drafts",f,`${user.id}/${Date.now()}_${i}.jpg`));
  }
  return out;
}
async function saveProduct(id,catId,live){
  const msg=$("#msg");
  const v=s=>($(s)?.value??"").trim();
  const title=v("#t"), desc=v("#d"), quality=v("#q"), origin=v("#o"), address=v("#ad");
  const country=+$("#c_country").value, city=+$("#c_city").value;
  const price=+$("#pr").value, min=+$("#mo").value;
  const phone=v("#ph"), email=v("#em"), ig=v("#ig");
  const files=$("#files")?[...$("#files").files]:[];
  if(!title||!price||!min||!country||!city||!quality||!origin||!address){
    msg.textContent="Заполните название, качество, страну производства, адрес, страну, город, цену и минимальный заказ."; return;
  }
  if(!phone&&!email){ msg.textContent="Укажите телефон или email для связи."; return; }
  const fields={title,description:desc||null,category_id:catId,country_id:country,city_id:city,price,min_order:min,
    quality,origin_country:origin,address,seller_phone:phone||null,seller_email:email||null,instagram:ig||null};
  msg.textContent="Отправляем...";
  try{
    if(live){
      const {error}=await db.from("products").update(fields).eq("id",id);
      if(error) throw new Error(error.message);
      alert("Изменения сохранены."); return go("#/");
    }
    if(files.length&&(files.length<3||files.length>6)) throw new Error("фото: от 3 до 6");
    const receipt=$("#rc")?.files[0], comment=v("#pc");
    if(!receipt) throw new Error("загрузите скриншот чека");
    if(!comment) throw new Error("в комментарии к переводу напишите название товара");
    let drafts=null;
    if(files.length) drafts=await uploadDrafts(files);
    if(!drafts){
      if(!id) throw new Error("загрузите от 3 до 6 фото");
      const {data:old}=await db.from("products").select("draft_photos").eq("id",id).maybeSingle();
      if((old?.draft_photos?.length||0)<3) throw new Error("загрузите от 3 до 6 фото");
    }
    const receiptPath=await uploadOne("receipts",receipt,`${user.id}/fee_${Date.now()}.jpg`);
    const common={...fields,status:"pending_review",receipt_url:receiptPath,payment_comment:comment,owner_email:user.email};
    if(!id){
      const {error}=await db.from("products").insert({...common,seller_id:user.id,draft_photos:drafts});
      if(error) throw new Error(error.message);
    } else {
      const row={...common};
      if(drafts){
        const {data:old}=await db.from("products").select("draft_photos").eq("id",id).maybeSingle();
        row.draft_photos=drafts;
        if(old?.draft_photos?.length) await db.storage.from("product-drafts").remove(old.draft_photos);
      }
      const {error}=await db.from("products").update(row).eq("id",id);
      if(error) throw new Error(error.message);
    }
    alert("Заявка отправлена. Ответ: 5–30 минут.");
    go("#/");
  }catch(err){
    msg.textContent="Ошибка: "+err.message;
  }
}

// ---------- АККАУНТ ----------
function accountView(){
  setTab("account");
  const av=user.user_metadata?.avatar;
  $("#app").innerHTML=`
    <h2>Аккаунт</h2>
    <div class="card" style="text-align:center">
      <div class="av" style="width:96px;height:96px;margin:4px auto 10px;color:var(--pd);background:#fce7f3;border-color:#fff;font-size:34px">${av?`<img src="${esc(av)}">`:esc((user.email||"?")[0].toUpperCase())}</div>
      <div style="font-weight:800;word-break:break-all">${esc(user.email)}</div>
      <p class="muted">Фото профиля (необязательно)</p>
      <input type="file" accept="image/*" onchange="uploadAvatar(this.files[0])">
    </div>
    <div class="card">
      <b>Смена пароля</b>
      <input id="npw" type="password" placeholder="Новый пароль (не короче 6 символов)">
      <button class="btn light" onclick="changePassword()">Сохранить пароль</button>
      <p id="pmsg" class="muted"></p>
    </div>
    <button class="btn light" onclick="logout()">Выйти из аккаунта</button>
    <button class="btn danger" onclick="deleteAccount()">Удалить аккаунт</button>
    <p class="muted" style="text-align:center">Удаление аккаунта удаляет все ваши товары и заявки.</p>`;
}
async function uploadAvatar(file){
  if(!file) return;
  try{
    const path=`${user.id}/avatar_${Date.now()}.jpg`;
    const {error}=await db.storage.from("avatars").upload(path,file,{contentType:file.type||"image/jpeg"});
    if(error) throw new Error(error.message);
    const url=db.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    const {data,error:e2}=await db.auth.updateUser({data:{avatar:url}});
    if(e2) throw new Error(e2.message);
    user=data.user;
    accountView();
  }catch(err){
    alert("Ошибка: "+err.message);
  }
}
async function deleteAccount(){
  if(!confirm("Удалить аккаунт? Все ваши товары и заявки будут удалены без восстановления.")) return;
  const {error}=await db.rpc("delete_my_account");
  if(error) return alert("Ошибка: "+error.message);
  await db.auth.signOut();
  user=null; renderNav();
  alert("Аккаунт удалён.");
  location.hash="#/"; route();
}

init();
</script>
