<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://fwvvnzrprjffsmkpvhrl.supabase.co; base-uri 'self'; form-action 'self'">
<title>Поддержка 24/7 · 700 OPTOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--r:#dc2626;--r2:#ef4444;--rd:#7f1d1d;--k:#0a0a0a;--card:#141414;--card2:#1c1c1c;--line:#2a2a2a;--t:#f5f5f5;--m:#a3a3a3;--ok:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--k);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:22px;letter-spacing:-1px;line-height:.95}
.logo small{display:block;font-family:Inter,sans-serif;font-size:9px;letter-spacing:4px;color:var(--m);font-weight:700}
.back{color:var(--r2);text-decoration:none;font-weight:800;font-size:14px}
.wrap{max-width:620px;margin:0 auto;padding:12px 14px 20px;display:flex;flex-direction:column;height:calc(100vh - 62px);min-height:460px}
.hero{background:linear-gradient(135deg,var(--r),var(--rd) 55%,#000);border-radius:22px;padding:16px 18px;box-shadow:0 12px 30px #dc262640;margin-bottom:10px}
.hero b{font-size:17px;font-weight:900}
.hero p{margin:6px 0 0;font-size:13px;opacity:.92;line-height:1.5}
.clog{flex:1;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--r),var(--rd));color:#fff;border-bottom-right-radius:5px}
.msg.admin{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-bottom:6px}
.mt{font-size:10px;opacity:.6;margin-top:4px;text-align:right}
.muted{color:var(--m);font-size:13px;text-align:center;margin:auto}
.prev{display:none;align-items:center;gap:10px;margin-top:8px}
.prev.on{display:flex}
.prev img{width:60px;height:60px;object-fit:cover;border-radius:12px}
.cform{display:flex;gap:8px;align-items:flex-end;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px}
.cform textarea{flex:1;margin:0;border:0;background:none;color:var(--t);padding:10px;resize:none;height:44px;max-height:120px;font-size:16px;font-family:inherit;outline:none}
.clip{width:44px;height:44px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex:0 0 44px}
.send{width:46px;height:46px;border-radius:16px;border:0;background:var(--r);color:#fff;font-size:18px;cursor:pointer;flex:0 0 46px;transition:background .2s}
.send.ok{background:var(--ok)}
.send:disabled{opacity:.8}
.err{color:var(--r2);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--t);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.cols{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 4px}
.sub{font-size:12px;color:var(--m)}
</style>
</head>
<body>
<header class="top">
  <div class="logo">700<small>OPTOM · ПОДДЕРЖКА</small></div>
  <a class="back" href="../" id="backLink">← На сайт</a>
</header>
<div class="wrap">
  <div class="hero">
    <b>Поддержка 24/7</b>
    <p>Мы только что открылись и отвечаем на все вопросы. Из-за большого количества обращений ответ может занять немного времени, но мы обязательно ответим. Спасибо, что вы с нами! 🥰❤️✨</p>
  </div>
  <div class="cols">
    <span class="sub" id="who">Вы пишете как гость</span>
    <button class="btn" onclick="resetChat()">Новый диалог</button>
  </div>
  <div class="clog" id="clog"><div class="muted">Загрузка...</div></div>
  <div class="prev" id="prev"><img id="pimg"><button class="btn" onclick="clearPhoto()">Убрать</button></div>
  <form class="cform" onsubmit="send(event)">
    <label class="clip">📷<input type="file" accept="image/*" style="display:none" onchange="pick(this.files[0])"></label>
    <textarea id="txt" rows="1" placeholder="Напишите сообщение…" maxlength="1000"></textarea>
    <button class="send" id="sbtn" type="submit">➤</button>
  </form>
  <div class="err" id="err"></div>
</div>
<script>
const SB_URL="https://fwvvnzrprjffsmkpvhrl.supabase.co";
const SB_KEY="sb_publishable_wJYMx4Gs-NlZXUBFedcVaQ_H30wRYUz";
const db=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
let KEY=null, USER=null, PHOTO=null, TIMER=null, AC=null;

// Ключ диалога: для гостя — случайный id в localStorage; для вошедшего — его id
function guestKey(){
  let k=localStorage.getItem("opt_support_key");
  if(!k){ k=crypto.randomUUID(); localStorage.setItem("opt_support_key",k); }
  return k;
}
function beep(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+0.07);
  }catch(e){}
}
document.addEventListener("click",e=>{ if(e.target.closest("button,.clip")) beep(); },true);

async function init(){
  const {data}=await db.auth.getSession();
  USER=data.session?.user||null;
  if(USER){
    const {data:a}=await db.from("admins").select("user_id").eq("user_id",USER.id);
    if(a&&a.length) return location.replace("../admin/");
  }
  KEY=USER?USER.id:guestKey();
  $("#who").textContent=USER?("Вы: "+(USER.user_metadata?.username||USER.email)):"Вы пишете как гость";
  $("#backLink").href=USER?"../":"../";
  await load(true);
  clearInterval(TIMER);
  TIMER=setInterval(()=>load(false),10000);
}
async function load(scroll){
  const {data,error}=await db.rpc("support_history",{p_key:KEY});
  const log=$("#clog");
  if(error){ $("#err").textContent="Ошибка: "+error.message; return; }
  const near=log.scrollHeight-log.scrollTop-log.clientHeight<100;
  const before=log.querySelectorAll(".msg.admin").length;
  const list=data||[];
  log.innerHTML=list.length
    ? list.map(m=>`<div class="msg ${m.sender==="admin"?"admin":"user"}">${m.attachment?`<img src="${esc(m.attachment)}">`:""}${m.body&&m.body!=="📷 Фото"?esc(m.body):""}<div class="mt">${fmt(m.created_at)}</div></div>`).join("")
    : '<div class="muted">Напишите первое сообщение — мы ответим как можно скорее.</div>';
  const after=log.querySelectorAll(".msg.admin").length;
  if(after>before) beep();
  if(scroll||near) log.scrollTop=log.scrollHeight;
}
async function pick(f){
  if(!f) return;
  try{ PHOTO=await toDataUrl(f,800); $("#pimg").src=PHOTO; $("#prev").classList.add("on"); $("#err").textContent=""; }
  catch(e){ PHOTO=null; $("#err").textContent=e.message; }
}
function clearPhoto(){ PHOTO=null; $("#prev").classList.remove("on"); $("#pimg").src=""; }
async function send(e){
  e.preventDefault();
  const t=$("#txt"), body=t.value.trim();
  if(!body&&!PHOTO){ $("#err").textContent="Напишите сообщение или прикрепите фото."; return; }
  const btn=$("#sbtn");
  btn.disabled=true; $("#err").textContent="";
  const {error}=await db.rpc("support_send",{p_key:KEY,p_body:body,p_email:USER?USER.email:null,p_attach:PHOTO});
  btn.disabled=false;
  if(error){ $("#err").textContent=error.message; return; }
  btn.classList.add("ok"); setTimeout(()=>btn.classList.remove("ok"),800);
  t.value=""; clearPhoto();
  await load(true);
}
function resetChat(){
  if(USER) return;
  localStorage.removeItem("opt_support_key");
  KEY=guestKey();
  load(true);
}
async function toDataUrl(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=0.7, out=c.toDataURL("image/jpeg",q);
    while(out.length>330000&&q>0.3){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
    if(out.length>330000) throw new Error("Фото слишком большое");
    return out;
  }finally{ URL.revokeObjectURL(url); }
}
init();
</script>
</body>
</html>
