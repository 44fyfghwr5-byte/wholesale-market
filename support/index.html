<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://fwvvnzrprjffsmkpvhrl.supabase.co; base-uri 'self'; form-action 'self'">
<title>Поддержка 24/7 · 700 OPTOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--r:#dc2626;--r2:#ef4444;--rd:#7f1d1d;--k:#0a0a0a;--card:#141414;--card2:#1c1c1c;--line:#2a2a2a;--t:#f5f5f5;--m:#a3a3a3;--ok:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--k);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(10,10,10,.9);backdrop-filter:blur(8px)}
.logo{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:19px;letter-spacing:-.5px;line-height:.95}
.logo small{display:block;font-family:Inter,sans-serif;font-size:8px;letter-spacing:3px;color:var(--m);font-weight:700}
.back{color:var(--r2);text-decoration:none;font-weight:800;font-size:13px;padding:7px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
/* Большой фон: 700 OPTOM */
.wm{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:0;user-select:none}
.wm b{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:min(62vw,300px);letter-spacing:-8px;line-height:.85;color:rgba(220,38,38,.085);text-shadow:0 0 60px rgba(220,38,38,.08)}
.wm small{font-family:Inter,sans-serif;font-weight:800;font-size:min(9vw,34px);letter-spacing:.7em;padding-left:.7em;color:rgba(255,255,255,.05);margin-top:10px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;height:calc(100% - 52px);display:flex;flex-direction:column;padding:8px 12px 10px}
.sub{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--m);padding:2px 2px 6px}
.sub button{background:var(--card2);border:1px solid var(--line);color:var(--t);border-radius:10px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.clog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:4px 2px}
.dsep{align-self:center;margin:6px 0 2px;font-size:10px;color:var(--m);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.msg{max-width:78%;padding:7px 10px;border-radius:14px;font-size:14px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--r),var(--rd));color:#fff;border-bottom-right-radius:4px}
.msg.admin{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg img{display:block;max-width:100%;max-height:200px;border-radius:10px;margin-bottom:4px}
.mt{font-size:9px;opacity:.6;margin-top:3px;text-align:right}
.empty{align-self:center;margin:auto;text-align:center;color:var(--m);font-size:13px;line-height:1.5;padding:20px}
.prev{display:none;align-items:center;gap:8px;margin-top:6px}
.prev.on{display:flex}
.prev img{width:48px;height:48px;object-fit:cover;border-radius:10px}
.cx{background:var(--card2);border:1px solid var(--line);color:var(--t);border-radius:999px;width:24px;height:24px;cursor:pointer;font-size:14px;padding:0}
.cform{display:flex;gap:6px;align-items:flex-end;margin-top:6px;background:rgba(20,20,20,.92);border:1px solid var(--line);border-radius:18px;padding:4px}
.cform textarea{flex:1;margin:0;border:0;background:none;color:var(--t);padding:8px;resize:none;height:36px;max-height:90px;font-size:15px;font-family:inherit;outline:none}
.clip{width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.clip input{display:none}
.send{width:38px;height:38px;flex:0 0 38px;border-radius:13px;border:0;background:var(--r);color:#fff;font-size:15px;cursor:pointer}
.send:disabled{opacity:.7}
.send.ok{background:var(--ok)}
.err{color:#fca5a5;font-size:12px;font-weight:700;min-height:16px;margin-top:4px}
</style>
</head>
<body>
<header class="top">
  <div class="logo">700<small>OPTOM · ПОДДЕРЖКА</small></div>
  <a class="back" href="../">← Сайт</a>
</header>
<div class="wm"><b>700</b><small>OPTOM</small></div>
<div class="wrap">
  <div class="sub"><span id="who">Вы пишете как гость</span><button onclick="resetChat()">Новый диалог</button></div>
  <div class="clog" id="clog"><div class="empty">Загрузка...</div></div>
  <div class="prev" id="prev"><img id="pimg"><button class="cx" onclick="clearPhoto()">×</button></div>
  <form class="cform" onsubmit="send(event)">
    <label class="clip">📷<input type="file" accept="image/*" onchange="pick(this.files[0])"></label>
    <textarea id="txt" rows="1" placeholder="Сообщение…" maxlength="1000"></textarea>
    <button class="send" id="sbtn" type="submit">➤</button>
  </form>
  <div class="err" id="err"></div>
</div>
<script>
const SB_URL="https://fwvvnzrprjffsmkpvhrl.supabase.co";
const SB_KEY="sb_publishable_wJYMx4Gs-NlZXUBFedcVaQ_H30wRYUz";
const db=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tm=t=>new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
function dayKey(t){ const d=new Date(t); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dayLabel(t){
  const d=new Date(t), now=new Date(), y=new Date(); y.setDate(now.getDate()-1);
  if(dayKey(t)===dayKey(now)) return "Сегодня";
  if(dayKey(t)===dayKey(y)) return "Вчера";
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
}
function withDays(list,render){
  let last="", out="";
  list.forEach(m=>{
    const k=dayKey(m.created_at);
    if(k!==last){ out+=`<div class="dsep">${dayLabel(m.created_at)}</div>`; last=k; }
    out+=render(m);
  });
  return out;
}
let KEY=null, USER=null, PHOTO=null, TIMER=null, AC=null;

function guestKey(){
  let k=localStorage.getItem("opt_support_key");
  if(!k){ k=crypto.randomUUID(); localStorage.setItem("opt_support_key",k); }
  return k;
}
function beep(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+0.07);
  }catch(e){}
}
document.addEventListener("click",e=>{ if(e.target.closest("button,.clip")) beep(); },true);

async function init(){
  const {data}=await db.auth.getSession();
  USER=data.session?.user||null;
  if(USER){
    const {data:a}=await db.from("admins").select("user_id").eq("user_id",USER.id);
    if(a&&a.length) return location.replace("../admin/");
  }
  KEY=USER?USER.id:guestKey();
  $("#who").textContent=USER?("Вы: "+(USER.user_metadata?.username||USER.email)):"Вы пишете как гость";
  await load(true);
  clearInterval(TIMER);
  TIMER=setInterval(()=>load(false),10000);
}
async function load(scroll){
  const {data,error}=await db.rpc("support_history",{p_key:KEY});
  const log=$("#clog");
  if(error){ $("#err").textContent="Ошибка: "+error.message; return; }
  const near=log.scrollHeight-log.scrollTop-log.clientHeight<100;
  const list=(data||[]).filter(m=>!(m.body==="📷 Фото"&&!m.attachment));
  const before=log.querySelectorAll(".msg.admin").length;
  log.innerHTML=list.length
    ? withDays(list,m=>`<div class="msg ${m.sender==="admin"?"admin":"user"}">${m.attachment?`<img src="${esc(m.attachment)}">`:""}${m.body&&m.body!=="📷 Фото"?esc(m.body):""}<div class="mt">${tm(m.created_at)}</div></div>`)
    : '<div class="empty">Напишите первое сообщение — мы ответим как можно скорее.</div>';
  const after=log.querySelectorAll(".msg.admin").length;
  if(after>before) beep();
  if(scroll||near) log.scrollTop=log.scrollHeight;
}
async function pick(f){
  if(!f) return;
  try{ PHOTO=await toDataUrl(f,800); $("#pimg").src=PHOTO; $("#prev").classList.add("on"); $("#err").textContent=""; }
  catch(e){ PHOTO=null; $("#err").textContent=e.message; }
}
function clearPhoto(){ PHOTO=null; $("#prev").classList.remove("on"); $("#pimg").src=""; }
async function send(e){
  e.preventDefault();
  const t=$("#txt"), body=t.value.trim();
  if(!body&&!PHOTO){ $("#err").textContent="Напишите сообщение или прикрепите фото."; return; }
  const btn=$("#sbtn");
  btn.disabled=true; $("#err").textContent="";
  const {error}=await db.rpc("support_send",{p_key:KEY,p_body:body,p_email:USER?USER.email:null,p_attach:PHOTO});
  btn.disabled=false;
  if(error){ $("#err").textContent=error.message; return; }
  btn.classList.add("ok"); setTimeout(()=>btn.classList.remove("ok"),700);
  t.value=""; clearPhoto();
  await load(true);
}
function resetChat(){
  if(USER) return;
  localStorage.removeItem("opt_support_key");
  KEY=guestKey();
  load(true);
}
async function toDataUrl(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=0.7, out=c.toDataURL("image/jpeg",q);
    while(out.length>330000&&q>0.3){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
    if(out.length>330000) throw new Error("Фото слишком большое");
    return out;
  }finally{ URL.revokeObjectURL(url); }
}
init();
</script>
</body>
</html>
