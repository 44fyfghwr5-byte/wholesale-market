<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Поддержка 700/OPTOM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0c0e13;--card:#151922;--line:#262b36;--txt:#f3f3f5;--mut:#9aa1ad;--acc:#9b1d30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}
header a{color:var(--mut);text-decoration:none;font-size:14px}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.msg.admin{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:6px}
.time{font-size:11px;color:var(--mut);margin-top:3px;text-align:right}
.msg.admin .time{text-align:left}
.empty{color:var(--mut);text-align:center;margin:auto;font-size:15px;padding:20px}
.prev{padding:8px 14px;display:none;align-items:center;gap:10px;border-top:1px solid var(--line)}
.prev.on{display:flex}
.prev img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.prev button{background:#333;padding:8px 12px;font-size:13px;border:0;color:#fff;border-radius:10px}
form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.clip{background:var(--card);border:1px solid var(--line);border-radius:12px;width:46px;height:46px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 46px}
.clip input{display:none}
textarea{flex:1;resize:none;height:46px;max-height:120px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;font-family:inherit}
button.send{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:0 16px;height:46px;font-size:15px;font-weight:600;cursor:pointer}
button.send:disabled{opacity:.5}
#err{color:#f87171;font-size:13px;padding:0 14px 8px}
</style>
</head>
<body>
<header><b>Поддержка 700/OPTOM</b><a href="../">← На сайт</a></header>
<div id="log"><div class="empty">Загрузка...</div></div>
<div class="prev" id="prev"><img id="pimg"><button type="button" onclick="clearPhoto()">Убрать</button></div>
<div id="err"></div>
<form onsubmit="send(event)">
  <label class="clip">📷<input type="file" id="pf" accept="image/*" onchange="pick(this.files[0])"></label>
  <textarea id="txt" placeholder="Напишите вопрос..." maxlength="1000"></textarea>
  <button class="send" id="btn">Отправить</button>
</form>
<script>
const SB_URL="https://fwvvnzrprjffsmkpvhrl.supabase.co";
const SB_KEY="sb_publishable_wJYMx4Gs-NlZXUBFedcVaQ_H30wRYUz";
const db=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function newKey(){
  return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
}
let KEY=localStorage.getItem("opt_support_key");
if(!KEY||KEY.length<8){ KEY=newKey(); try{ localStorage.setItem("opt_support_key",KEY); }catch(e){} }
let EMAIL="", PHOTO=null;

async function init(){
  const {data}=await db.auth.getSession();
  EMAIL=data.session?.user?.email||"";
  await load();
  setInterval(load,10000);
}
async function load(){
  const {data,error}=await db.rpc("support_history",{p_key:KEY});
  if(error){ $("#err").textContent="Ошибка: "+error.message; return; }
  const list=data||[];
  const log=$("#log");
  const near=log.scrollHeight-log.scrollTop-log.clientHeight<100;
  log.innerHTML=list.length
    ? list.map(m=>`<div class="msg ${m.sender==="admin"?"admin":"user"}">${m.attachment?`<img src="${esc(m.attachment)}">`:""}${m.body&&m.body!=="📷 Фото"?esc(m.body):""}<div class="time">${fmt(m.created_at)}</div></div>`).join("")
    : '<div class="empty">Напишите нам текстом или отправьте фото. Ответ придёт сюда.</div>';
  if(near||list.length<=1) log.scrollTop=log.scrollHeight;
}
async function pick(file){
  if(!file) return;
  try{
    PHOTO=await compress(file);
    $("#pimg").src=PHOTO;
    $("#prev").classList.add("on");
    $("#err").textContent="";
  }catch(e){
    PHOTO=null;
    $("#err").textContent=e.message;
  }
}
function clearPhoto(){
  PHOTO=null;
  $("#pf").value="";
  $("#prev").classList.remove("on");
}
async function compress(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{
    const i=new Image();
    i.onload=()=>res(i);
    i.onerror=()=>rej(new Error("Не удалось открыть фото. Выберите другое."));
    i.src=url;
  });
  const k=Math.min(1,800/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);
  let q=0.7, out=c.toDataURL("image/jpeg",q);
  while(out.length>330000 && q>0.3){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
  if(out.length>330000) throw new Error("Фото слишком большое. Выберите другое.");
  return out;
}
async function send(e){
  e.preventDefault();
  const t=$("#txt"), body=t.value.trim(), btn=$("#btn");
  if(!body && !PHOTO){ $("#err").textContent="Напишите сообщение или выберите фото."; return; }
  btn.disabled=true; $("#err").textContent="";
  const {error}=await db.rpc("support_send",{p_key:KEY,p_body:body,p_email:EMAIL||null,p_attach:PHOTO});
  btn.disabled=false;
  if(error){ $("#err").textContent=error.message; return; }
  t.value="";
  clearPhoto();
  await load();
}
init();
</script>
</body>
</html>
