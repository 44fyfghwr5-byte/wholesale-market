async function act(btn,fn){
  if(!btn||btn.disabled) return false;
  const label=btn.dataset.label||btn.textContent.trim(); btn.dataset.label=label;
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{ await fn(); toast("✓","ok"); return true; }
  catch(e){ toast(e.message||"Ошибка","err"); return false; }
  finally{ btn.disabled=false; btn.innerHTML=label; }
}

function pwField(id,ph){
  return `<div class="pwwrap"><input id="${id}" type="password" placeholder="${ph}" autocomplete="off"><button type="button" class="eye" onclick="togglePw('${id}',this)" aria-label="Показать пароль">👁</button></div>`;
}
function togglePw(id,b){
  const i=$("#"+id); if(!i) return;
  const show=i.type==="password";
  i.type=show?"text":"password"; b.textContent=show?"🙈":"👁";
}
async function toJpeg(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Не удалось сжать фото")),"image/jpeg",q));
  } finally { URL.revokeObjectURL(url); }
}

// ---------- PUSH ----------
function b64ToU8(s){
  const pad="=".repeat((4-s.length%4)%4);
  const raw=atob((s+pad).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function pushStatus(){
  try{
    if(!("serviceWorker" in navigator)||!("PushManager" in window)) return false;
    const reg=await navigator.serviceWorker.getRegistration("../");
    if(!reg) return false;
    const sub=await reg.pushManager.getSubscription();
    return !!sub && Notification.permission==="granted";
  }catch(e){ return false; }
}
async function enablePush(btn){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){
    toast("Откройте сайт с иконки «Домой» (iOS 16.4+)","err"); return;
  }
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){ toast("Уведомления не разрешены","err"); return; }
    const reg=await navigator.serviceWorker.register("../sw.js");
    await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(sub) await sub.unsubscribe();
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUB)});
    const j=sub.toJSON();
    const {error}=await db.from("push_subscriptions").upsert(
      {user_id:user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},
      {onConflict:"endpoint"}
    );
    if(error) throw new Error(error.message);
    PUSH_ON=true;
    toast("✓ Уведомления включены","ok");
    render();
  }catch(e){ toast(e.message||"Ошибка уведомлений","err"); }
}

async function loginGoogle(){
  const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:SITE}});

async function loginEmail(btn){
  const em=($("#em").value||"").trim(), pw=$("#pw").value;
  if(!em||!pw){ $("#lmsg").textContent="Введите email и пароль"; return; }
  LOCK=true;
  try{

async function checkAndRoute(){
  const {data,error}=await db.from("admins").select("user_id").eq("user_id",user.id);
  if(error||!data||!data.length){
    user=null; await db.auth.signOut();

    return;
  }
  document.body.classList.add("app"); $("#nav").classList.add("on");
  buildNav();

  TAB="home"; SUB="home"; OPEN_KEY=null;
  render(); startAuto();
}
async function logout(){ await db.auth.signOut(); user=null; renderLogin(); }
async function boot(){
  LOCK=true;
  try{
    const {data}=await db.auth.getSession();
    if(data.session?.user){ user=data.session.user; await checkAndRoute(); }
    else renderLogin();
  } finally { LOCK=false; }
}
db.auth.onAuthStateChange(async (ev,s)=>{
  if(LOCK) return;
  if(ev==="SIGNED_IN"&&s?.user&&!user){
    user=s.user; history.replaceState(null,"",location.pathname);
    await checkAndRoute();
  } else if(ev==="SIGNED_OUT"){
    user=null; renderLogin();
  }
});

}
function editProd(id){
  const p=PRODS.find(x=>x.id===id); if(!p) return;
  EDIT_ID=id; EDIT_TIER=p.tier||0;
  openSheet(`<h3>Изменить товар</h3>
    <input id="e_title" value="${esc(p.title)}" placeholder="Название">
    <input id="e_price" type="number" inputmode="numeric" value="${p.price}" placeholder="Цена ₽">
    <input id="e_min" type="number" inputmode="numeric" value="${p.min_order}" placeholder="Мин. заказ, шт">
    <h3>Размещение на сайте</h3>
    <div class="tiers">${TIER_NAME.map((n,i)=>`<button class="tierbtn ${EDIT_TIER===i?"on":""}" data-v="${i}" onclick="pickTier(${i})">${n}</button>`).join("")}</div>
    <h3>Статус</h3>
    <select id="e_status">${["published","pending_review","rejected"].map(s=>`<option value="${s}" ${p.status===s?"selected":""}>${STATUS_NAME[s]}</option>`).join("")}</select>
    <button class="btn" onclick="saveProd(this)">Сохранить</button>
    <button class="btn n" onclick="closeSheet()">Отмена</button>`);
}
function pickTier(i){
  EDIT_TIER=i;
  document.querySelectorAll(".tierbtn").forEach(b=>b.classList.toggle("on",+b.dataset.v===i));
}
async function saveProd(btn){
  const title=($("#e_title").value||"").trim();
  const price=+$("#e_price").value, min=+$("#e_min").value, status=$("#e_status").value;
  if(!title||!(price>0)||!(min>0)){ toast("Проверьте название, цену и минимальный заказ","err"); return; }
  const ok=await act(btn,async()=>{
    const {error}=await db.from("products").update({
      title, price, min_order:min, status, tier:EDIT_TIER, requested_tier:EDIT_TIER
    }).eq("id",EDIT_ID);
    if(error) throw new Error(error.message);
  });
  if(ok){ closeSheet(); render(); }
}
async function approve(p){
  const paths=p.draft_photos||[];
  let urls=p.photos||[];
  if(paths.length){
    urls=[];
    for(let i=0;i<paths.length;i++){
      const {data:s,error:se}=await db.storage.from("product-drafts").createSignedUrl(paths[i],600);
      if(se) throw new Error(se.message);
      const blob=await (await fetch(s.signedUrl)).blob();
      const path=`${p.seller_id}/${Date.now()}_${i}.jpg`;
      const {error:ue}=await db.storage.from("product-photos").upload(path,blob,{contentType:"image/jpeg"});
      if(ue) throw new Error(ue.message);
      urls.push(db.storage.from("product-photos").getPublicUrl(path).data.publicUrl);
    }
  }
  const until=new Date();
  until.setMonth(until.getMonth()+((p.requested_tier||0)>=2?5:3));
  const {error}=await db.from("products").update({
    status:"published", tier:p.requested_tier||0, photos:urls, draft_photos:null, photos_until:until.toISOString()
  }).eq("id",p.id);
  if(error) throw new Error(error.message);
  if(paths.length) await db.storage.from("product-drafts").remove(paths);
}
async function approveP(btn,id){
  const p=PRODS.find(x=>x.id===id); if(!p) return;
  const ok=await act(btn,()=>approve(p));
  if(ok) render();
}
async function setStatus(btn,id,st){
  const ok=await act(btn,async()=>{
    const {error}=await db.from("products").update({status:st}).eq("id",id);
    if(error) throw new Error(error.message);
  });
  if(ok) render();
}
async function delP(btn,id){
  if(!confirm("Удалить товар?")) return;
  const ok=await act(btn,async()=>{
    const {error}=await db.from("products").delete().eq("id",id);
    if(error) throw new Error(error.message);
  });
  if(ok) render();
}
async function showReceipt(id){
  const p=PRODS.find(x=>x.id===id); if(!p?.receipt_url) return;
  const {data,error}=await db.storage.from("receipts").createSignedUrl(p.receipt_url,300);
  if(error) return toast(error.message,"err");
  window.open(data.signedUrl,"_blank");
}

// ---------- ЧАТ ----------
function setChatTab(i){ CHAT_TAB=i; OPEN_KEY=null; render(); }
function openThread(key,kind){ OPEN_KEY=key; OPEN_KIND=kind; render(); }
function closeThread(){ OPEN_KEY=null; OPEN_KIND=null; render(); }
async function loadSellerMap(){
  const {data,error}=await db.from("products").select("seller_id,owner_email").not("seller_id","is",null);
  if(error) throw error;
  SELLER_EMAIL={};
  (data||[]).forEach(p=>{ if(p.owner_email) SELLER_EMAIL[p.seller_id]=p.owner_email; });
}
function supName(r){ return r.user_email??r.email??("Пользователь "+String(r.user_id??r.id??"").slice(0,6)); }
function msgText(r){ return r.body??r.text??r.message??r.content??""; }
function isAdminMsg(r){ return !!(r.is_admin??r.from_admin??false); }

async function viewChat(){
  if(OPEN_KEY!==null) return viewThread();
  const tabs=`<div class="tabs">${CHAT_NAMES.map((n,i)=>`<button class="${CHAT_TAB===i?"on":""}" onclick="setChatTab(${i})">${n}</button>`).join("")}</div>`;
  let items=[];
  if(CHAT_TAB<2){
    const [{data,error}]=await Promise.all([
      db.from("chat_archive").select("thread_id,sender_id,body,attachment,created_at").order("created_at",{ascending:false}).limit(2000),
      loadSellerMap()
    ]);
    if(error) throw error;
    const map=new Map();
    (data||[]).forEach(m=>{
      const k=String(m.thread_id);
      if(!map.has(k)) map.set(k,{key:k,last:m,n:0,req:false,ids:new Set()});
      const e=map.get(k); e.n++;
      if(m.sender_id) e.ids.add(m.sender_id);
      if((m.body||"").startsWith("🛍")) e.req=true;
    });
    items=[...map.values()].filter(t=>CHAT_TAB===1?t.req:!t.req).map(t=>{
      const names=[...t.ids].filter(id=>id!==user.id).map(id=>SELLER_EMAIL[id]?("Продавец: "+SELLER_EMAIL[id]):("Харидор · "+String(id).slice(0,4)));
      return {key:t.key,kind:"thread",title:names.join("  ↔  ")||("Диалог "+t.key.slice(0,6)),preview:t.last.body||(t.last.attachment?"📷 / 🎤":""),at:t.last.created_at,n:t.n};
    });
  } else {
    const {data,error}=await db.from("support_messages").select("*").order("created_at",{ascending:false}).limit(1000);
    if(error) throw error;
    const map=new Map();
    (data||[]).forEach(r=>{
      const k=String(r.thread_id??r.user_id??r.id);
      if(!map.has(k)) map.set(k,{key:k,last:r,n:0});
      map.get(k).n++;
    });
    items=[...map.values()].map(t=>({key:t.key,kind:"support",title:supName(t.last),preview:msgText(t.last),at:t.last.created_at,n:t.n}));
  }
  $("#app").innerHTML=`
    <h2>Архив чатов</h2>
    <p class="muted">Все диалоги сохраняются здесь. Только просмотр, кроме ответа в поддержке.</p>
    ${tabs}
    ${items.map(t=>`
      <div class="citem glass" onclick="openThread('${esc(t.key)}','${t.kind}')">
        <div class="cav">#</div>
        <div class="cb">
          <div class="ct"><b>${esc(t.title)}</b><span>${fmt(t.at)}</span></div>
          <div class="cp">${esc(t.preview)}</div>
        </div>
        <span class="cnt">${t.n}</span>
      </div>`).join("")||'<p class="muted">Диалогов в этом разделе пока нет.</p>'}`;
}
function bubble(mine,text,attachment,at,label){
  let media="";
  if((attachment||"").startsWith("data:audio/")) media=`<audio class="vm" controls preload="metadata" src="${esc(attachment)}"></audio>`;
  else if(attachment) media=`<img src="${esc(attachment)}" alt="">`;
  const txt=text?esc(text).replace(/\n/g,"<br>"):"";
  return `<div class="bub ${mine?"me":"them"}"><div class="lbl">${esc(label)}</div>${media}${txt}<div class="bt">${tm(at)}</div></div>`;
}
async function viewThread(){
  const isSup=OPEN_KIND==="support";
  let html="";
  if(!isSup){
    await loadSellerMap();
    const {data,error}=await db.from("chat_archive").select("sender_id,body,attachment,created_at").eq("thread_id",OPEN_KEY).order("created_at");
    if(error) throw error;
    html=(data||[]).map(m=>{
      const mine=m.sender_id===user.id;
      const label=mine?"Админ":(SELLER_EMAIL[m.sender_id]?"Продавец · "+SELLER_EMAIL[m.sender_id]:"Харидор · "+String(m.sender_id).slice(0,4));
      return bubble(mine,m.body,m.attachment,m.created_at,label);
    }).join("");
  } else {
    const {data,error}=await db.from("support_messages").select("*").order("created_at");
    if(error) throw error;
    html=(data||[]).filter(r=>String(r.thread_id??r.user_id??r.id)===String(OPEN_KEY)).map(r=>{
      const mine=isAdminMsg(r);
      return bubble(mine,msgText(r),r.attachment,r.created_at,mine?"Админ":supName(r));
    }).join("");
  }
  $("#app").innerHTML=`
    <div class="thead glass">
      <button class="cbk" onclick="closeThread()" aria-label="Назад">‹</button>
      <b>${isSup?"Поддержка":"Диалог"} ${esc(String(OPEN_KEY).slice(0,8))}</b>
    </div>
    <div class="chat">${html||'<p class="muted">Сообщений нет.</p>'}</div>
    <div class="rbar">
      <input id="rtxt" placeholder="${isSup?"Ответ пользователю...":"Сообщение продавцу..."}">
      <button class="btn" onclick="sendReply(this)">➤</button>
    </div>`;
}
async function sendReply(btn){
  const txt=($("#rtxt").value||"").trim();
  if(!txt){ toast("Напишите сообщение","err"); return; }
  const ok=await act(btn,async()=>{
    const res=OPEN_KIND==="support"
      ? await db.rpc("support_admin_reply",{p_thread_id:OPEN_KEY,p_body:txt})
      : await db.rpc("admin_send_buyer",{p_thread:String(OPEN_KEY),p_body:txt});
    if(res.error) throw new Error(res.error.message);
  });
  if(ok) render();
}

// ---------- ЕЩЁ: продавцҳо ва товарҳояшон ----------
async function viewMore(){
  const {data,error}=await db.from("products").select("id,title,seller_id,status,owner_email").not("seller_id","is",null);
  if(error) throw error;
  const g={};
  (data||[]).forEach(p=>{
    g[p.seller_id]=g[p.seller_id]||{email:p.owner_email||"—",items:[]};
    if(p.owner_email) g[p.seller_id].email=p.owner_email;
    g[p.seller_id].items.push(p);
  });
  const rows=Object.entries(g).sort((a,b)=>b[1].items.length-a[1].items.length);
  $("#app").innerHTML=`
    <h2>Продавцы</h2>
    <p class="muted">Продавцов: ${rows.length}</p>
    ${rows.map(([id,v])=>`
      <div class="card glass" style="margin:10px 0">
        <div class="ct"><b>${esc(v.email)}</b><span class="cnt">${v.items.length} тов.</span></div>
        <div class="muted" style="margin-top:4px">ID: ${esc(String(id).slice(0,8))}…</div>
        ${v.items.map(p=>`<div class="srow" style="margin:6px 0;padding:10px 12px"><span>${esc(p.title)}</span><b style="font-size:12px">${STATUS_NAME[p.status]||p.status}</b></div>`).join("")}
      </div>`).join("")||'<p class="muted">Продавцов пока нет.</p>'}
    <h3>Уведомления</h3>
    <button class="long glass ${PUSH_ON?"on":""}" onclick="enablePush(this)">${svg("bell",18)} ${PUSH_ON?"Уведомления включены":"Включить уведомления"}</button>
    <h3>Ссылки</h3>
    <a class="long glass" href="../" target="_blank" rel="noopener">🛍 Открыть сайт</a>
    <a class="long glass" href="../support/" target="_blank" rel="noopener">💬 Поддержка</a>
    <button class="long glass" onclick="logout()">Выйти из аккаунта</button>`;
}

boot();
