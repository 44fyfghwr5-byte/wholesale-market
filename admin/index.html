function ago(t){

  if(d<1) return "сегодня";

}

// ---------- ЗВУК И КНОПКИ ----------
let AC=null;
function beep(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.07);
  }catch(e){}
}
document.addEventListener("click",e=>{ if(e.target.closest("button,a,.item,.row2,.tile,.catrow")) beep(); },true);
let TT=null;
function toast(msg,type){
  const t=$("#toast"); if(!t) return;
  t.textContent=msg; t.className="toast show "+(type||"");
  clearTimeout(TT); TT=setTimeout(()=>{ t.className="toast"; },2600);
}
async function act(btn,fn,doneCls){
  if(!btn||btn.disabled) return false;
  const label=btn.dataset.label||btn.textContent.trim();
  btn.dataset.label=label;
  btn.disabled=true; btn.classList.add("busy");
  btn.innerHTML='<span class="spin"></span>...';
  try{
    await fn();
    btn.classList.remove("busy");
    if(doneCls) btn.classList.add(doneCls);
    btn.innerHTML="✓ "+label;
    return true;
  }catch(e){
    btn.classList.remove("busy"); btn.classList.add("fail");
    btn.innerHTML="✕ "+label;
    toast(e.message||"Ошибка","err");
    setTimeout(()=>{ btn.disabled=false; btn.classList.remove("fail"); btn.innerHTML=label; },1500);
    return false;
  }
}

  const inp=$(key==="photos"?"#drop":"#"+key); if(inp) inp.classList.add("bad");
}
function clearErr(){
  document.querySelectorAll(".ferr").forEach(e=>e.textContent="");
  document.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
}
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>"); }

// ---------- ОТПЕЧАТОК И СЖАТИЕ ----------
function loadImg(src){
  return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=()=>rej(new Error("image")); im.src=src; });
}
async function dhash(src){
  const im=await loadImg(src);
  const c=document.createElement("canvas"); c.width=9; c.height=8;
  const x=c.getContext("2d"); x.drawImage(im,0,0,9,8);
  const d=x.getImageData(0,0,9,8).data;
  const g=k=>0.299*d[k]+0.587*d[k+1]+0.114*d[k+2];
  let bits="";
  for(let y=0;y<8;y++) for(let i=0;i<8;i++) bits+=g((y*9+i)*4)>g((y*9+i+1)*4)?"1":"0";
  return BigInt("0b"+bits).toString(16).padStart(16,"0");
}
async function toJpeg(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Не удалось сжать фото")),"image/jpeg",q));
  }finally{ URL.revokeObjectURL(url); }
}

async function init(){
  const {data}=await db.auth.getSession();
  user=data.session?.user||null;
  if(!user) return loginView();
  if(!(await isAdmin())) return location.replace("../");
  start();
}
async function isAdmin(){
  const {data}=await db.from("admins").select("user_id").eq("user_id",user.id);
  return !!(data&&data.length);
}
function loginView(){
  document.body.classList.add("nologin");
  $("#app").innerHTML=`<div class="wrap">
    <div class="hero"><div class="logo"><span>700</span><small>OPTOM · ADMIN</small></div></div>
    <div class="card">
      <input id="em" type="email" placeholder="Email">
      <input id="pw" type="password" placeholder="Пароль">
      <button class="btn" data-label="Войти" onclick="login(this)">Войти</button>
    </div></div>`;
}
async function login(btn){
  await act(btn,async()=>{
    const {data,error}=await db.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error) throw new Error("Неверный email или пароль.");
    user=data.user;
    if(!(await isAdmin())){ location.replace("../"); throw new Error("Нет доступа"); }
  });
  if(user) start();
}

async function start(){
  document.body.classList.remove("nologin");
  try{ await db.rpc("admin_expire_products"); }catch(e){}
  await loadRefs();
  show("home");
  clearInterval(TIMER);
  TIMER=setInterval(tick,20000);
}
function setTab(t){
  TAB=t;
  document.querySelectorAll(".bottom a").forEach(a=>a.classList.toggle("on",a.dataset.t===t));
}
async function show(t){
  window.scrollTo(0,0);
  if(t==="home") return homeView();
  if(t==="cat") return catView(null);
  if(t==="chat") return chatView();
  if(t==="more") return moreView();
}
async function tick(){
  try{
    await loadChats();
    updateBadges();
    if(TAB==="chat"){
      if(OPEN) await loadOpen(false);
      else renderChatList();
    }
    if(TAB==="home") await loadStats();
  }catch(e){}
}
async function loadRefs(){
  const [{data:cats},{data:countries},{data:cities}]=await Promise.all([
    db.from("categories").select("*"),
    db.from("countries").select("*").order("name"),
    db.from("cities").select("*").order("name")
  ]);
  CATS=cats||[]; COUNTRIES=countries||[]; CITIES=cities||[];
}
function sortedChildren(parent){
  return CATS.filter(c=>(c.parent_id??null)===(parent??null))
    .sort((a,b)=>(a.sort_order??0)-(b.sort_order??0)||a.name.localeCompare(b.name));
}
function countryOptions(sel){
  return COUNTRIES.map(k=>`<option value="${k.id}" ${k.id==sel?"selected":""}>${esc(k.name)}</option>`).join("");
}
function cityOptions(countryId,sel){
  return CITIES.filter(c=>!countryId||c.country_id==countryId)
    .map(c=>`<option value="${c.id}" ${c.id==sel?"selected":""}>${esc(c.name)}</option>`).join("");
}
function fCountry(){
  const k=$("#f_k").value;
  $("#f_ci").innerHTML=`<option value="">Город</option>${k?cityOptions(k,null):""}`;
}

async function loadChats(){
  const [{data:msgs,error:e1},{data:pend,error:e2}]=await Promise.all([
    db.from("support_messages").select("conv_key,sender,body,seller_email,created_at").order("created_at"),
    db.from("products").select("id,seller_id,owner_email,title,created_at").eq("status","pending_review").order("created_at")
  ]);
  if(e1||e2) toast((e1||e2).message,"err");
  CHATS=msgs||[]; PENDING=pend||[];
}
function buildGroups(){
  const map={}, sn=seen();
  CHATS.forEach(m=>{
    const g=map[m.conv_key]||(map[m.conv_key]={key:m.conv_key,last:null,email:"",unread:0});
    g.last=m;
    if(m.seller_email) g.email=m.seller_email;
    if(m.sender==="user"){ const s=sn[m.conv_key]; if(!s||new Date(m.created_at)>new Date(s)) g.unread++; }
  });
  return Object.values(map).sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at));
}
function updateBadges(){
  const gs=buildGroups();
  const s=gs.filter(g=>g.key.startsWith("seller:")).reduce((a,g)=>a+g.unread,0);
  const q=gs.filter(g=>!g.key.startsWith("seller:")).reduce((a,g)=>a+g.unread,0);
  const set=(id,n)=>{ const e=$(id); if(e) e.textContent=n||""; };
  set("#bdChat",s+q+PENDING.length);
  set("#pS",s); set("#pQ",q); set("#pR",PENDING.length);
}
function chatView(){
  setTab("chat");
  $("#app").innerHTML=`<div class="wrap">
    <div class="top"><div class="who">Чат</div><button class="btn sm n" onclick="openArchiveSheet()">🗂 Архив</button></div>
    <div class="pills">
      <button class="pill ${CHAN==="seller"?"on":""}" onclick="setChan('seller')">Продавец<b class="bd" id="pS"></b></button>
      <button class="pill ${CHAN==="question"?"on":""}" onclick="setChan('question')">Вопрос<b class="bd" id="pQ"></b></button>
      <button class="pill ${CHAN==="requests"?"on":""}" onclick="setChan('requests')">Заявка<b class="bd" id="pR"></b></button>
    </div>
    <div id="chatlist"><p class="muted">Загрузка...</p></div>
    <div id="chatbox"></div>
  </div>`;
  OPEN=null;
  loadChats().then(()=>renderChatList());
}
function setChan(c){ CHAN=c; chatView(); }
function renderChatList(){
  if(CHAN==="requests") return renderRequests();
  const el=$("#chatlist"); if(!el) return;
  const gs=buildGroups().filter(g=>(CHAN==="seller")===g.key.startsWith("seller:"));
  el.innerHTML=gs.map(g=>`<div class="item" onclick="openChat('${g.key}')">
      <div class="it"><b>${esc(g.email||"Гость")}</b><span class="muted">${g.last?fmt(g.last.created_at):""}</span></div>
      <div class="prev">${g.last?esc(g.last.body||"Фото"):""}</div>
      ${g.unread?`<span class="bd2">${g.unread}</span>`:""}
    </div>`).join("")||'<p class="muted">Здесь пока пусто</p>';
  updateBadges();
}
async function openChat(key){
  OPEN=key;
  const g=buildGroups().find(x=>x.key===key);
  $("#chatbox").innerHTML=`<div class="card">
    <div class="it"><button class="btn sm n" onclick="closeChat()">✕ Закрыть</button><button class="btn sm x" onclick="delChat(this,'${key}')">🗑 Удалить чат</button></div>
    <div class="who" style="margin:8px 0">${esc(g?.email||"Гость")}</div>
    <div class="log" id="log"></div>
    <form class="rform" onsubmit="sendReply(event)">
      <textarea id="rt" placeholder="Ответ..." maxlength="1000"></textarea>
      <button class="btn" id="rbtn" data-label="➤" type="submit">➤</button>
    </form>
  </div>`;
  await loadOpen(true);
  renderChatList();
}
function closeChat(){ OPEN=null; const b=$("#chatbox"); if(b) b.innerHTML=""; renderChatList(); }
async function delChat(btn,key){
  if(!confirm("Удалить этот чат полностью? Восстановить его будет нельзя.")) return;
  const ok=await act(btn,async()=>{
    const {error}=await db.rpc("admin_delete_support",{p_key:key});
    if(error) throw new Error(error.message);
  },"no");
  if(ok){ closeChat(); await loadChats(); updateBadges(); }
}
async function loadOpen(scroll){
  if(!OPEN||!$("#log")) return;
  const {data,error}=await db.from("support_messages").select("id,sender,body,attachment,created_at").eq("conv_key",OPEN).order("created_at");
  const log=$("#log"); if(!log) return;
  if(error){ log.innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  const near=log.scrollHeight-log.scrollTop-log.clientHeight<100;
  log.innerHTML=(data||[]).map(m=>`<div class="msg ${m.sender==="admin"?"a":"b"}">${m.attachment?`<img src="${esc(m.attachment)}">`:""}${m.body&&m.body!=="📷 Фото"?linkify(m.body):""}<div class="who">${fmt(m.created_at)}</div></div>`).join("")
    ||'<p class="muted">Сообщений нет</p>';
  if(scroll||near) log.scrollTop=log.scrollHeight;
  const sn=seen(); sn[OPEN]=new Date().toISOString(); setSeen(sn);
}
async function sendReply(e){
  e.preventDefault();
  const t=$("#rt"), body=t.value.trim(); if(!body) return;
  const btn=$("#rbtn");
  const ok=await act(btn,async()=>{
    const {error}=await db.rpc("support_admin_reply",{p_key:OPEN,p_body:body});
    if(error) throw new Error(error.message);
  },"ok");
  if(ok) t.value="";
  setTimeout(()=>{ btn.disabled=false; btn.classList.remove("ok"); btn.innerHTML="➤"; },600);
  await loadOpen(true);
  await loadChats(); updateBadges();
}

// ---------- ЗАЯВКИ НА ТОВАР ----------
async function renderRequests(){
  const el=$("#chatlist"); if(!el) return;
  const cb=$("#chatbox"); if(cb) cb.innerHTML="";
  const {data,error}=await db.from("products")
    .select("id,title,price,min_order,quality,origin_country,address,seller_phone,seller_email,instagram,payment_comment,receipt_url,draft_photos,created_at,requested_tier,owner_email,cities(name),countries(name),categories(name)")
    .eq("status","pending_review").order("created_at");
  if(!$("#chatlist")) return;
  if(error){ el.innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  if(!(data||[]).length){ el.innerHTML='<p class="muted">Заявок нет</p>'; updateBadges(); return; }
  const rows=await Promise.all(data.map(async p=>{
    let photos=[];
    if(p.draft_photos?.length){
      const {data:ds}=await db.storage.from("product-drafts").createSignedUrls(p.draft_photos,3600);
      photos=(ds||[]).map(d=>d.signedUrl).filter(Boolean);
    }
    let rc="";
    if(p.receipt_url){ const {data:r}=await db.storage.from("receipts").createSignedUrl(p.receipt_url,3600); rc=r?.signedUrl||""; }
    return `<div class="req">
      <div class="rt">${tierName(p.requested_tier)} · ${ago(p.created_at)}</div>
      <div class="rb">${esc(p.title)} · ${p.price} ₽ · мин. ${p.min_order}</div>
      <div class="muted">${esc(p.countries?.name||"")}, ${esc(p.cities?.name||"")} · ${esc(p.categories?.name||"")}</div>
      <div class="muted">${esc(p.seller_email||p.owner_email||"")} · ${esc(p.seller_phone||"—")}</div>
      <div class="muted">Качество: ${esc(p.quality||"—")} · Производство: ${esc(p.origin_country||"—")}</div>
      <div class="muted">Адрес: ${esc(p.address||"—")}</div>
      <div class="note">Перевод: <b>${esc(p.payment_comment||"—")}</b>${rc?` · <a href="${esc(rc)}" target="_blank" rel="noopener" style="color:#fca5a5">чек</a>`:""}</div>
      <div class="gal">${photos.map(u=>`<img src="${esc(u)}">`).join("")}</div>
      <div class="acts">
        <select class="sel" id="tier_${p.id}">${tierOptions(p.requested_tier)}</select>
        <button class="btn sm g" data-label="Опубликовать" onclick="approveReq(this,${p.id})">Опубликовать</button>
        <button class="btn sm x" data-label="Отменить" onclick="rejectReq(this,${p.id})">Отменить</button>
      </div>
    </div>`;
  }));
  el.innerHTML=rows.join("");
  updateBadges();
}
async function publishProduct(id,tier){
  const {data:p,error:e0}=await db.from("products").select("id,draft_photos").eq("id",id).maybeSingle();
  if(e0||!p) throw new Error(e0?.message||"Товар не найден");
  const drafts=p.draft_photos||[];
  if(drafts.length<3) throw new Error("В товаре меньше 3 фото");
  const urls=[]; let hash=null;
  for(const [i,path] of drafts.entries()){
    const {data:blob,error:e1}=await db.storage.from("product-drafts").download(path);
    if(e1||!blob) throw new Error("Фото не найдено");
    if(i===0){ try{ hash=await dhash(URL.createObjectURL(blob)); }catch(e){} }
    const np=`${user.id}/${Date.now()}_${i}.jpg`;
    const {error:e2}=await db.storage.from("product-photos").upload(np,blob,{contentType:blob.type||"image/jpeg"});
    if(e2) throw new Error(e2.message);
    urls.push(db.storage.from("product-photos").getPublicUrl(np).data.publicUrl);
  }
  const now=new Date(); const until=new Date(now);
  until.setMonth(until.getMonth()+(tier>=2?5:3));
  const row={photos:urls,draft_photos:[],status:"published",published_at:now.toISOString(),photos_until:until.toISOString(),fee_paid:true,tier:tier||0};
  if(hash) row.img_hash=hash;
  const {error:e3}=await db.from("products").update(row).eq("id",id);
  if(e3) throw new Error(e3.message);
  await db.storage.from("product-drafts").remove(drafts);
}
async function approveReq(btn,id){
  const tier=+($("#tier_"+id)?.value||0);
  const ok=await act(btn,()=>publishProduct(id,tier),"ok");
  if(ok) setTimeout(async()=>{ await loadChats(); renderRequests(); },600);
}
async function rejectReq(btn,id){
  const ok=await act(btn,async()=>{
    const {error}=await db.from("products").update({status:"rejected"}).eq("id",id);
    if(error) throw new Error(error.message);
  },"no");
  if(ok) setTimeout(async()=>{ await loadChats(); renderRequests(); },600);
}

function openArchiveSheet(){
  openSheet(`<h3>Архив чатов</h3>
    <button class="btn" onclick="closeSheet();archiveView('seller')">🏪 Архив продавцов</button>
    <button class="btn n" onclick="closeSheet();archiveView('buyer')">🛍 Архив покупателей</button>
    <button class="btn n" onclick="closeSheet()">Закрыть</button>`);
}
async function archiveView(side){
  ARCH={side,pid:null,rows:[]};
  setTab("chat");
  $("#app").innerHTML=`<div class="wrap">
    <div class="top"><button class="btn sm n" onclick="chatView()">← Назад</button><div class="who">Архив ${side==="seller"?"продавцов":"покупателей"}</div></div>
    <div id="arch"><p class="muted">Загрузка...</p></div>
  </div>`;
  const {data,error}=await db.rpc("admin_archive_threads");
  if(!$("#arch")) return;
  if(error){ $("#arch").innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  ARCH.rows=data||[];
  archPersons();
}
function archPersons(){
  const el=$("#arch"); if(!el) return;
  ARCH.pid=null;
  const side=ARCH.side, key=side==="seller"?"seller_id":"buyer_id";
  const map={};
  ARCH.rows.forEach(r=>{
    const id=r[key];
    const m=map[id]||(map[id]={id,name:side==="seller"?r.seller_name:r.buyer_name,email:side==="seller"?r.seller_email:r.buyer_email,threads:0,msgs:0,last:null});
    m.threads++; m.msgs+=Number(r.msg_count||0);
    if(!m.last||new Date(r.last_at)>new Date(m.last)) m.last=r.last_at;
  });
  const list=Object.values(map).sort((a,b)=>new Date(b.last||0)-new Date(a.last||0));
  el.innerHTML=list.map(m=>`<div class="item" onclick="archThreads('${m.id}')">
      <div class="it"><b>${esc(m.name||"Без имени")}</b><span class="muted">${m.last?fmt(m.last):""}</span></div>
      <div class="muted">${esc(m.email||"")}</div>
      <div class="muted">Диалогов: ${m.threads} · сообщений: ${m.msgs}</div>
    </div>`).join("")||'<p class="muted">Архив пуст</p>';
}
function archThreads(pid){
  ARCH.pid=pid;
  const key=ARCH.side==="seller"?"seller_id":"buyer_id";
  const list=ARCH.rows.filter(r=>r[key]===pid);
  $("#arch").innerHTML=`<button class="btn sm n" onclick="archPersons()">← К списку</button>
    ${list.map(r=>`<div class="item" onclick="archThread(${r.thread_id})">
      <div class="it"><b>${esc(r.seller_name||"Продавец")} ↔ ${esc(r.buyer_name||"Покупатель")}</b></div>
      <div class="muted">Сообщений: ${r.msg_count} · ${r.last_at?fmt(r.last_at):""}</div>
    </div>`).join("")}`;
}
async function archThread(tid){
  const r=ARCH.rows.find(x=>x.thread_id===tid); if(!r) return;
  const {data,error}=await db.rpc("admin_archive_messages",{p_thread:tid});
  const el=$("#arch"); if(!el) return;
  if(error){ el.innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  el.innerHTML=`<button class="btn sm n" onclick="archThreads('${ARCH.pid}')">← Назад</button>
    <div class="who" style="margin:8px 0">${esc(r.seller_name||"Продавец")} ↔ ${esc(r.buyer_name||"Покупатель")}</div>
    <div class="muted">${esc(r.seller_email||"")} · ${esc(r.buyer_email||"")}</div>
    <div class="log" style="height:50vh">${(data||[]).map(m=>{
      const seller=m.sender_id===r.seller_id;
      return `<div class="msg ${seller?"a":"b"}"><div class="who">${seller?"Продавец":"Покупатель"} · ${fmt(m.created_at)}</div>${m.attachment?`<img src="${esc(m.attachment)}">`:""}${m.body?linkify(m.body):""}</div>`;
    }).join("")||'<p class="muted">Сообщений нет</p>'}</div>
    <div class="acts"><button class="btn sm x" data-label="🗑 Удалить живой чат" onclick="delLiveThread(this,${tid})">🗑 Удалить живой чат</button></div>
    <p class="muted">Копия переписки остаётся в архиве.</p>`;
}
async function delLiveThread(btn,tid){
  if(!confirm("Удалить живой диалог между продавцом и покупателем? Копия останется в архиве.")) return;
  const ok=await act(btn,async()=>{
    const {error}=await db.rpc("admin_delete_thread",{p_thread:tid});
    if(error) throw new Error(error.message);
  },"no");
  if(ok) setTimeout(()=>archiveView(ARCH.side),500);
}

// ---------- КАТАЛОГ (+) ----------
async function catView(parent){
  setTab("cat");
  await loadRefs();
  const current=parent?CATS.find(c=>c.id===parent):null;
  const children=sortedChildren(parent);
  const crumbs=[]; let cur=current;
  while(cur){ crumbs.unshift(cur); cur=CATS.find(c=>c.id===cur.parent_id); }
  const isLeaf=!!current&&!CATS.some(c=>c.parent_id===current.id);
  const head=`<div class="crumbs"><a href="#" onclick="catView(null);return false">Каталог</a>${crumbs.map(c=>` › <a href="#" onclick="catView(${c.id});return false">${esc(c.name)}</a>`).join("")}</div>`;
  let body="";
  if(isLeaf){
    body=`<div class="card"><div class="muted">Товары каталога этой категории</div>
      <button class="btn" onclick="productForm(null,${current.id})">＋ Добавить товар</button>
      <div id="catProducts"><p class="muted">Загрузка...</p></div></div>`;
  } else {
    body=`${children.map((c,i)=>catRow(c,i,children.length)).join("")||'<p class="muted">Здесь пока пусто</p>'}
      <div class="card"><div class="ar"><input id="newcat" placeholder="Название ${current?"подкатегории":"категории"}">
        <button class="btn sm" data-label="＋" onclick="addCat(this,${current?current.id:"null"})">＋</button></div></div>`;
  }
  $("#app").innerHTML=`<div class="wrap"><div class="top"><div class="who">Каталог</div></div>${head}${body}</div>`;
  if(isLeaf) loadCatProducts(current.id);
}
function catRow(c,i,n){
  const img=c.image?`<img src="${esc(c.image)}">`:`<span>${icon(c.name)}</span>`;
  const hasKids=CATS.some(x=>x.parent_id===c.id);
  return `<div class="catrow">
    <div class="ci">${img}</div>
    <div class="cn" onclick="catView(${c.id})"><b>${esc(c.name)}</b><div class="muted">${hasKids?"Есть подкатегории ›":"Раздел для товаров"}</div></div>
    <div class="ctl">
      <button class="s" ${i===0?"disabled":""} onclick="moveCat(${c.id},-1)">▲</button>
      <button class="s" ${i===n-1?"disabled":""} onclick="moveCat(${c.id},1)">▼</button>
      <button class="s" onclick="$('#ci${c.id}').click()">🖼</button>
      <input type="file" id="ci${c.id}" accept="image/*" style="display:none" onchange="catImage(${c.id},this.files[0])">
      <button class="s" onclick="renameCat(${c.id})">✎</button>
      <button class="s no" onclick="delCat(this,${c.id})">🗑</button>
    </div>
  </div>`;
}
async function moveCat(id,dir){
  const c=CATS.find(x=>x.id===id); if(!c) return;
  const sibs=sortedChildren(c.parent_id);
  const i=sibs.findIndex(x=>x.id===id), j=i+dir;
  if(j<0||j>=sibs.length) return;
  const other=sibs[j];
  const r1=await db.from("categories").update({sort_order:j}).eq("id",c.id);
  const r2=await db.from("categories").update({sort_order:i}).eq("id",other.id);
  if(r1.error||r2.error) return toast((r1.error||r2.error).message,"err");
  catView(c.parent_id);
}
async function renameCat(id){
  const c=CATS.find(x=>x.id===id); if(!c) return;
  const name=prompt("Новое название",c.name);
  if(!name||!name.trim()) return;
  const {error}=await db.from("categories").update({name:name.trim()}).eq("id",id);
  if(error) return toast(error.message,"err");
  catView(c.parent_id);
}
async function catImage(id,file){
  if(!file) return;
  try{
    const c=CATS.find(x=>x.id===id);
    const blob=await toJpeg(file,800,0.85);
    const path=`cat_${id}_${Date.now()}.jpg`;
    const {error}=await db.storage.from("category-images").upload(path,blob,{contentType:"image/jpeg"});
    if(error) throw new Error(error.message);
    const url=db.storage.from("category-images").getPublicUrl(path).data.publicUrl;
    const {error:e2}=await db.from("categories").update({image:url}).eq("id",id);
    if(e2) throw new Error(e2.message);
    toast("Фото категории сохранено","ok");
    catView(c?c.parent_id:null);
  }catch(err){ toast("Ошибка: "+err.message,"err"); }
}
async function addCat(btn,parent){
  const name=($("#newcat").value||"").trim();
  if(!name){ toast("Введите название","err"); return; }
  const sibs=sortedChildren(parent);
  const next=sibs.length?Math.max(...sibs.map(s=>s.sort_order??0))+1:0;
  await act(btn,async()=>{
    const {error}=await db.from("categories").insert({name,parent_id:parent,sort_order:next});
    if(error) throw new Error(error.message);
  },"ok");
  catView(parent);
}
async function delCat(btn,id){
  const c=CATS.find(x=>x.id===id);
  if(!confirm("Удалить категорию вместе с вложенными?")) return;
  await act(btn,async()=>{
    const {error}=await db.from("categories").delete().eq("id",id);
    if(error) throw new Error(error.message);
  },"no");
  catView(c?c.parent_id:null);
}
async function loadCatProducts(catId){
  const {data}=await db.from("products").select("id,title,price,min_order,photos,tier")
    .is("seller_id",null).eq("category_id",catId).order("created_at",{ascending:false});
  const el=$("#catProducts"); if(!el) return;
  el.innerHTML=(data||[]).map(p=>`<div class="prod">
      <div class="prow"><img src="${esc(p.photos?.[0]||"")}"><div class="pinfo"><b>${esc(p.title)}</b><div class="muted">${p.price} ₽ · мин. ${p.min_order}</div></div></div>
      <div class="acts">
        <select class="sel" onchange="setTierSel(this,${p.id})">${tierOptions(p.tier)}</select>
        <button class="btn sm n" onclick="productForm(${p.id},null)">✎ Изменить</button>
        <button class="btn sm x" onclick="delCatalog(this,${p.id},${catId})">🗑</button>
      </div>
    </div>`).join("")||'<p class="muted">Товаров пока нет</p>';
}
async function delCatalog(btn,id,catId){
  if(!confirm("Удалить товар из каталога?")) return;
  await act(btn,async()=>{
    const {error}=await db.from("products").delete().eq("id",id);
    if(error) throw new Error(error.message);
  },"no");
  loadCatProducts(catId);
}

// ---------- ФОРМА ТОВАРА КАТАЛОГА ----------
async function productForm(id,catId){
  await loadRefs();
  PHOTOS=[];
  let p={};
  if(id){
    const {data}=await db.from("products").select("*").eq("id",id).maybeSingle();
    if(!data){ toast("Товар не найден","err"); return; }
    p=data; catId=p.category_id;
  }
  const cat=CATS.find(c=>c.id===catId);
  $("#app").innerHTML=`<div class="wrap">
    <div class="crumbs"><a href="#" onclick="catView(${cat?cat.id:"null"});return false">← назад</a></div>
    <h2 style="font-size:17px;margin:4px 0 6px">${id?"Изменить товар":"Новый товар в каталоге"}</h2>
    <div class="pill-s">Категория: <b>${esc(cat?.name||"—")}</b></div>
    <div class="card">
      <div class="drop" id="drop">
        <label class="addph">＋ Фото (от 1 до 6)<input type="file" accept="image/*" multiple onchange="addPhotos(this)" style="display:none"></label>
        <div class="thumbs" id="thumbs"></div>
        ${id?'<p class="muted" style="margin:6px 0 0">Новые фото заменят старые.</p>':""}
      </div>
      <div class="ferr" data-for="photos"></div>
    </div>
    <div class="card">
      <input id="f_t" placeholder="Название" value="${esc(p.title)}" oninput="clearErr()">
      <div class="ferr" data-for="f_t"></div>
      <textarea id="f_d" rows="3" placeholder="Описание">${esc(p.description)}</textarea>
      <select id="f_k" onchange="fCountry()"><option value="">Страна продажи</option>${countryOptions(p.country_id)}</select>
      <div class="ferr" data-for="f_k"></div>
      <select id="f_ci"><option value="">Город</option>${p.country_id?cityOptions(p.country_id,p.city_id):""}</select>
      <div class="ferr" data-for="f_ci"></div>
      <input id="f_p" type="number" placeholder="Цена за штуку, ₽" value="${p.price??""}">
      <div class="ferr" data-for="f_p"></div>
      <input id="f_m" type="number" placeholder="Минимальный заказ, шт" value="${p.min_order??""}">
      <div class="ferr" data-for="f_m"></div>
      <select id="f_tier">${tierOptions(p.tier)}</select>
      <input id="f_q" placeholder="Качество" value="${esc(p.quality)}">
      <input id="f_o" placeholder="Страна производства" value="${esc(p.origin_country)}">
      <input id="f_a" placeholder="Адрес" value="${esc(p.address)}">
      <input id="f_ph" type="tel" placeholder="Телефон" value="${esc(p.seller_phone)}">
      <input id="f_em" type="email" placeholder="Email" value="${esc(p.seller_email)}">
      <input id="f_ig" placeholder="Instagram (необязательно)" value="${esc(p.instagram)}">
    </div>
    <button class="btn" data-label="${id?"Сохранить":"Добавить в каталог"}" onclick="saveCatalog(this,${id?id:"null"},${catId})">${id?"Сохранить":"Добавить в каталог"}</button>
  </div>`;
  renderThumbs();
}
function addPhotos(el){
  const arr=[...el.files]; el.value="";
  const room=6-PHOTOS.length;
  if(room<=0){ toast("Максимум 6 фото","err"); return; }
  PHOTOS=PHOTOS.concat(arr.slice(0,room));
  renderThumbs();
  const e=document.querySelector('.ferr[data-for="photos"]'); if(e) e.textContent="";
  const d=$("#drop"); if(d) d.classList.remove("bad");
}
function removePhoto(i){ PHOTOS.splice(i,1); renderThumbs(); }
function renderThumbs(){
  const box=$("#thumbs"); if(!box) return;
  box.innerHTML=PHOTOS.map((f,i)=>`<div class="th"><img src="${URL.createObjectURL(f)}"><button class="x" onclick="removePhoto(${i})">×</button>${i===0?'<span class="cv">Главное</span>':""}</div>`).join("");
}
async function saveCatalog(btn,id,catId){
  const v=k=>($("#"+k)?.value??"").trim();
  clearErr();
  const price=+v("f_p"), min=+v("f_m"), country=+$("#f_k").value, city=+$("#f_ci").value, title=v("f_t");
  let ok=true;
  if(!title){ ferr("f_t","Введите название"); ok=false; }
  if(!country){ ferr("f_k","Выберите страну"); ok=false; }
  if(!city){ ferr("f_ci","Выберите город"); ok=false; }
  if(!(price>0)){ ferr("f_p","Укажите цену"); ok=false; }
  if(!(min>0)){ ferr("f_m","Укажите минимальный заказ"); ok=false; }
  if(!id&&(PHOTOS.length<1||PHOTOS.length>6)){ ferr("photos","Добавьте от 1 до 6 фото"); ok=false; }
  if(id&&PHOTOS.length>6){ ferr("photos","Не больше 6 фото"); ok=false; }
  if(!ok){ toast("Заполните отмеченные шаги","err"); return; }
  await act(btn,async()=>{
    const row={title,description:v("f_d")||null,category_id:catId,country_id:country,city_id:city,price,min_order:min,
      tier:+($("#f_tier")?.value||0),
      quality:v("f_q")||null,origin_country:v("f_o")||null,address:v("f_a")||null,
      seller_phone:v("f_ph")||null,seller_email:v("f_em")||null,instagram:v("f_ig")||null};
    if(PHOTOS.length){
      const photos=[]; let hash=null;
      for(let i=0;i<PHOTOS.length;i++){
        const blob=await toJpeg(PHOTOS[i],1200,0.82);
        const path=`${user.id}/cat_${Date.now()}_${i}.jpg`;
        const {error}=await db.storage.from("product-photos").upload(path,blob,{contentType:"image/jpeg"});
        if(error) throw new Error(error.message);
        photos.push(db.storage.from("product-photos").getPublicUrl(path).data.publicUrl);
        if(i===0){ try{ hash=await dhash(URL.createObjectURL(blob)); }catch(e){} }
      }
      row.photos=photos; if(hash) row.img_hash=hash;
    }
    if(id){
      const {error}=await db.from("products").update(row).eq("id",id);
      if(error) throw new Error(error.message);
    } else {
      row.seller_id=null; row.status="published";
      row.published_at=new Date().toISOString();
      row.photos_until="2099-12-31T00:00:00Z";
      const {error}=await db.from("products").insert(row);
      if(error) throw new Error(error.message);
    }
  },"ok");
  setTimeout(()=>catView(catId),500);
}

// ---------- ЕЩЁ: СТРАНЫ И ГОРОДА ----------
async function moreView(){
  setTab("more");
  await loadRefs();
  $("#app").innerHTML=`<div class="wrap">
    <div class="top"><div class="who">Ещё</div></div>
    <button class="btn" onclick="productsSellersView()">📦 Товары по сохибкорон ›</button>
    <h3>Страны</h3>
    <div class="card"><div class="ar"><input id="kn" placeholder="Новая страна"><button class="btn sm" data-label="＋" onclick="addCountry(this)">＋</button></div></div>
    ${COUNTRIES.map(k=>`<div class="row2"><div class="cn"><b>${esc(k.name)}</b></div>
      <div class="ctl"><button class="s" onclick="editCountry(${k.id})">✎</button><button class="s no" onclick="delCountry(this,${k.id})">🗑</button></div></div>`).join("")}
    <h3>Города</h3>
    <div class="card">
      <select id="cc"><option value="">— страна —</option>${countryOptions(null)}</select>
      <div class="ar"><input id="ctn" placeholder="Новый город"><button class="btn sm" data-label="＋" onclick="addCity(this)">＋</button></div>
    </div>
    ${CITIES.map(c=>`<div class="row2"><div class="cn"><b>${esc(c.name)}</b><div class="muted">${esc(COUNTRIES.find(k=>k.id===c.country_id)?.name||"")}</div></div>
      <div class="ctl"><button class="s" onclick="editCity(${c.id})">✎</button><button class="s no" onclick="delCity(this,${c.id})">🗑</button></div></div>`).join("")}
    <button class="btn n" onclick="logout()" style="margin-top:14px">Выйти из аккаунта</button>
  </div>`;
}
async function addCountry(btn){
  const name=($("#kn").value||"").trim(); if(!name){ toast("Введите название","err"); return; }
  await act(btn,async()=>{ const {error}=await db.from("countries").insert({name}); if(error) throw new Error(error.message); },"ok");
  moreView();
}
async function editCountry(id){
  const k=COUNTRIES.find(x=>x.id===id);
  const name=prompt("Новое название страны",k?k.name:""); if(!name||!name.trim()) return;
  const {error}=await db.from("countries").update({name:name.trim()}).eq("id",id);
  if(error) return toast(error.message,"err");
  moreView();
}
async function delCountry(btn,id){
  if(!confirm("Удалить страну? Это невозможно, если в ней есть города или товары.")) return;
  await act(btn,async()=>{ const {error}=await db.from("countries").delete().eq("id",id); if(error) throw new Error(error.message); },"no");
  moreView();
}
async function addCity(btn){
  const name=($("#ctn").value||"").trim(), cid=+$("#cc").value;
  if(!name||!cid){ toast("Выберите страну и введите город","err"); return; }
  await act(btn,async()=>{ const {error}=await db.from("cities").insert({name,country_id:cid}); if(error) throw new Error(error.message); },"ok");
  moreView();
}
async function editCity(id){
  const c=CITIES.find(x=>x.id===id);
  const name=prompt("Новое название города",c?c.name:""); if(!name||!name.trim()) return;
  const {error}=await db.from("cities").update({name:name.trim()}).eq("id",id);
  if(error) return toast(error.message,"err");
  moreView();
}
async function delCity(btn,id){
  if(!confirm("Удалить город?")) return;
  await act(btn,async()=>{ const {error}=await db.from("cities").delete().eq("id",id); if(error) throw new Error(error.message); },"no");
  moreView();
}

init();
</script>
