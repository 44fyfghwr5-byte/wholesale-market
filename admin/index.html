function ago(t){
  const d=Math.floor((Date.now()-new Date(t))/DAY);
  if(d<1) return "сегодня";
  if(d<7) return d+" дн. назад";
  if(d<30) return Math.floor(d/7)+" нед. назад";
  if(d<365) return Math.floor(d/30)+" мес. назад";

// ---------- ЗВУК ----------
let AC=null;
function beep(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.07);
  }catch(e){}
}
document.addEventListener("click",e=>{ if(e.target.closest("button,a,.item,.cn,.pill")) beep(); },true);

// ---------- УВЕДОМЛЕНИЯ И КНОПКИ ----------
let TT=null;
function toast(msg,type){
  const t=$("#toast"); if(!t) return;
  t.textContent=msg; t.className="toast show "+(type||"");
  clearTimeout(TT); TT=setTimeout(()=>{ t.className="toast"; },2800);
}
async function act(btn,fn,doneCls){
  if(!btn||btn.disabled) return false;
  const label=btn.dataset.label||btn.textContent.trim();
  btn.dataset.label=label;
  btn.disabled=true; btn.classList.add("busy");
  btn.innerHTML='<span class="spin"></span>Загрузка...';
  try{
    await fn();
    btn.classList.remove("busy");
    if(doneCls) btn.classList.add(doneCls);
    btn.innerHTML="✓ "+label;
    return true;
  }catch(e){
    btn.classList.remove("busy"); btn.classList.add("fail");
    btn.innerHTML="✕ "+label;
    toast(e.message||"Ошибка","err");
    setTimeout(()=>{ btn.disabled=false; btn.classList.remove("fail"); btn.innerHTML=label; },1600);
    return false;
  }
}
function ferr(key,msg){

  const inp=$(key==="photos"?"#drop":"#"+key); if(inp) inp.classList.add("bad");
}

// ---------- ОТПЕЧАТОК И СЖАТИЕ ----------
function loadImg(src){
  return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=()=>rej(new Error("image")); im.src=src; });
}
async function dhash(src){
  const im=await loadImg(src);
  const c=document.createElement("canvas"); c.width=9; c.height=8;
  const x=c.getContext("2d"); x.drawImage(im,0,0,9,8);
  const d=x.getImageData(0,0,9,8).data;
  const g=k=>0.299*d[k]+0.587*d[k+1]+0.114*d[k+2];
  let bits="";
  for(let y=0;y<8;y++) for(let i=0;i<8;i++) bits+=g((y*9+i)*4)>g((y*9+i+1)*4)?"1":"0";
  return BigInt("0b"+bits).toString(16).padStart(16,"0");
}
async function toJpeg(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Не удалось сжать фото")),"image/jpeg",q));
  }finally{ URL.revokeObjectURL(url); }
}

  start();
}
async function isAdmin(){
  const {data}=await db.from("admins").select("user_id").eq("user_id",user.id);
  return !!(data&&data.length);
}
function loginView(){
  document.body.classList.add("nologin");

      <input id="pw" type="password" placeholder="Пароль">
      <button class="btn" data-label="Войти" onclick="login(this)">Войти</button>
    </div></div>`;
}
async function login(btn){
  await act(btn,async()=>{
    const {data,error}=await db.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error) throw new Error("Неверный email или пароль.");
    user=data.user;
    if(!(await isAdmin())){ location.replace("../"); throw new Error("Нет доступа"); }
  });
  if(user) start();
}
async function logout(){

function sortedChildren(parent){

async function loadChats(){
  const [{data:msgs,error:e1},{data:pend,error:e2}]=await Promise.all([
    db.from("support_messages").select("conv_key,sender,body,seller_email,created_at").order("created_at"),
    db.from("products").select("id,seller_id,owner_email,title,created_at").eq("status","pending_review").order("created_at")
  ]);
  if(e1||e2) toast((e1||e2).message,"err");
  CHATS=msgs||[]; PENDING_LIST=pend||[];
}
function buildGroups(){
  const map={}, sn=seen();
  CHATS.forEach(m=>{
    const g=map[m.conv_key]||(map[m.conv_key]={key:m.conv_key,last:null,email:"",unread:0,pending:0});
    g.last=m;
    if(m.seller_email) g.email=m.seller_email;
    if(m.sender==="user"){ const s=sn[m.conv_key]; if(!s||new Date(m.created_at)>new Date(s)) g.unread++; }
  });
  PENDING_LIST.forEach(p=>{
    const key="seller:"+p.seller_id;
    const g=map[key]||(map[key]={key,last:null,email:"",unread:0,pending:0});
    g.pending++;
    if(!g.email) g.email=p.owner_email||"";
    if(!g.last) g.last={created_at:p.created_at,body:"Запрос: добавить товар «"+p.title+"»",sender:"system"};
  });
  return Object.values(map).sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at));
}
function counts(){
  const gs=buildGroups();
  return {
    s:gs.filter(g=>g.key.startsWith("seller:")).reduce((a,g)=>a+g.unread+g.pending,0),
    q:gs.filter(g=>!g.key.startsWith("seller:")).reduce((a,g)=>a+g.unread,0)
  };
}
function updateBadges(){
  COUNTS=counts();
  const set=(id,n)=>{ const e=$(id); if(e) e.textContent=n||""; };
  set("#bdChat",COUNTS.s+COUNTS.q);
  set("#pS",COUNTS.s); set("#pQ",COUNTS.q);
}

async function publishProduct(id,tier){
  const {data:p,error:e0}=await db.from("products").select("id,draft_photos").eq("id",id).maybeSingle();
  if(e0||!p) throw new Error(e0?.message||"Товар не найден");
  const drafts=p.draft_photos||[];
  if(drafts.length<3) throw new Error("В товаре меньше 3 фото");
  const urls=[]; let hash=null;
  for(const [i,path] of drafts.entries()){
    const {data:blob,error:e1}=await db.storage.from("product-drafts").download(path);
    if(e1||!blob) throw new Error("Фото не найдено");
    if(i===0){ try{ hash=await dhash(URL.createObjectURL(blob)); }catch(e){} }
    const np=`${user.id}/${Date.now()}_${i}.jpg`;
    const {error:e2}=await db.storage.from("product-photos").upload(np,blob,{contentType:blob.type||"image/jpeg"});
    if(e2) throw new Error(e2.message);
    urls.push(db.storage.from("product-photos").getPublicUrl(np).data.publicUrl);
  }
  const now=new Date(); const until=new Date(now); until.setMonth(until.getMonth()+PHOTO_MONTHS);
  const row={photos:urls,draft_photos:[],status:"published",published_at:now.toISOString(),photos_until:until.toISOString(),fee_paid:true,tier:tier||0};
  if(hash) row.img_hash=hash;
  const {error:e3}=await db.from("products").update(row).eq("id",id);
  if(e3) throw new Error(e3.message);
  await db.storage.from("product-drafts").remove(drafts);
}

}

function catRow(c,i,n){
  const img=c.image?`<img src="${esc(c.image)}">`:`<span>${icon(c.name)}</span>`;
  const hasKids=CATS.some(x=>x.parent_id===c.id);
  return `<div class="row2">
    <div class="ci">${img}</div>
    <div class="cn" onclick="catView(${c.id})"><b>${esc(c.name)}</b><div class="muted">${hasKids?"Есть подкатегории ›":"Раздел для товаров"}</div></div>
    <div class="ctl">
      <button class="s" ${i===0?"disabled":""} onclick="moveCat(${c.id},-1)">▲</button>
      <button class="s" ${i===n-1?"disabled":""} onclick="moveCat(${c.id},1)">▼</button>
      <button class="s" onclick="$('#ci${c.id}').click()">🖼</button>
      <input type="file" id="ci${c.id}" accept="image/*" style="display:none" onchange="catImage(${c.id},this.files[0])">
      <button class="s" onclick="renameCat(${c.id})">✎</button>
      <button class="s no" onclick="delCat(this,${c.id})">🗑</button>
    </div>
  </div>`;
}
async function moveCat(id,dir){
  const c=CATS.find(x=>x.id===id); if(!c) return;
  const sibs=sortedChildren(c.parent_id);
  const i=sibs.findIndex(x=>x.id===id), j=i+dir;
  if(j<0||j>=sibs.length) return;
  const other=sibs[j];
  const r1=await db.from("categories").update({sort_order:j}).eq("id",c.id);
  const r2=await db.from("categories").update({sort_order:i}).eq("id",other.id);
  if(r1.error||r2.error) return toast((r1.error||r2.error).message,"err");
  catView(c.parent_id);
}
async function renameCat(id){
  const c=CATS.find(x=>x.id===id); if(!c) return;
  const name=prompt("Новое название",c.name);
  if(!name||!name.trim()) return;
  const {error}=await db.from("categories").update({name:name.trim()}).eq("id",id);
  if(error) return toast(error.message,"err");
  catView(c.parent_id);
}
async function catImage(id,file){
  if(!file) return;
  try{
    const c=CATS.find(x=>x.id===id);
    const blob=await toJpeg(file,800,0.85);
    const path=`cat_${id}_${Date.now()}.jpg`;
    const {error}=await db.storage.from("category-images").upload(path,blob,{contentType:"image/jpeg"});
    if(error) throw new Error(error.message);
    const url=db.storage.from("category-images").getPublicUrl(path).data.publicUrl;
    const {error:e2}=await db.from("categories").update({image:url}).eq("id",id);
    if(e2) throw new Error(e2.message);
    toast("Фото категории сохранено","ok");
    catView(c?c.parent_id:null);
  }catch(err){ toast("Ошибка: "+err.message,"err"); }
}
async function addCat(btn,parent){
  const name=($("#newcat").value||"").trim();
  if(!name){ toast("Введите название","err"); return; }
  const sibs=sortedChildren(parent);
  const next=sibs.length?Math.max(...sibs.map(s=>s.sort_order??0))+1:0;
  await act(btn,async()=>{
    const {error}=await db.from("categories").insert({name,parent_id:parent,sort_order:next});

  },"ok");
  catView(parent);
}

  const room=6-PHOTOS.length;
  if(room<=0){ toast("Максимум 6 фото","err"); return; }
  PHOTOS=PHOTOS.concat(arr.slice(0,room));
  renderThumbs();
  const e=document.querySelector('.ferr[data-for="photos"]'); if(e) e.textContent="";
  const d=$("#drop"); if(d) d.classList.remove("bad");
}
function removePhoto(i){ PHOTOS.splice(i,1); renderThumbs(); }
function renderThumbs(){
  const box=$("#thumbs"); if(!box) return;
  box.innerHTML=PHOTOS.map((f,i)=>`<div class="th"><img src="${URL.createObjectURL(f)}"><button class="x" onclick="removePhoto(${i})">×</button>${i===0?'<span class="cv">Главное</span>':""}</div>`).join("");
}
async function saveCatalog(btn,id,catId){
  const v=k=>($("#"+k)?.value??"").trim();
  clearErr();
  const price=+v("f_p"), min=+v("f_m"), country=+$("#f_k").value, city=+$("#f_ci").value, title=v("f_t");
  let ok=true;
  if(!title){ ferr("f_t","Введите название"); ok=false; }
  if(!country){ ferr("f_k","Выберите страну"); ok=false; }
  if(!city){ ferr("f_ci","Выберите город"); ok=false; }
  if(!(price>0)){ ferr("f_p","Укажите цену"); ok=false; }
  if(!(min>0)){ ferr("f_m","Укажите минимальный заказ"); ok=false; }
  if(!id&&(PHOTOS.length<1||PHOTOS.length>6)){ ferr("photos","Добавьте от 1 до 6 фото"); ok=false; }
  if(id&&PHOTOS.length>6){ ferr("photos","Не больше 6 фото"); ok=false; }
  if(!ok){ toast("Заполните отмеченные шаги","err"); return; }
  await act(btn,async()=>{
    const row={title,description:v("f_d")||null,category_id:catId,country_id:country,city_id:city,price,min_order:min,
      tier:+($("#f_tier")?.value||0),
      quality:v("f_q")||null,origin_country:v("f_o")||null,address:v("f_a")||null,
      seller_phone:v("f_ph")||null,seller_email:v("f_em")||null,instagram:v("f_ig")||null};
    if(PHOTOS.length){
      const photos=[]; let hash=null;
      for(let i=0;i<PHOTOS.length;i++){
        const blob=await toJpeg(PHOTOS[i],1200,0.82);
        const path=`${user.id}/cat_${Date.now()}_${i}.jpg`;
        const {error}=await db.storage.from("product-photos").upload(path,blob,{contentType:"image/jpeg"});
        if(error) throw new Error(error.message);
        photos.push(db.storage.from("product-photos").getPublicUrl(path).data.publicUrl);
        if(i===0){ try{ hash=await dhash(URL.createObjectURL(blob)); }catch(e){} }
      }
      row.photos=photos; if(hash) row.img_hash=hash;
    }
    if(id){
      const {error}=await db.from("products").update(row).eq("id",id);
      if(error) throw new Error(error.message);
    } else {
      row.seller_id=null; row.status="published";
      row.published_at=new Date().toISOString();
      row.photos_until="2099-12-31T00:00:00Z";
      const {error}=await db.from("products").insert(row);
      if(error) throw new Error(error.message);
    }
  },"ok");
  setTimeout(()=>catView(catId),600);
}

// ---------- ЕЩЁ: ПРОДВИЖЕНИЕ, СТРАНЫ, ГОРОДА ----------
async function moreView(){
  setTab("more");
  await loadRefs();
  $("#app").innerHTML=`<div class="wrap">
    <div class="top"><div class="who">Ещё</div></div>
    <h3>Продвижение товаров</h3>
    <div class="card">
      <input id="ps" placeholder="Поиск товара по названию" oninput="loadPromo()">
      <p class="muted">VIP+ показывается первым, затем TOP+, TOP и обычные товары. Внутри уровня порядок меняется при каждом открытии сайта.</p>
    </div>
    <div id="promo"><p class="muted">Загрузка...</p></div>
    <h3>Страны</h3>
    <div class="card"><input id="kn" placeholder="Название страны">
      <button class="btn" data-label="＋ Добавить страну" onclick="addCountry(this)">＋ Добавить страну</button></div>
    ${COUNTRIES.map(k=>`<div class="row2"><div class="cn"><b>${esc(k.name)}</b></div>
      <div class="ctl"><button class="s" onclick="editCountry(${k.id})">✎</button><button class="s no" onclick="delCountry(this,${k.id})">🗑</button></div></div>`).join("")}
    <h3>Города</h3>
    <div class="card"><select id="cc"><option value="">— страна —</option>${countryOptions(null)}</select>
      <input id="ctn" placeholder="Название города">
      <button class="btn" data-label="＋ Добавить город" onclick="addCity(this)">＋ Добавить город</button></div>
    ${CITIES.map(c=>`<div class="row2"><div class="cn"><b>${esc(c.name)}</b><div class="muted">${esc(COUNTRIES.find(k=>k.id===c.country_id)?.name||"")}</div></div>
      <div class="ctl"><button class="s" onclick="editCity(${c.id})">✎</button><button class="s no" onclick="delCity(this,${c.id})">🗑</button></div></div>`).join("")}
    <button class="btn n" onclick="logout()">Выйти из аккаунта</button>
  </div>`;
  loadPromo();
}
async function loadPromo(){
  const q=($("#ps")?.value||"").trim().replace(/[%_\\]/g,"");
  let req=db.from("products").select("id,title,price,tier,photos,seller_id")
    .eq("status","published").gt("photos_until",new Date().toISOString())
    .order("tier",{ascending:false}).limit(60);
  if(q) req=req.ilike("title","%"+q+"%");
  const {data,error}=await req;
  const el=$("#promo"); if(!el) return;
  if(error){ el.innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  el.innerHTML=(data||[]).map(p=>`<div class="prow2">
      <img src="${esc(p.photos?.[0]||"")}">
      <div class="pinfo"><b>${esc(p.title)}</b>
        <div class="muted">${p.price} ₽ · ${p.seller_id?"продавец":"каталог"}</div>
        ${tierBtns(p.id,p.tier||0,"setTier")}
      </div>
    </div>`).join("")||'<p class="muted">Товаров нет</p>';
}
async function setTier(btn,id,tier){
  await act(btn,async()=>{
    const {error}=await db.rpc("admin_set_tier",{p_id:id,p_tier:tier});
    if(error) throw new Error(error.message);
  },"ok");
  setTimeout(()=>loadPromo(),600);
}
async function addCountry(btn){
  const name=($("#kn").value||"").trim(); if(!name){ toast("Введите название","err"); return; }
  await act(btn,async()=>{ const {error}=await db.from("countries").insert({name}); if(error) throw new Error(error.message); },"ok");
  moreView();
}
async function editCountry(id){
  const k=COUNTRIES.find(x=>x.id===id);
  const name=prompt("Новое название страны",k?k.name:""); if(!name||!name.trim()) return;
  const {error}=await db.from("countries").update({name:name.trim()}).eq("id",id);
  if(error) return toast(error.message,"err");
  moreView();
}
async function delCountry(btn,id){
  if(!confirm("Удалить страну? Это невозможно, если в ней есть города или товары.")) return;
  await act(btn,async()=>{ const {error}=await db.from("countries").delete().eq("id",id); if(error) throw new Error(error.message); },"no");
  moreView();
}
async function addCity(btn){
  const name=($("#ctn").value||"").trim(), cid=+$("#cc").value;
  if(!name||!cid){ toast("Выберите страну и введите город","err"); return; }
  await act(btn,async()=>{ const {error}=await db.from("cities").insert({name,country_id:cid}); if(error) throw new Error(error.message); },"ok");
  moreView();
}
async function editCity(id){
  const c=CITIES.find(x=>x.id===id);
  const name=prompt("Новое название города",c?c.name:""); if(!name||!name.trim()) return;
  const {error}=await db.from("cities").update({name:name.trim()}).eq("id",id);
  if(error) return toast(error.message,"err");
  moreView();
}
async function delCity(btn,id){
  if(!confirm("Удалить город?")) return;
  await act(btn,async()=>{ const {error}=await db.from("cities").delete().eq("id",id); if(error) throw new Error(error.message); },"no");
  moreView();
}

init();
</script>
