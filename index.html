<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://fwvvnzrprjffsmkpvhrl.supabase.co; base-uri 'self'; form-action 'self'">
<title>700 OPTOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--r:#dc2626;--r2:#ef4444;--rd:#7f1d1d;--k:#0a0a0a;--card:#141414;--card2:#1c1c1c;--line:#2a2a2a;--t:#f5f5f5;--m:#a3a3a3;--ok:#16a34a;--gold:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--k);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding-bottom:86px}
body.intro-on{overflow:hidden}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:24px;letter-spacing:-1px;line-height:.95;cursor:pointer;display:inline-block}
.logo small{display:block;font-family:Inter,sans-serif;font-size:9px;letter-spacing:4px;color:var(--m);font-weight:700}
.logo.tap{animation:logoGo .56s cubic-bezier(.5,0,.8,.4) forwards}
.logo.back{animation:logoBack .5s cubic-bezier(.2,.8,.2,1)}
@keyframes logoGo{0%{transform:none;opacity:1}35%{transform:scale(1.35) rotate(-10deg);filter:drop-shadow(0 0 16px #ef4444);color:#ef4444}100%{transform:translate(-40px,-30px) scale(.4) rotate(-40deg);opacity:0}}
@keyframes logoBack{from{opacity:0;transform:translateY(-14px) scale(.7)}to{opacity:1;transform:none}}
.tr{display:flex;gap:8px}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:19px;display:flex;align-items:center;justify-content:center;color:var(--t);cursor:pointer;padding:0;flex:0 0 44px;text-decoration:none}
.ibtn.plus{background:linear-gradient(135deg,var(--r),var(--rd));border:0;color:#fff;font-size:24px;font-weight:900;box-shadow:0 6px 16px #dc262655}
.ibtn.sm{width:38px;height:38px;flex:0 0 38px;font-size:16px}
main{max-width:620px;margin:0 auto;padding:14px 14px 20px;animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:200% center}}
@keyframes shineBtn{to{background-position:200% center}}
.hero{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:46px;letter-spacing:-2px;line-height:1;margin:8px 0 14px;background:linear-gradient(90deg,#fff,#fca5a5,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.hero small{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:6px;color:var(--m);font-weight:700;-webkit-text-fill-color:var(--m)}
.sbig{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:8px 8px 8px 18px;box-shadow:0 10px 30px #dc26261a;transition:border-color .2s}
.sbig:focus-within{border-color:var(--r)}
.sbig input{flex:1;background:none;border:0;color:var(--t);font-size:18px;font-family:inherit;padding:12px 0;margin:0;outline:none;min-width:0}
.sbig input::placeholder{color:#7a7a7a}
.sph{flex:1;color:var(--m);font-size:18px;padding:12px 0;cursor:pointer}
.fbtn{position:relative;flex:0 0 46px;width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--card2);color:var(--t);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.fbtn.on{border-color:var(--r);background:var(--rd);color:#fff}
.fbtn.on:after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--r2)}
.cam{flex:0 0 auto;width:50px;height:50px;border-radius:18px;background:linear-gradient(135deg,var(--r),var(--rd));border:0;font-size:23px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px #dc262666;padding:0}
.sellercta{display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,var(--r),var(--rd) 60%,#000);color:#fff;text-decoration:none;box-shadow:0 10px 26px #dc262640}
.sc-ico{font-size:26px}
.sc-txt{flex:1;display:flex;flex-direction:column;gap:2px}
.sc-txt b{font-size:16px;font-weight:900}
.sc-txt small{font-size:12px;opacity:.9}
.sc-arr{font-size:26px;font-weight:700}
.reg{width:100%;text-align:left;background:linear-gradient(135deg,#1c0a0a,var(--card));border:1px solid var(--rd);border-radius:18px;padding:14px 16px;margin:12px 0 0;color:var(--t);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:3px}
.reg b{font-size:16px}
.reg span{font-size:13px;color:var(--m)}
.fpanel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 14px 14px;margin:12px 0;animation:fi .25s ease}
.fpanel h3{margin:14px 0 2px}
.prow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prow2 .btn{margin:10px 0 0}
.fsorts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
.fsort{background:var(--card2);border:1px solid var(--line);color:var(--m);border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.fsort.on{background:var(--r);border-color:var(--r);color:#fff}
.fchip{display:flex;justify-content:space-between;align-items:center;background:#1c0a0a;border:1px solid var(--rd);border-radius:14px;padding:9px 12px;margin:10px 0;font-size:13px;color:#fecaca}
.fchip button{background:none;border:0;color:var(--r2);font-weight:800;cursor:pointer;font-family:inherit}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.hh{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--m);font-weight:700}
.chip{display:inline-flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-size:13px}
.chip span{cursor:pointer}
.chip button{background:none;border:0;color:var(--m);font-size:16px;cursor:pointer;padding:0 6px}
h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--m);margin:18px 0 8px}
h2{font-size:22px;font-weight:900;letter-spacing:-.4px;margin:12px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:20px;background:var(--card);border:1px solid var(--line);aspect-ratio:1.4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}
.tile span{font-size:30px}
.tile b{font-size:14px;font-weight:800;padding:0 8px}
.tile.img:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#000d 100%)}
.tile.img b{position:relative;z-index:1;align-self:flex-end;padding-bottom:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.pimg{position:relative;aspect-ratio:4/5;background:var(--card2);cursor:pointer;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:900;border-radius:8px;padding:3px 8px;letter-spacing:.5px}
.tag.vip{background:var(--gold);color:#1a1a1a;box-shadow:0 0 14px #facc1599}
.tag.top2{background:var(--r);color:#fff}
.tag.top{background:#fff;color:#111}
.pb{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.pt{font-size:14px;font-weight:700;line-height:1.3;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pp{font-family:Unbounded,Inter,sans-serif;font-weight:800;font-size:15px;color:#fff;letter-spacing:-.2px}
.pm{font-size:12px;color:var(--m)}
.pa{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.pa .btn{margin:0;flex:1}
.ic{background:var(--card2);border:1px solid var(--line);border-radius:12px;width:42px;height:38px;cursor:pointer;font-size:17px;flex:0 0 42px;padding:0}
.ic.big{width:52px;height:52px;flex:0 0 52px;font-size:20px;border-radius:16px}
.ic.on{border-color:var(--r)}
.more{grid-column:1/-1;background:var(--card2);border:1px solid var(--line);color:var(--t);border-radius:14px;padding:13px;font-weight:800;cursor:pointer;font-family:inherit}
.btn{display:block;width:100%;background:var(--r);color:#fff;border:0;border-radius:16px;padding:14px;font-size:15px;font-weight:800;margin:8px 0;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;transition:background .25s,transform .1s;box-shadow:0 8px 20px #dc262633}
.btn:active{transform:scale(.99)}
.btn.sm{margin:0;padding:11px;font-size:13px;border-radius:12px}
.btn.ok{background:var(--ok)!important;box-shadow:0 8px 20px #16a34a44}
.btn.n{background:var(--card2);border:1px solid var(--line);box-shadow:none}
.btn.busy{background:#525252!important}
.btn.fail{background:#7f1d1d!important}
.btn:disabled{cursor:default}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
.link{background:none;border:0;color:var(--r2);font-weight:700;font-size:14px;cursor:pointer;padding:8px 0;font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
input,select,textarea{width:100%;padding:14px;margin:6px 0;border:1px solid var(--line);border-radius:14px;font-size:16px;background:var(--card2);color:var(--t);font-family:inherit}
input::placeholder,textarea::placeholder{color:#6b6b6b}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--r)}
.bad{border-color:var(--r)!important;box-shadow:0 0 0 3px #dc262633}
.ferr{color:var(--r2);font-size:13px;font-weight:700;margin:-2px 2px 6px;min-height:0}
.hint{color:var(--m);font-size:12px;margin:-2px 2px 8px;line-height:1.5}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{background:transparent;color:var(--m);border:0;border-radius:11px;padding:11px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--r);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--m);margin:8px 0 4px;line-height:1.4}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--r);flex:0 0 20px}
.chk a{color:var(--r2);font-weight:700}
.addph{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);border:1px dashed #3a3a3a;color:var(--t);border-radius:14px;padding:13px;font-weight:700;cursor:pointer;font-size:15px;margin:6px 0}
.err{color:var(--r2);font-size:14px;font-weight:700;margin-top:10px;min-height:18px;line-height:1.4}
.okt{color:#4ade80;font-size:14px;font-weight:700;margin-top:10px}
.muted{color:var(--m);font-size:13px;line-height:1.5}
.crumbs{font-size:13px;color:var(--m);margin:6px 0 10px}
.crumbs a{color:var(--r2);text-decoration:none;font-weight:700}
.main img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:22px;background:var(--card2);display:block}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:10px 0 4px}
.thumbs img{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:0 0 58px;border:2px solid transparent;opacity:.55;cursor:pointer}
.thumbs img.on{border-color:var(--r);opacity:1}
.ptitle{font-size:24px;font-weight:900;letter-spacing:-.4px;margin:12px 0 4px}
.pp.big{font-size:24px}
.pp.big small{font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:var(--m)}
.acts3{display:flex;gap:8px;align-items:center;margin:14px 0}
.sharebtn{flex:1;height:52px;border:0;border-radius:16px;background:linear-gradient(120deg,#dc2626,#7f1d1d,#ef4444,#dc2626);background-size:250% auto;color:#fff;font-weight:900;font-size:15px;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 10px 26px #dc262666;animation:shineBtn 3s linear infinite;font-family:inherit}
.sharebtn span{font-size:18px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px}
.fact b{display:block;font-size:11px;color:var(--m);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.desc{white-space:pre-wrap;color:#d4d4d4;line-height:1.55}
.sellerbox{background:linear-gradient(135deg,#1c0a0a,var(--card));border:1px solid var(--rd);border-radius:20px;padding:16px;margin-top:16px}
.sellerTop{display:flex;gap:12px;align-items:center;margin-bottom:12px;text-decoration:none;color:var(--t)}
.cav{width:48px;height:48px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex:0 0 48px;overflow:hidden}
.cav.sm{width:42px;height:42px;flex:0 0 42px;font-size:16px}
.cav img{width:100%;height:100%;object-fit:cover}
.phone{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:800;margin:4px 0 12px;letter-spacing:1px}
.st{background:none;border:0;color:#3f3f3f;font-size:34px;cursor:pointer;padding:0 4px;line-height:1}
.st.on{color:var(--gold)}
.starsRow{display:flex;justify-content:center;gap:4px;margin:6px 0}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--m);margin:5px 0}
.bar span{width:34px}
.bar i{flex:1;height:8px;border-radius:6px;background:var(--card2);overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--r),var(--gold))}
.bar em{width:24px;text-align:right;font-style:normal}
.cmt{background:var(--card2);border-radius:14px;padding:10px;margin:8px 0;font-size:14px;line-height:1.45}
.cmt.rp{border-left:3px solid var(--r)}
.row2{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0}
.row2.pointer{cursor:pointer}
.banner{position:relative;border-radius:24px;padding:26px 18px 58px;background:linear-gradient(135deg,var(--r) 0%,var(--rd) 45%,#000 100%);overflow:hidden;text-align:center;margin-top:6px;box-shadow:0 14px 34px #dc262655}
.banner:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#ffffff12;right:-110px;top:-120px}
.bn-logo{position:relative;font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:18px;letter-spacing:-1px;opacity:.95}
.bn-logo small{display:block;font-family:Inter,sans-serif;font-size:9px;letter-spacing:5px;opacity:.8}
.bn-name{position:relative;font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:24px;letter-spacing:-.5px;margin-top:12px;text-transform:uppercase;word-break:break-word}
.bn-sub{position:relative;font-size:11px;letter-spacing:3px;opacity:.85;margin-top:6px;text-transform:uppercase}
.shop-head{display:flex;align-items:flex-end;gap:12px;margin:-42px 0 0 14px;position:relative}
.shop-av{width:84px;height:84px;border-radius:50%;background:var(--card);border:3px solid var(--k);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;overflow:hidden;flex:0 0 84px;color:var(--r2)}
.shop-av img{width:100%;height:100%;object-fit:cover}
.shop-title{padding-bottom:6px;font-size:18px;font-weight:900}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats3 div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stats3 b{display:block;font-size:17px;font-weight:900;color:#fff}
.stats3 span{font-size:11px;color:var(--m)}
.shop-actions{display:flex;gap:8px}
.shop-actions .btn{margin:0;flex:1}
.pills{display:flex;gap:8px;margin:14px 0 4px}
.pill{flex:1;background:var(--card);border:1px solid var(--line);color:var(--m);border-radius:14px;padding:11px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.pill.on{background:var(--r);color:#fff;border-color:var(--r)}
.sorts{display:flex;gap:6px;overflow-x:auto;margin:12px 0 10px;padding-bottom:4px}
.sort{background:none;border:0;color:var(--m);font-weight:800;font-size:15px;padding:6px 6px;cursor:pointer;font-family:inherit;white-space:nowrap;border-bottom:2px solid transparent}
.sort.on{color:var(--t);border-color:var(--r)}
.qgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.qi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;color:var(--t);cursor:pointer;text-decoration:none;font-size:12px;font-weight:700;text-align:center}
.qi i{font-style:normal;font-size:24px}
.qi b{position:absolute;top:6px;right:8px;background:var(--r2);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
.profile{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.av{width:72px;height:72px;border-radius:50%;background:var(--card2);border:2px solid var(--r);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;flex:0 0 72px}
.av img{width:100%;height:100%;object-fit:cover}
.pname{font-size:20px;font-weight:900}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.langs button{background:var(--card2);border:1px solid var(--line);color:var(--t);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.langs button.on{background:var(--r);border-color:var(--r)}
.about{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;font-size:16px;line-height:1.7}
.about p{margin:0 0 12px}

/* ЧАТ */
.clist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.citem{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 12px;cursor:pointer;position:relative}
.citem:active{border-color:var(--r)}
.citem .cb{flex:1;min-width:0}
.citem .ct{display:flex;justify-content:space-between;gap:8px;align-items:center}
.citem .ct b{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .ct span{font-size:11px;color:var(--m);flex:0 0 auto}
.citem .cp{font-size:13px;color:var(--m);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdot{width:9px;height:9px;border-radius:50%;background:var(--r2);flex:0 0 9px;box-shadow:0 0 0 3px #ef444433}
.chatbox{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:400px}
.chead{display:flex;gap:9px;align-items:center;padding:4px 0 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.chead .cav{width:34px;height:34px;flex:0 0 34px;font-size:14px}
.cname{flex:1;min-width:0}
.cname b{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cname span{font-size:11px;color:var(--m)}
.sbtn{background:var(--card2);border:1px solid var(--line);color:var(--t);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.cmsgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:4px 2px}
.dsep{align-self:center;margin:6px 0 2px;font-size:10px;color:var(--m);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;letter-spacing:.4px}

async function toDataUrl(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=0.7, out=c.toDataURL("image/jpeg",q);
    while(out.length>330000&&q>0.3){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
    if(out.length>330000) throw new Error("Фото слишком большое");
    return out;
  }finally{ URL.revokeObjectURL(url); }
}
async function toJpegBlob(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Не удалось сжать фото")),"image/jpeg",q));
  }finally{ URL.revokeObjectURL(url); }
}

function dayKey(t){ const d=new Date(t); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dayLabel(t){
  const d=new Date(t), now=new Date(), y=new Date(); y.setDate(now.getDate()-1);
  if(dayKey(t)===dayKey(now)) return "Сегодня";
  if(dayKey(t)===dayKey(y)) return "Вчера";
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
}

    if(k!==last){ out+=`<div class="dsep">${dayLabel(m.created_at)}</div>`; last=k; }
    out+=render(m);
  });
  return out;
}

async function init(){
  const {data}=await db.auth.getSession();
  user=data.session?.user||null;
  if(user){
    const {data:a}=await db.from("admins").select("user_id").eq("user_id",user.id);
    if(a&&a.length) return location.replace("./admin/");
  }
  db.auth.onAuthStateChange((ev,s)=>{ user=s?.user||null; updateBottom(); pollBadge(); });
  await loadRefs();
  window.addEventListener("hashchange",route);
  updateBottom(); route();
  pollBadge();
  clearInterval(BADGE_T);
  BADGE_T=setInterval(pollBadge,20000);
}
async function loadRefs(){
  const [{data:cats},{data:geo}]=await Promise.all([

function sortedKids(parent){
  return CATS.filter(c=>(c.parent_id??null)===(parent??null))
    .sort((a,b)=>(a.sort_order??0)-(b.sort_order??0)||a.name.localeCompare(b.name));

function updateBottom(){
  const fe=$("#favn"); if(fe) fe.textContent=favs().length||"";

async function pollBadge(){
  const b=$("#chatn");
  if(!user){ if(b) b.textContent=""; return; }
  const {data}=await db.rpc("my_threads");
  const sn=seen();
  const list=(data||[]).filter(t=>!t.i_am_seller);
  const n=list.filter(t=>t.last_at&&(!sn[t.thread_id]||new Date(t.last_at)>new Date(sn[t.thread_id]))).length;
  if(b) b.textContent=n||"";
  if($("#clist")) renderDialogs(list);
}
function setNav(p){ document.querySelectorAll(".bottom a").forEach(a=>a.classList.toggle("on",a.dataset.t===p)); }
function route(){
  clearInterval(CHAT.timer);
  if(recovery) return recoveryView();
  const parts=(location.hash||"#/").slice(2).split("/");
  const page=parts[0]||"", arg=parts[1]||"";
  closeSheet(); window.scrollTo(0,0); updateBottom();
  const navMap={"":"home",cat:"cat",fav:"fav",chats:"chats",chat:"chats",profile:"prof",register:"prof"};
  setNav(navMap[page]||"");
  if(page==="cat") return catView(arg?+arg:null);
  if(page==="search") return searchView();
  if(page==="fav") return favView();
  if(page==="profile"||page==="register") return profileView(page==="register");
  if(page==="product") return productView(+arg);
  if(page==="seller") return sellerView(arg);
  if(page==="chats") return chatsView();
  if(page==="chat") return chatView(arg);
  if(page==="about") return aboutView();
  return homeView();
}

function clearHist(){ store.set("opt_hist",[]); renderHist(); }
function dhash(src){
  return new Promise((res,rej)=>{
    const im=new Image(); im.crossOrigin="anonymous";
    im.onload=()=>{
      const c=document.createElement("canvas"); c.width=9; c.height=8;
      const x=c.getContext("2d"); x.drawImage(im,0,0,9,8);
      const d=x.getImageData(0,0,9,8).data;
      const g=k=>0.299*d[k]+0.587*d[k+1]+0.114*d[k+2];
      let bits="";
      for(let y=0;y<8;y++) for(let i=0;i<8;i++) bits+=g((y*9+i)*4)>g((y*9+i+1)*4)?"1":"0";
      res(BigInt("0b"+bits).toString(16).padStart(16,"0"));
    };
    im.onerror=()=>rej(new Error("image"));
    im.src=src;
  });
}
function hamming(a,b){
  let x=BigInt("0x"+a)^BigInt("0x"+b), n=0;
  while(x>0n){ n+=Number(x&1n); x>>=1n; }
  return n;
}
async function photoSearch(file){
  const list=$("#list"), info=$("#info"); if(!file||!list) return;
  info.textContent="Ищем похожие товары...";
  let qh;
  try{
    const u=URL.createObjectURL(file);
    qh=await dhash(u);
    URL.revokeObjectURL(u);
  }catch(e){ info.textContent="Не удалось прочитать фото. Попробуйте другое."; return; }
  const {data,error}=await db.from("products").select("id,title,price,min_order,photos,img_hash,tier,cities(name)")
    .eq("status","published").gt("photos_until",new Date().toISOString()).limit(300);
  if(!$("#list")) return;
  if(error){ info.textContent="Ошибка: "+error.message; return; }
  const items=(data||[]).map(p=>({...p,city_name:p.cities?.name}));
  const ranked=items.filter(p=>p.img_hash).map(p=>({p,d:hamming(qh,p.img_hash)}))
    .sort((a,b)=>(b.p.tier||0)-(a.p.tier||0)||a.d-b.d).slice(0,12);
  info.textContent=ranked.length?"Похожие товары:":"Похожих товаров не найдено";
  list.innerHTML=ranked.map(x=>card(x.p)).join("");
}

async function chatView(sellerId){
  if(!user) return needAuth("Войдите, чтобы написать продавцу");
  setNav("chats");
  const [{data:sp},{data:tid,error}]=await Promise.all([
    db.rpc("seller_public",{p_seller:sellerId}),
    db.rpc("open_thread",{p_seller:sellerId})
  ]);
  if(error){ $("#app").innerHTML=`<section><p class="err">${esc(error.message)}</p><a class="btn n" href="#/">На главную</a></section>`; return; }
  const name=sp?.[0]?.username||"Продавец";
  CHAT={tid,sid:sellerId,timer:null,photo:null};
  const sn=seen(); sn[tid]=new Date().toISOString(); setSeen(sn);
  $("#app").innerHTML=`<section class="chatbox">
    <div class="chead">
      <button class="ibtn sm" onclick="go('#/chats')" aria-label="Назад">←</button>
      <div class="cav sm">${ini(name)}</div>
      <div class="cname"><b>${esc(name)}</b><span>продавец</span></div>
      <button class="sbtn" onclick="go('#/seller/${sellerId}')">Магазин</button>
    </div>
    <div class="cmsgs" id="cmsgs"><p class="muted" style="margin:auto">Загрузка...</p></div>
    <div class="cprev" id="cprev"><img id="cpimg"><button class="cx" onclick="clearChatPhoto()">×</button></div>
    <form class="cform" onsubmit="sendChat(event)">
      <label class="clip">📷<input type="file" accept="image/*" onchange="pickChatPhoto(this.files[0])"></label>
      <textarea id="ctxt" rows="1" placeholder="Сообщение…" maxlength="1000"></textarea>
      <button class="send" id="csend" type="submit">➤</button>
    </form>
    <p class="err" id="cerr" style="margin:4px 0 0;font-size:12px"></p>
  </section>`;
  const pre=sessionStorage.getItem("opt_prefill");
  if(pre){ sessionStorage.removeItem("opt_prefill"); const t=$("#ctxt"); if(t) t.value=pre; }
  await loadChat(true);
  clearInterval(CHAT.timer);
  CHAT.timer=setInterval(()=>loadChat(false),8000);
}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>");
}
async function loadChat(scroll){
  const box=$("#cmsgs"); if(!box||!CHAT.tid) return;
  const {data,error}=await db.from("buyer_messages").select("id,sender_id,body,attachment,created_at")
    .eq("thread_id",CHAT.tid).order("created_at");
  if(!$("#cmsgs")) return;
  if(error){ box.innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  box.innerHTML=(data||[]).length
    ? withDays(data,m=>{
        const mine=m.sender_id===user.id;
        return `<div class="bub ${mine?"me":"them"}">${m.attachment?`<img src="${esc(m.attachment)}">`:""}${m.body?linkify(m.body):""}<div class="bt">${tm(m.created_at)}</div></div>`;
      })
    : '<p class="muted" style="margin:auto;text-align:center;font-size:13px">Напишите первое сообщение</p>';
  if(scroll||near) box.scrollTop=box.scrollHeight;
  const sn=seen(); sn[CHAT.tid]=new Date().toISOString(); setSeen(sn);
}
async function pickChatPhoto(f){
  if(!f) return;
  try{
    CHAT.photo=await toDataUrl(f,800);
    $("#cpimg").src=CHAT.photo; $("#cprev").classList.add("on"); $("#cerr").textContent="";
  }catch(e){ CHAT.photo=null; $("#cerr").textContent=e.message; }
}
function clearChatPhoto(){
  CHAT.photo=null;
  const p=$("#cprev"); if(p) p.classList.remove("on");
  const i=$("#cpimg"); if(i) i.src="";
}
async function sendChat(e){
  e.preventDefault();
  const t=$("#ctxt"), body=t.value.trim();
  if(!body&&!CHAT.photo){ $("#cerr").textContent="Напишите сообщение или прикрепите фото."; return; }
  const btn=$("#csend");
  const ok=await act(btn,async()=>{
    const {error}=await db.rpc("send_buyer_message",{p_thread:CHAT.tid,p_body:body,p_attach:CHAT.photo});
    if(error) throw new Error(error.message);
  },"ok");
  if(ok){ t.value=""; clearChatPhoto(); }
  setTimeout(()=>{ btn.disabled=false; btn.classList.remove("ok"); btn.innerHTML="➤"; },500);
  await loadChat(true);
}

function setAuth(m){ location.hash=m==="reg"?"#/register":"#/profile"; }
function profileView(isReg){
  if(user) return accountView();
  REG_AV=null;
  $("#app").innerHTML=`<section>
    <div class="seg">

          <input type="file" accept="image/*" style="display:none" onchange="pickRegAvatar(this.files[0])">

        <div class="muted" id="avName"></div>`:""}
      <input id="em" type="email" placeholder="Email" oninput="clearF('em')">

        <div class="ferr" data-for="agree"></div>
        <button class="btn" data-label="Зарегистрироваться" onclick="doReg(this)">Зарегистрироваться</button>`
        :`<button class="btn" data-label="Войти" onclick="doLogin(this)">Войти</button>
          <p><button class="link" onclick="resetPw()">Забыли пароль?</button></p>`}
      <p id="authMsg" class="err"></p>
    </div>

function pickRegAvatar(f){
  if(!f) return;
  REG_AV=f;
  const n=$("#avName"); if(n) n.textContent="Фото выбрано: "+f.name;
}
async function checkUn(){
  const un=($("#un")?.value||"").trim();
  if(un.length<3) return;
  const {data}=await db.rpc("username_taken",{p:un});
  if(data) ferr("un","Этот ник уже занят");
}
async function doReg(btn){
  clearAll();
  const un=($("#un").value||"").trim(), em=($("#em").value||"").trim();
  const pw=$("#pw").value, pw2=$("#pw2").value;
  let ok=true;
  if(un.length<3||/\s/.test(un)){ ferr("un","Ник: минимум 3 символа, без пробелов"); ok=false; }
  if(!/^\S+@\S+\.\S+$/.test(em)){ ferr("em","Введите правильный email"); ok=false; }
  if(pw.length<6){ ferr("pw","Пароль: минимум 6 символов"); ok=false; }
  if(pw2!==pw){ ferr("pw2","Пароли не совпадают"); ok=false; }
  if(!$("#agree").checked){ ferr("agree","Нужно согласие с политикой"); ok=false; }
  if(!ok){ toast("Исправьте отмеченные поля","err"); return; }
  let note="";
  const done=await act(btn,async()=>{
    const {data:taken}=await db.rpc("username_taken",{p:un});
    if(taken){ ferr("un","Этот ник уже занят"); throw new Error("Ник занят"); }
    const {data,error}=await db.auth.signUp({email:em,password:pw,options:{data:{username:un,role:"buyer"}}});
    if(error){
      if(/already/i.test(error.message)){ ferr("em","Этот email уже зарегистрирован. Нажмите «Войти»."); throw new Error("Email уже зарегистрирован"); }
      throw new Error(error.message);
    }
    if(data.session){
      user=data.user;
      if(REG_AV){ try{ await saveAvatar(REG_AV); }catch(e){ note="Фото не сохранено: "+e.message; } }
    } else {
      note="Аккаунт создан. Подтвердите email и войдите. Фото можно добавить в профиле.";
    }
  },"ok");
  if(done){
    updateBottom();
    if(user){ toast("Добро пожаловать, "+un+"!","ok"); go("#/profile"); }
    else { setAuth("login"); const m=$("#authMsg"); if(m) m.textContent=note; }
  }
}
async function doLogin(btn){
  clearAll();
  const em=($("#em").value||"").trim(), pw=$("#pw").value;
  let ok=true;
  if(!em){ ferr("em","Введите email"); ok=false; }
  if(!pw){ ferr("pw","Введите пароль"); ok=false; }
  if(!ok) return;
  const done=await act(btn,async()=>{
    const {data,error}=await db.auth.signInWithPassword({email:em,password:pw});
    if(error){
      ferr("em","Неверный пароль или неверный email");
      ferr("pw","Неверный пароль или неверный email");
      throw new Error("Неверный пароль или неверный email");
    }
    user=data.user;
  },"ok");
  if(done){ updateBottom(); go("#/profile"); }
}
async function resetPw(){
  clearAll();
  const em=($("#em").value||"").trim();
  if(!/^\S+@\S+\.\S+$/.test(em)){ ferr("em","Сначала введите email"); return; }
  const {error}=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  const m=$("#authMsg");
  m.className=error?"err":"okt";
  m.textContent=error?error.message:"Ссылка для нового пароля отправлена на "+em+". Проверьте почту и папку «Спам».";
}
function recoveryView(){
  $("#app").innerHTML=`<section><div class="card">
    <h3>Новый пароль</h3>

function aboutView(){
  const cur=ABOUT[LANG]||ABOUT.ru;
  $("#app").innerHTML=`<section><h2>О приложении</h2>
    <div class="langs">${Object.entries(ABOUT).map(([k,v])=>`<button class="${k===LANG?"on":""}" onclick="setLang('${k}')">${esc(v[0])}</button>`).join("")}</div>
    <div class="about">${cur.slice(1).map(p=>`<p>${esc(p)}</p>`).join("")}</div>
    <a class="btn n" href="./support/">💬 Поддержка 24/7</a>
  </section>`;
}
function setLang(k){ LANG=k; store.set("opt_lang",k); aboutView(); }

// ---------- ОПЕНИНГ (один раз при загрузке страницы) ----------
function playIntro(){
  const el=$("#intro"); if(!el) return;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce||/type=recovery/.test(location.hash)){
    el.remove(); document.body.classList.remove("intro-on"); return;
  }
  const dust=el.querySelector(".dust");
  for(let i=0;i<18;i++){
    const s=document.createElement("span");
    s.className="p";
    const size=2+Math.random()*3;
    s.style.left=(Math.random()*100)+"%";
    s.style.width=s.style.height=size+"px";
    s.style.animationDelay=(Math.random()*3)+"s";
    s.style.animationDuration=(3.2+Math.random()*2)+"s";
    dust.appendChild(s);
  }
  let ended=false;
  const finish=()=>{
    if(ended) return; ended=true;
    el.classList.add("out");
    setTimeout(()=>{ el.remove(); document.body.classList.remove("intro-on"); },650);
  };
  el.addEventListener("click",finish);
  setTimeout(finish,4300);
}

// ---------- СТАРТ ----------
updateBottom();
playIntro();
