<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://fwvvnzrprjffsmkpvhrl.supabase.co; base-uri 'self'; form-action 'self'">
<title>700 ОПТОМ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding-bottom:84px}
body.intro-on{overflow:hidden}
/* ЛАНЧЕР */
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 14px 8px;background:#000}
.logo{cursor:pointer;display:flex;flex-direction:column;line-height:1;user-select:none}
.logo .l7{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-style:italic;font-size:30px;letter-spacing:-2px;position:relative;display:inline-block}
.logo .l7:after{content:"";position:absolute;right:-14px;top:13px;width:22px;height:4px;background:#e11d1d;transform:skewX(-30deg);box-shadow:0 0 8px #e11d1d}
.logo .lo{font-weight:800;font-size:11px;letter-spacing:5px;margin-top:4px;padding-left:3px}
.logo.tap{animation:logoGo .56s cubic-bezier(.5,0,.8,.4) forwards}
.logo.back{animation:logoBack .5s cubic-bezier(.2,.8,.2,1)}
@keyframes logoGo{0%{transform:none;opacity:1}35%{transform:scale(1.3) rotate(-10deg);filter:drop-shadow(0 0 16px #ef4444)}100%{transform:translate(-40px,-30px) scale(.4) rotate(-40deg);opacity:0}}
@keyframes logoBack{from{opacity:0;transform:translateY(-14px) scale(.7)}to{opacity:1;transform:none}}
.tr{display:flex;gap:10px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;background:#121212;border:1px solid #232323;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:0}
.ibtn svg{width:22px;height:22px}
.ibtn.scan{border:2px solid #e11d1d;box-shadow:0 0 16px #e11d1d88}
.bd{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#e11d1d;color:#fff;font-size:11px;font-weight:800;line-height:19px;text-align:center;box-shadow:0 0 0 2px #000}
.bd:empty{display:none}
main{max-width:620px;margin:0 auto;padding:4px 14px 20px;animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
/* БАННЕР */
.hero{position:relative;border-radius:22px;overflow:hidden;height:196px;background:#080808;border:1px solid #1a1a1a;margin:4px 0 14px}
.slides{display:flex;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.slide{flex:0 0 100%;height:100%;position:relative;overflow:hidden;background:linear-gradient(100deg,#060606 35%,#2b0707 100%)}
.slide .txt{position:absolute;left:18px;top:22px;max-width:58%;z-index:2}
.slide h1{margin:0;font:900 32px/1.02 Unbounded,Inter,sans-serif;letter-spacing:-1px}
.slide p{margin:8px 0 14px;font-size:14px;color:#ddd}
.slide .art{position:absolute;right:-4px;bottom:-2px;width:54%;height:100%}
.dots{position:absolute;bottom:12px;left:18px;display:flex;gap:6px;z-index:3}
.dots i{width:6px;height:6px;border-radius:50%;background:#555;transition:all .3s}
.dots i.on{width:18px;border-radius:4px;background:#e11d1d}
/* ПОИСК И КАТЕГОРИИ */
.sbar{display:flex;align-items:center;gap:10px;background:#121212;border:1px solid #222;border-radius:18px;height:54px;padding:0 8px 0 16px;cursor:pointer}
.sbar .si{color:#9a9a9a;display:flex}
.sbar .si svg{width:22px;height:22px}
.sbar .sph{flex:1;color:#8a8a8a;font-size:16px}
.fb{width:40px;height:40px;border-radius:12px;background:transparent;border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cats{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;width:74px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:#ddd;cursor:pointer;text-align:center}
.cat i{width:62px;height:62px;border-radius:50%;background:#121212;border:1px solid #222;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;font-style:normal}
.cat i img{width:100%;height:100%;object-fit:cover}
.sec{font-size:20px;font-weight:900;margin:16px 2px 10px;letter-spacing:-.3px}
h2{font-size:22px;font-weight:900;letter-spacing:-.4px;margin:12px 0 8px}
h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#8a8a8a;margin:18px 0 8px}
/* КАРТОЧКИ ТОВАРОВ */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:#101010;border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid #1a1a1a}
.pimg{position:relative;aspect-ratio:1/1;background:#181818;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:900;border-radius:7px;padding:3px 7px;letter-spacing:.4px}
.tag.vip{background:#facc15;color:#1a1a1a;box-shadow:0 0 12px #facc1599}
.tag.top2{background:#e11d1d;color:#fff}
.tag.top{background:#fff;color:#111}
.fv{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#000a;border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.fv svg{width:18px;height:18px}
.fv.on{color:#e11d1d}
.pb{padding:10px 11px 12px}
.pp{font-weight:900;font-size:17px;color:#fff;letter-spacing:-.2px}
.pt{font-size:13px;color:#d6d6d6;margin-top:3px;line-height:1.3;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pm{font-size:11px;color:#7a7a7a;margin-top:4px}
.more{grid-column:1/-1;background:#141414;border:1px solid #222;color:#fff;border-radius:14px;padding:13px;font-weight:800;cursor:pointer;font-family:inherit}
/* ПРОМО */
.promo{position:relative;margin:18px 0 10px;border-radius:22px;overflow:hidden;height:150px;background:linear-gradient(100deg,#050505 40%,#2b0707 100%);border:1px solid #1a1a1a}
.promo .txt{position:absolute;left:18px;top:20px;z-index:2}
.promo h1{margin:0;font:900 26px/1.05 Unbounded,Inter,sans-serif;letter-spacing:-.6px}
.promo p{margin:6px 0 12px;font-size:13px;color:#ddd}
.promo .art{position:absolute;right:-2px;bottom:-4px;width:46%;height:100%}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.duo .btn{margin:0}
/* КНОПКИ */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:15px;border:0;background:linear-gradient(180deg,#ef2a2a,#c81616);color:#fff;font:800 15px Inter,sans-serif;box-shadow:0 8px 22px #e11d1d55;cursor:pointer;margin:8px 0;text-decoration:none;transition:transform .1s,background .25s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.sm{width:auto;height:40px;padding:0 16px;font-size:13px;border-radius:12px;margin:0}
.btn.n{background:#1a1a1a;border:1px solid #2a2a2a;box-shadow:none}
.btn.ok{background:#16a34a!important;box-shadow:0 8px 22px #16a34a55}
.btn.no{background:#b91c1c}
.btn.busy{background:#4a4a4a!important;box-shadow:none}
.btn.fail{background:#7f1d1d!important}
.btn:disabled{cursor:default}
.bk{display:inline-flex;align-items:center;gap:6px;background:#141414;border:1px solid #222;color:#fff;border-radius:12px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin:2px 0 10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
.link{background:none;border:0;color:#ff3b3b;font-weight:700;font-size:14px;cursor:pointer;padding:8px 0;font-family:inherit}
.muted{color:#8a8a8a;font-size:13px;line-height:1.5}
.err{color:#ff6b6b;font-size:14px;font-weight:700;margin-top:10px;min-height:18px;line-height:1.4}
.okt{color:#4ade80;font-size:14px;font-weight:700;margin-top:10px}
.crumbs{font-size:13px;color:#8a8a8a;margin:6px 0 10px}
.crumbs a{color:#ff3b3b;text-decoration:none;font-weight:700}
.chip{display:inline-flex;align-items:center;background:#141414;border:1px solid #222;border-radius:999px;padding:6px 6px 6px 12px;font-size:13px;margin:0 6px 6px 0}
.chip span{cursor:pointer}
.chip button{background:none;border:0;color:#8a8a8a;font-size:16px;cursor:pointer;padding:0 6px}
.hist{display:flex;flex-wrap:wrap;margin:10px 0}
.hh{width:100%;display:flex;justify-content:space-between;font-size:13px;color:#8a8a8a;font-weight:700;margin-bottom:6px}
.fpanel{background:#101010;border:1px solid #1e1e1e;border-radius:22px;padding:6px 14px 14px;margin:12px 0}
.fpanel h3{margin:14px 0 2px}
.prow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prow2 .btn{margin:10px 0 0}
.fsorts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
.fsort{background:#141414;border:1px solid #222;color:#8a8a8a;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.fsort.on{background:#e11d1d;border-color:#e11d1d;color:#fff}
.fchip{display:flex;justify-content:space-between;align-items:center;background:#1c0a0a;border:1px solid #3b1212;border-radius:14px;padding:9px 12px;margin:10px 0;font-size:13px;color:#fecaca}
.fchip button{background:none;border:0;color:#ff3b3b;font-weight:800;cursor:pointer;font-family:inherit}
input,select,textarea{width:100%;padding:14px;margin:6px 0;border:1px solid #222;border-radius:14px;font-size:16px;background:#141414;color:#fff;font-family:inherit}
input::placeholder,textarea::placeholder{color:#5f5f5f}
input:focus,select:focus,textarea:focus{outline:none;border-color:#e11d1d}
.bad{border-color:#e11d1d!important;box-shadow:0 0 0 3px #e11d1d33}
.ferr{color:#ff6b6b;font-size:13px;font-weight:700;margin:-2px 2px 6px;min-height:0}
.hint{color:#8a8a8a;font-size:12px;margin:-2px 2px 8px;line-height:1.5}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#141414;border:1px solid #222;border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{background:transparent;color:#8a8a8a;border:0;border-radius:12px;padding:11px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.seg button.on{background:linear-gradient(180deg,#ef2a2a,#c81616);color:#fff}
.card{background:#101010;border:1px solid #1e1e1e;border-radius:20px;padding:16px;margin:12px 0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#8a8a8a;margin:8px 0 4px;line-height:1.4}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:#e11d1d;flex:0 0 20px}
.chk a{color:#ff3b3b;font-weight:700}
.addph{display:flex;align-items:center;justify-content:center;gap:8px;background:#141414;border:1px dashed #333;color:#fff;border-radius:14px;padding:13px;font-weight:700;cursor:pointer;font-size:15px;margin:6px 0}
/* ТОВАР */
.main img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:22px;background:#141414;display:block}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:10px 0 4px}
.thumbs img{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:0 0 58px;border:2px solid transparent;opacity:.5;cursor:pointer}
.thumbs img.on{border-color:#e11d1d;opacity:1}
.ptitle{font-size:24px;font-weight:900;letter-spacing:-.4px;margin:12px 0 4px}
.pbig{font-weight:900;font-size:26px;color:#fff}
.pbig small{font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:#8a8a8a}
.acts3{display:flex;gap:10px;align-items:center;margin:14px 0}
.acts3 .btn{margin:0;flex:1}
.sharebtn{flex:1;height:52px;border:0;border-radius:16px;background:linear-gradient(120deg,#e11d1d,#7f1d1d,#ff3b3b,#e11d1d);background-size:250% auto;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 26px #e11d1d66;animation:shineBtn 3s linear infinite;font-family:inherit}
@keyframes shineBtn{to{background-position:250% center}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.fact{background:#101010;border:1px solid #1e1e1e;border-radius:14px;padding:12px;font-size:15px}
.fact b{display:block;font-size:11px;color:#8a8a8a;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.desc{white-space:pre-wrap;color:#d4d4d4;line-height:1.55}
.sellerbox{background:linear-gradient(135deg,#1c0a0a,#101010);border:1px solid #3b1212;border-radius:20px;padding:16px;margin-top:16px}
.sellerTop{display:flex;gap:12px;align-items:center;margin-bottom:12px;text-decoration:none;color:#fff}
.cav{width:46px;height:46px;border-radius:50%;background:#e11d1d;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex:0 0 46px;overflow:hidden}
.cav.sm{width:40px;height:40px;flex:0 0 40px;font-size:16px}
.cav img{width:100%;height:100%;object-fit:cover}
.phone{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:800;margin:4px 0 12px;letter-spacing:1px}
.st{background:none;border:0;color:#3a3a3a;font-size:34px;cursor:pointer;padding:0 4px;line-height:1}
.st.on{color:#facc15}
.starsRow{display:flex;justify-content:center;gap:4px;margin:6px 0}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;color:#8a8a8a;margin:5px 0}
.bar span{width:34px}
.bar i{flex:1;height:8px;border-radius:6px;background:#1a1a1a;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#e11d1d,#facc15)}
.bar em{width:24px;text-align:right;font-style:normal}
.cmt{background:#171717;border-radius:14px;padding:10px;margin:8px 0;font-size:14px;line-height:1.45}
.cmt.rp{border-left:3px solid #e11d1d}
.banner{position:relative;border-radius:24px;padding:26px 18px 58px;background:linear-gradient(135deg,#e11d1d 0%,#7f1d1d 45%,#000 100%);overflow:hidden;text-align:center;margin-top:6px}
.bn-logo{position:relative;font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:18px;letter-spacing:-1px}
.bn-name{position:relative;font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:24px;letter-spacing:-.5px;margin-top:12px;text-transform:uppercase;word-break:break-word}
.bn-sub{position:relative;font-size:11px;letter-spacing:3px;opacity:.85;margin-top:6px;text-transform:uppercase}
.shop-head{display:flex;align-items:flex-end;gap:12px;margin:-42px 0 0 14px;position:relative}
.shop-av{width:84px;height:84px;border-radius:50%;background:#101010;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;overflow:hidden;flex:0 0 84px;color:#ff3b3b}
.shop-av img{width:100%;height:100%;object-fit:cover}
.shop-title{padding-bottom:6px;font-size:18px;font-weight:900}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats3 div{background:#101010;border:1px solid #1e1e1e;border-radius:16px;padding:12px 6px;text-align:center}
.stats3 b{display:block;font-size:17px;font-weight:900}
.stats3 span{font-size:11px;color:#8a8a8a}
.shop-actions{display:flex;gap:8px}
.shop-actions .btn{margin:0;flex:1}
.pills{display:flex;gap:8px;margin:14px 0 4px}
.pill{flex:1;background:#101010;border:1px solid #1e1e1e;color:#8a8a8a;border-radius:14px;padding:11px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.pill.on{background:linear-gradient(180deg,#ef2a2a,#c81616);color:#fff;border-color:transparent}
.sorts{display:flex;gap:6px;overflow-x:auto;margin:12px 0 10px}
.sort{background:none;border:0;color:#8a8a8a;font-weight:800;font-size:15px;padding:6px;cursor:pointer;font-family:inherit;white-space:nowrap;border-bottom:2px solid transparent}
.sort.on{color:#fff;border-color:#e11d1d}
.qgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.qi{position:relative;background:#101010;border:1px solid #1e1e1e;border-radius:18px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;cursor:pointer;text-decoration:none;font-size:12px;font-weight:700;text-align:center;font-family:inherit}
.qi i{font-style:normal;font-size:24px}
.profile{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.av{width:70px;height:70px;border-radius:50%;background:#101010;border:2px solid #e11d1d;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;flex:0 0 70px}
.av img{width:100%;height:100%;object-fit:cover}
.pname{font-size:20px;font-weight:900}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.langs button{background:#141414;border:1px solid #222;color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.langs button.on{background:#e11d1d;border-color:#e11d1d}
.about{background:#101010;border:1px solid #1e1e1e;border-radius:20px;padding:18px;font-size:16px;line-height:1.7}
.about p{margin:0 0 12px}
/* ЧАТ */
.citem{display:flex;align-items:center;gap:11px;background:#101010;border:1px solid #1e1e1e;border-radius:18px;padding:11px 12px;margin:8px 0;cursor:pointer;position:relative}
.citem:active{border-color:#e11d1d}
.citem .cb{flex:1;min-width:0}
.citem .ct{display:flex;justify-content:space-between;gap:8px;align-items:center}
.citem .ct b{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .ct span{font-size:11px;color:#8a8a8a;flex:0 0 auto}
.citem .cp{font-size:13px;color:#8a8a8a;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdot{width:9px;height:9px;border-radius:50%;background:#e11d1d;flex:0 0 9px;box-shadow:0 0 0 3px #e11d1d33}
.chatbox{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:400px}
.chead{display:flex;gap:9px;align-items:center;padding:4px 0 8px;border-bottom:1px solid #1a1a1a;margin-bottom:6px}
.cname{flex:1;min-width:0}
.cname b{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cname span{font-size:11px;color:#8a8a8a}
.sbtn{background:#141414;border:1px solid #222;color:#fff;border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.cmsgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:4px 2px}
.dsep{align-self:center;margin:6px 0 2px;font-size:10px;color:#8a8a8a;background:#141414;border:1px solid #222;border-radius:999px;padding:3px 10px}
.bub{max-width:78%;padding:7px 10px;border-radius:14px;font-size:14px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#e11d1d,#7f1d1d);color:#fff;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#171717;border:1px solid #242424;border-bottom-left-radius:4px}
.bub a{color:#ff9a9a}
.bub img{display:block;max-width:100%;max-height:200px;border-radius:10px;margin-bottom:4px}
.bt{font-size:9px;opacity:.6;margin-top:3px;text-align:right}
.cform{display:flex;gap:6px;align-items:flex-end;margin-top:6px;background:#101010;border:1px solid #222;border-radius:18px;padding:4px}
.cform textarea{flex:1;margin:0;border:0;background:none;padding:8px;resize:none;height:36px;max-height:90px;font-size:15px}
.clip{width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:#171717;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.clip input{display:none}
.send{width:40px;height:40px;flex:0 0 40px;border-radius:13px;border:0;background:linear-gradient(180deg,#ef2a2a,#c81616);color:#fff;font-size:15px;cursor:pointer}
.send.ok{background:#16a34a}
.cprev{display:none;align-items:center;gap:8px;margin-top:6px}
.cprev.on{display:flex}
.cprev img{width:48px;height:48px;object-fit:cover;border-radius:10px}
.cx{background:#171717;border:1px solid #222;color:#fff;border-radius:999px;width:24px;height:24px;cursor:pointer;font-size:14px;padding:0}
/* НИЖНЕЕ МЕНЮ */
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;background:#000;border-top:1px solid #161616;display:flex;padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:25}
.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8a8a8a;text-decoration:none;font-size:11px;font-weight:600;position:relative;padding-top:6px}
.bottom a svg{width:24px;height:24px}
.bottom a.on{color:#ff2d2d;font-weight:800}
.bottom a.on:before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:56px;height:3px;border-radius:3px;background:#e11d1d;box-shadow:0 0 10px #e11d1d}
.bottom .bd{top:2px;left:calc(50% + 8px);right:auto}
/* ВСПЛЫВАЮЩАЯ ХАБАРНОМА */
.nbanner{position:fixed;top:10px;left:50%;transform:translate(-50%,-150px);width:calc(100% - 20px);max-width:600px;z-index:70;background:#141414ee;border:1px solid #2a2a2a;border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:0 14px 40px #000c;transition:transform .35s cubic-bezier(.2,.8,.2,1);cursor:pointer;backdrop-filter:blur(10px)}
.nbanner.show{transform:translate(-50%,0)}
.nbav{width:40px;height:40px;border-radius:50%;background:#e11d1d;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 40px}
.nb{flex:1;min-width:0}
.nb b{display:block;font-size:14px;font-weight:800}
.nb span{display:block;font-size:13px;color:#cfcfcf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.nx{background:none;border:0;color:#8a8a8a;font-size:20px;cursor:pointer;padding:4px 6px}
/* ОКНА */
.sheet{position:fixed;inset:0;background:#000b;display:none;z-index:40;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sbox{background:#101010;border:1px solid #1e1e1e;border-radius:24px 24px 0 0;width:100%;max-width:620px;padding:20px;max-height:80vh;overflow:auto}
.sbox textarea{height:70px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-130px);top:14px;z-index:80;background:#141414;border:1px solid #222;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:700;transition:transform .3s;max-width:92%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{border-color:#7f1d1d;color:#fecaca}
.toast.ok{border-color:#14532d;color:#bbf7d0}

:root{--metal:linear-gradient(180deg,#ffffff 0%,#dcdcdc 28%,#7a7a7a 47%,#f2f2f2 56%,#a8a8a8 78%,#e8e8e8 100%)}
#intro{position:fixed;inset:0;z-index:1000;background:#000;overflow:hidden;transition:opacity .6s ease}
#intro.out{opacity:0;pointer-events:none}
#intro .dust{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#intro .p{position:absolute;bottom:-4%;border-radius:50%;background:#ef4444;box-shadow:0 0 6px #ef4444;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-110vh);opacity:0}}
#intro .spark{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#ef4444;box-shadow:0 0 40px 22px rgba(239,68,68,.45);opacity:0;animation:sparkIn .6s .05s forwards,sparkOut .5s 1.3s forwards}
@keyframes sparkIn{to{opacity:1}}
@keyframes sparkOut{to{opacity:0}}
#intro .stage{position:absolute;inset:0;perspective:1000px;--D:min(72vw,58vh,340px);--fs:min(30vw,112px)}
#intro .gw{position:absolute;left:50%;top:50%;width:var(--D);height:var(--D);margin:calc(var(--D) / -2) 0 0 calc(var(--D) / -2);transform-style:preserve-3d;animation:gIn .9s .2s cubic-bezier(.2,.8,.2,1) both,gOut .6s 3s forwards}
@keyframes gIn{from{opacity:0;transform:scale(.35) rotateX(30deg)}to{opacity:1;transform:none}}
@keyframes gOut{to{opacity:0;transform:scale(1.12)}}
#intro .glow{position:absolute;inset:-40%;border-radius:50%;background:radial-gradient(circle,rgba(239,68,68,.38) 0%,rgba(239,68,68,.12) 40%,transparent 62%);opacity:0;animation:glowIn 1.2s .2s forwards}
@keyframes glowIn{to{opacity:1}}
#intro .globe{position:absolute;inset:0;border-radius:50%;overflow:hidden;isolation:isolate;transform:translateZ(0);background:radial-gradient(circle at 50% 50%,#120000 0%,#050505 60%,#000 100%);box-shadow:inset -18px -26px 50px #000,0 0 60px rgba(220,38,38,.35)}
#intro .map{position:absolute;top:0;left:0;width:400%;height:100%;will-change:transform;animation:spin 2s .2s cubic-bezier(.25,.1,.25,1) both}
@keyframes spin{from{transform:translate3d(0,0,0)}to{transform:translate3d(-75%,0,0)}}
#intro .map svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 3px rgba(239,68,68,.8))}
#intro .shade{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.22) 0%,transparent 26%),radial-gradient(circle at 50% 50%,transparent 52%,rgba(0,0,0,.9) 100%)}
#intro .ring{position:absolute;left:-25%;top:-25%;width:150%;height:150%;border-radius:50%;border:2px solid rgba(239,68,68,.9);box-shadow:0 0 12px #ef4444,0 0 28px rgba(239,68,68,.35),inset 0 0 10px rgba(239,68,68,.35);opacity:0}
#intro .ring::after{content:"";position:absolute;top:-6px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #ef4444,0 0 22px #ef4444}
#intro .r1{animation:ringIn .6s 1s forwards,orbA 6s 1s linear infinite}
#intro .r2{animation:ringIn .6s 1.1s forwards,orbB 8s 1.1s linear infinite}
#intro .r3{animation:ringIn .6s 1.2s forwards,orbC 10s 1.2s linear infinite}
@keyframes ringIn{to{opacity:1}}
@keyframes orbA{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes orbB{from{transform:rotateX(64deg) rotateY(40deg) rotateZ(0)}to{transform:rotateX(64deg) rotateY(40deg) rotateZ(-360deg)}}
@keyframes orbC{from{transform:rotateX(82deg) rotateY(-28deg) rotateZ(0)}to{transform:rotateX(82deg) rotateY(-28deg) rotateZ(360deg)}}
#intro .burst{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,transparent 56%,rgba(239,68,68,.95) 64%,rgba(239,68,68,.25) 72%,transparent 78%);transform:scale(.2);opacity:0;animation:burst .9s 1.9s ease-out forwards}
@keyframes burst{0%{transform:scale(.2);opacity:0}25%{opacity:1}100%{transform:scale(1.5);opacity:0}}
#intro .lockup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.22em;transform-style:preserve-3d}
#intro .row{display:flex;align-items:center;gap:.03em;font-size:var(--fs);line-height:1}

  btn.disabled=true; btn.classList.add("busy");
  btn.innerHTML='<span class="spin"></span>Загрузка...';
  try{
    await fn();
    btn.classList.remove("busy");
    if(doneCls) btn.classList.add(doneCls);
    btn.innerHTML="✓ "+label;
    return true;
  }catch(e){
    btn.classList.remove("busy"); btn.classList.add("fail");
    btn.innerHTML="✕ "+label;
    toast(e.message||"Ошибка","err");
    setTimeout(()=>{ btn.disabled=false; btn.classList.remove("fail"); btn.innerHTML=label; },1600);
    return false;
  }
}

async function toDataUrl(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=0.7, out=c.toDataURL("image/jpeg",q);
    while(out.length>330000&&q>0.3){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
    if(out.length>330000) throw new Error("Фото слишком большое");
    return out;
  }finally{ URL.revokeObjectURL(url); }
}
async function toJpegBlob(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Не удалось сжать фото")),"image/jpeg",q));
  }finally{ URL.revokeObjectURL(url); }
}
async function saveAvatar(file){
  const blob=await toJpegBlob(file,512,0.85);
  const path=`${user.id}/avatar_${Date.now()}.jpg`;
  const {error}=await db.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});
  if(error) throw new Error(error.message);
  const url=db.storage.from("avatars").getPublicUrl(path).data.publicUrl;
  const {data,error:e2}=await db.auth.updateUser({data:{avatar:url}});

  user=data.user;
}
function dayKey(t){ const d=new Date(t); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dayLabel(t){
  const d=new Date(t), now=new Date(), y=new Date(); y.setDate(now.getDate()-1);
  if(dayKey(t)===dayKey(now)) return "Сегодня";
  if(dayKey(t)===dayKey(y)) return "Вчера";
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
}
function withDays(list,render){
  let last="", out="";
  list.forEach(m=>{
    const k=dayKey(m.created_at);
    if(k!==last){ out+=`<div class="dsep">${dayLabel(m.created_at)}</div>`; last=k; }
    out+=render(m);
  });
  return out;
}

      const c=document.createElement("canvas"); c.width=9; c.height=8;
      const x=c.getContext("2d"); x.drawImage(im,0,0,9,8);
      const d=x.getImageData(0,0,9,8).data;
      const g=k=>0.299*d[k]+0.587*d[k+1]+0.114*d[k+2];
      let bits="";
      for(let y=0;y<8;y++) for(let i=0;i<8;i++) bits+=g((y*9+i)*4)>g((y*9+i+1)*4)?"1":"0";
      res(BigInt("0b"+bits).toString(16).padStart(16,"0"));
    };
    im.onerror=()=>rej(new Error("image"));
    im.src=src;
  });
}
function hamming(a,b){
  let x=BigInt("0x"+a)^BigInt("0x"+b), n=0;
  while(x>0n){ n+=Number(x&1n); x>>=1n; }
  return n;
}
async function photoSearch(file){
  const list=$("#list"), info=$("#info"); if(!file||!list) return;
  info.textContent="Ищем похожие товары...";
  let qh;
  try{
    const u=URL.createObjectURL(file);
    qh=await dhash(u);
    URL.revokeObjectURL(u);
  }catch(e){ info.textContent="Не удалось прочитать фото. Попробуйте другое."; return; }
  const {data,error}=await db.rpc("photo_candidates");
  if(!$("#list")) return;
  if(error){ info.textContent="Ошибка: "+error.message; return; }
  const ranked=(data||[]).filter(p=>p.img_hash).map(p=>({p,d:hamming(qh,p.img_hash)}))
    .sort((a,b)=>(b.p.tier||0)-(a.p.tier||0)||a.d-b.d).slice(0,12);
  info.textContent=ranked.length?"Похожие товары:":"Похожих товаров не найдено";
  list.innerHTML=ranked.map(x=>card(x.p)).join("");
}

  e.preventDefault();
  const t=$("#ctxt"), body=t.value.trim();
  if(!body&&!CHAT.photo){ $("#cerr").textContent="Напишите сообщение или прикрепите фото."; return; }
  const btn=$("#csend");
  const ok=await act(btn,async()=>{
    const {error}=await db.rpc("send_buyer_message",{p_thread:CHAT.tid,p_body:body,p_attach:CHAT.photo});
    if(error) throw new Error(error.message);
  },"ok");
  if(ok){ t.value=""; clearChatPhoto(); }
  setTimeout(()=>{ btn.disabled=false; btn.classList.remove("ok"); btn.innerHTML="➤"; },500);
  await loadChat(true);
}

function setAuth(m){ location.hash=m==="reg"?"#/register":"#/profile"; }

  setNav("prof");
  if(user) return accountView();
  REG_AV=null;
  $("#app").innerHTML=`<section>
    <div class="seg">

      ${isReg?`
        <input id="un" placeholder="Ник (имя пользователя)" oninput="clearF('un')" onchange="checkUn()">
        <div class="ferr" data-for="un"></div>
        <p class="hint">Ник виден продавцам. Email и другие данные никому не показываются.</p>
        <label class="addph">📷 Фото профиля (необязательно)
          <input type="file" accept="image/*" style="display:none" onchange="pickRegAvatar(this.files[0])">
        </label>
        <div class="muted" id="avName"></div>`:""}
      <input id="em" type="email" placeholder="Email" oninput="clearF('em')">
      <div class="ferr" data-for="em"></div>

        <div class="ferr" data-for="agree"></div>
        <button class="btn" data-label="Зарегистрироваться" onclick="doReg(this)">Зарегистрироваться</button>`
        :`<button class="btn" data-label="Войти" onclick="doLogin(this)">Войти</button>
          <p><button class="link" onclick="resetPw()">Забыли пароль?</button></p>`}
      <p id="authMsg" class="err"></p>

function pickRegAvatar(f){
  if(!f) return;
  REG_AV=f;
  const n=$("#avName"); if(n) n.textContent="Фото выбрано: "+f.name;
}
async function checkUn(){
  const un=($("#un")?.value||"").trim();
  if(un.length<3) return;
  const {data}=await db.rpc("username_taken",{p:un});
  if(data) ferr("un","Этот ник уже занят");
}
async function doReg(btn){
  clearAll();
  const un=($("#un").value||"").trim(), em=($("#em").value||"").trim();
  const pw=$("#pw").value, pw2=$("#pw2").value;
  let ok=true;
  if(un.length<3||/\s/.test(un)){ ferr("un","Ник: минимум 3 символа, без пробелов"); ok=false; }
  if(!/^\S+@\S+\.\S+$/.test(em)){ ferr("em","Введите правильный email"); ok=false; }
  if(pw.length<6){ ferr("pw","Пароль: минимум 6 символов"); ok=false; }
  if(pw2!==pw){ ferr("pw2","Пароли не совпадают"); ok=false; }
  if(!$("#agree").checked){ ferr("agree","Нужно согласие с политикой"); ok=false; }
  if(!ok){ toast("Исправьте отмеченные поля","err"); return; }
  let note="";
  const done=await act(btn,async()=>{
    const {data:taken}=await db.rpc("username_taken",{p:un});
    if(taken){ ferr("un","Этот ник уже занят"); throw new Error("Ник занят"); }
    const {data,error}=await db.auth.signUp({email:em,password:pw,options:{data:{username:un,role:"buyer"}}});
    if(error){
      if(/already/i.test(error.message)){ ferr("em","Этот email уже зарегистрирован. Нажмите «Войти»."); throw new Error("Email уже зарегистрирован"); }
      throw new Error(error.message);
    }
    if(data.session){
      user=data.user;
      if(REG_AV){ try{ await saveAvatar(REG_AV); }catch(e){ note="Фото не сохранено: "+e.message; } }
    } else {
      note="Аккаунт создан. Подтвердите email и войдите. Фото можно добавить в профиле.";
    }
  },"ok");
  if(done){
    if(user){ toast("Добро пожаловать, "+un+"!","ok"); go("#/profile"); }
    else { setAuth("login"); const m=$("#authMsg"); if(m) m.textContent=note; }
  }
}
async function doLogin(btn){
  clearAll();
  const em=($("#em").value||"").trim(), pw=$("#pw").value;
  let ok=true;
  if(!em){ ferr("em","Введите email"); ok=false; }
  if(!pw){ ferr("pw","Введите пароль"); ok=false; }
  if(!ok) return;
  const done=await act(btn,async()=>{
    const {data,error}=await db.auth.signInWithPassword({email:em,password:pw});
    if(error){
      ferr("em","Неверный пароль или неверный email");
      ferr("pw","Неверный пароль или неверный email");
      throw new Error("Неверный пароль или неверный email");
    }
    user=data.user;
  },"ok");
  if(done) go("#/profile");
}
async function resetPw(){
  clearAll();
  const em=($("#em").value||"").trim();
  if(!/^\S+@\S+\.\S+$/.test(em)){ ferr("em","Сначала введите email"); return; }
  const {error}=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  const m=$("#authMsg");
  m.className=error?"err":"okt";
  m.textContent=error?error.message:"Ссылка для нового пароля отправлена на "+em+". Проверьте почту и папку «Спам».";
}

async function avatarChange(file){
  if(!file) return;
  try{
    await saveAvatar(file);
    toast("Фото профиля сохранено","ok");
    accountView();
  }catch(err){ toast("Ошибка: "+err.message,"err"); }
}
async function changePw(btn){
  const p=$("#npw").value;
  if(p.length<6){ ferr("npw","Минимум 6 символов"); return; }
  await act(btn,async()=>{
    const {error}=await db.auth.updateUser({password:p});
    if(error) throw new Error(error.message);
  },"ok");
  const i=$("#npw"); if(i) i.value="";
}
async function doLogout(){
  await db.auth.signOut();
  user=null;
  setBadges(0);
  toast("Вы вышли из аккаунта","ok");
  go("#/profile");
}

// ---------- ОПЕНИНГ ----------
function playIntro(){
  const el=$("#intro"); if(!el) return;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce||/type=recovery/.test(location.hash)){
    el.remove(); document.body.classList.remove("intro-on"); return;
  }
  const dust=el.querySelector(".dust");
  for(let i=0;i<18;i++){
    const s=document.createElement("span");
    s.className="p";
    const size=2+Math.random()*3;
    s.style.left=(Math.random()*100)+"%";
    s.style.width=s.style.height=size+"px";
    s.style.animationDelay=(Math.random()*3)+"s";
    s.style.animationDuration=(3.2+Math.random()*2)+"s";
    dust.appendChild(s);
  }
  let ended=false;
  const finish=()=>{
    if(ended) return; ended=true;
    el.classList.add("out");
    setTimeout(()=>{ el.remove(); document.body.classList.remove("intro-on"); },650);
  };
  el.addEventListener("click",finish);
  setTimeout(finish,4300);
}

// ---------- СТАРТ ----------
playIntro();
init();
