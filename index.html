<script>
const SB_URL="https://fwvvnzrprjffsmkpvhrl.supabase.co";
const SB_KEY="sb_publishable_wJYMx4Gs-NlZXUBFedcVaQ_H30wRYUz";
const SITE_URL=location.origin+location.pathname;
const REQUISITES="Перевод на карту: [НОМЕР КАРТЫ] или СБП: [НОМЕР ТЕЛЕФОНА]. Получатель: [ВАШЕ ИМЯ]";
const STATUS={draft:"Черновик",awaiting_payment:"Оплатить 25 ₽",pending_review:"На проверке",published:"Опубликован",rejected:"Отклонён"};

const db=supabase.createClient(SB_URL,SB_KEY);
let user=null,isAdmin=false,recovery=false,ready=false;
let CATS=[],COUNTRIES=[],CITIES=[],PENDING=0,TIMER=null;
let FILTER={cat:null,country:null,city:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const go=h=>{ if(location.hash===h) route(); else location.hash=h; };
const ERR=[
  ["already registered","Этот email уже зарегистрирован. Нажмите «Войти» или «Забыли пароль?»."],
  ["Invalid login credentials","Неверный email или пароль."],
  ["Email not confirmed","Email не подтверждён. Обратитесь к владельцу сайта."],
  ["at least 6","Пароль должен быть не короче 6 символов."],
  ["For security purposes","Слишком частые запросы. Подождите минуту и попробуйте снова."],
  ["rate limit","Слишком много писем. Попробуйте позже."]
];
const errText=e=>{const m=e?.message||"";const f=ERR.find(([k])=>m.includes(k));return f?f[1]:"Ошибка: "+m;};
window.addEventListener("hashchange",()=>route());

// Избранное и корзина хранятся в браузере покупателя, регистрация не нужна
const favs=()=>{ try{ return JSON.parse(localStorage.getItem("opt_fav")||"[]"); }catch(e){ return []; } };
const setFavs=a=>{ try{ localStorage.setItem("opt_fav",JSON.stringify(a)); }catch(e){} };
const cart=()=>{ try{ return JSON.parse(localStorage.getItem("opt_cart")||"{}"); }catch(e){ return {}; } };
const setCart=o=>{ try{ localStorage.setItem("opt_cart",JSON.stringify(o)); }catch(e){} };

// ---------- ОТПЕЧАТОК ФОТО (для поиска по камере) ----------
const gray=(d,k)=>0.299*d[k]+0.587*d[k+1]+0.114*d[k+2];
function loadImg(src){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.crossOrigin="anonymous";
    im.onload=()=>res(im);
    im.onerror=()=>rej(new Error("image"));
    im.src=src;
  });
}
async function dhash(src){
  const im=await loadImg(src);
  const c=document.createElement("canvas");
  c.width=9; c.height=8;
  const x=c.getContext("2d");
  x.drawImage(im,0,0,9,8);
  const d=x.getImageData(0,0,9,8).data;
  let bits="";
  for(let y=0;y<8;y++) for(let i=0;i<8;i++){
    const a=gray(d,(y*9+i)*4), b=gray(d,(y*9+i+1)*4);
    bits+=a>b?"1":"0";
  }
  return BigInt("0b"+bits).toString(16).padStart(16,"0");
}
function hamming(h1,h2){
  let x=BigInt("0x"+h1)^BigInt("0x"+h2), n=0;
  while(x>0n){ n+=Number(x&1n); x>>=1n; }
  return n;
}

// ---------- СТАРТ И СЕССИЯ ----------
async function init(){
  const h=location.hash;
  if(h.includes("type=recovery")) recovery=true;
  db.auth.onAuthStateChange((event,session)=>{
    user=session?.user||null;
    if(event==="PASSWORD_RECOVERY"){ recovery=true; recoveryView(); return; }
    setTimeout(async()=>{ await checkAdmin(); renderNav(); },0);
  });
  const {data}=await db.auth.getSession();
  user=data.session?.user||null;
  await checkAdmin();
  renderNav();
  ready=true;
  if(recovery) return recoveryView();
  if(h.includes("error_code")){
    history.replaceState(null,"",location.pathname+"#/login");
    loginView();
    $("#msg").textContent="Ссылка недействительна или устарела. Запросите новую.";
    return;
  }
  route();
}
async function checkAdmin(){
  isAdmin=false;
  if(!user) return;
  const {data}=await db.from("admins").select("user_id").eq("user_id",user.id);
  isAdmin=!!(data&&data.length);
}
function renderNav(){
  let right;
  if(!user) right=`<a href="#/login">Войти</a>`;
  else if(isAdmin) right=`<a href="#" onclick="logout();return false">Выход</a>`;
  else right=`<a href="#/cabinet">Кабинет</a><a href="#" onclick="logout();return false">Выход</a>`;
  $("#nav").innerHTML=right;
  updateBadge();
}
function updateBadge(){
  const n=Object.keys(cart()).length;
  const el=$("#cartn");
  if(el) el.textContent=n||"";
}
async function logout(){
  await db.auth.signOut();
  user=null; isAdmin=false; PENDING=0;
  clearInterval(TIMER);
  renderNav();
  go("#/");
}
function route(){
  if(!ready||recovery) return;
  const [,page,arg]=(location.hash||"#/").split("/");
  closeCats();
  document.body.classList.toggle("is-admin",page==="admin");
  // Админ-панель: только по линку #/admin и только для админа
  if(page==="admin"){
    if(!user) return loginView();
    return isAdmin?adminView():go("#/");
  }
  if(page==="login") return user?go(isAdmin?"#/admin":"#/cabinet"):loginView();
  if(page==="cabinet") return !user?go("#/login"):(isAdmin?go("#/admin"):cabinetView());
  if(page==="sell"){
    if(!user) return go("#/login");
    if(isAdmin) return sellView(!arg||arg==="new"?"admin":arg);
    if(arg==="admin") return go("#/cabinet");
    return sellView(arg||"new");
  }
  if(page==="pay") return !user?go("#/login"):payView(arg);
  if(page==="product") return productView(arg);
  if(page==="search") return searchView();
  if(page==="cart") return cartView();
  return homeView();
}

// ---------- КАТЕГОРИИ, СТРАНЫ, ГОРОДА ----------
async function loadRefs(){
  const [{data:cats},{data:countries},{data:cities}]=await Promise.all([
    db.from("categories").select("*").order("name"),
    db.from("countries").select("*").order("name"),
    db.from("cities").select("*").order("name")
  ]);
  CATS=cats||[]; COUNTRIES=countries||[]; CITIES=cities||[];
}
function treeOrder(list){
  const byParent={};
  list.forEach(c=>{ const k=c.parent_id??"root"; (byParent[k]??=[]).push(c); });
  const out=[];
  const walk=(pid,d)=>(byParent[pid]||[]).forEach(c=>{ out.push({c,d}); walk(c.id,d+1); });
  walk("root",0);
  return out;
}
function catOptions(list,sel,leafOnly){
  const items=treeOrder(list||[]);
  const hasKids=id=>items.some(x=>x.c.parent_id===id);
  return items.filter(x=>!leafOnly||!hasKids(x.c.id))
    .map(({c,d})=>`<option value="${c.id}" ${c.id==sel?"selected":""}>${"— ".repeat(d)}${esc(c.name)}</option>`).join("");
}
function countryOptions(sel){
  return COUNTRIES.map(k=>`<option value="${k.id}" ${k.id==sel?"selected":""}>${esc(k.name)}</option>`).join("");
}
function cityOptions(countryId,sel){
  return CITIES.filter(c=>!countryId||c.country_id==countryId)
    .map(c=>`<option value="${c.id}" ${c.id==sel?"selected":""}>${esc(c.name)}</option>`).join("");
}
function descIds(id){
  const out=[+id];
  const walk=pid=>CATS.filter(c=>c.parent_id===pid).forEach(c=>{ out.push(c.id); walk(c.id); });
  walk(+id);
  return out;
}
function isDescendant(x,anc){
  let cur=CATS.find(c=>c.id===x);
  for(let i=0;cur&&i<50;i++){
    if(cur.parent_id===anc) return true;
    cur=CATS.find(c=>c.id===cur.parent_id);
  }
  return false;
}
async function openCats(){
  await loadRefs();
  $("#sheetBox").innerHTML=`<h3>Категории</h3>`+treeOrder(CATS).map(({c,d})=>
    `<div class="cat-item" style="padding-left:${8+d*18}px" onclick="openCat(${c.id})">${esc(c.name)}</div>`).join("")
    +`<button class="s" onclick="closeCats()">Закрыть</button>`;
  $("#sheet").classList.add("open");
}
function closeCats(){ const s=$("#sheet"); if(s) s.classList.remove("open"); }
function openCat(id){
  closeCats();
  FILTER={cat:id,country:null,city:null};
  go("#/search");
}

// ---------- ГЛАВНАЯ ----------
async function homeView(){
  await loadRefs();
  const top=CATS.filter(c=>c.parent_id==null);
  $("#app").innerHTML=`
    <div class="search" onclick="go('#/search')">🔎 Поиск товара или фото</div>
    <h3>Категории</h3>
    <div class="tiles">${top.map(c=>`<div class="tile" onclick="openCat(${c.id})">${esc(c.name)}</div>`).join("")}</div>
    <h3>Новинки</h3>
    <div id="list" class="grid"></div>`;
  const {data}=await db.from("products").select("id,title,price,min_order,photos,cities(name)")
    .eq("status","published").order("created_at",{ascending:false}).limit(20);
  if(!$("#list")) return;
  const fv=favs(), cv=cart();
  $("#list").innerHTML=(data||[]).map(p=>card(p,fv,cv)).join("")||'<p class="muted">Товаров пока нет</p>';
}
function card(p,fv,cv){
  const liked=fv.includes(p.id), inCart=!!cv[p.id];
  return `<div class="card">
    <img src="${esc(p.photos?.[0]||"")}" onclick="go('#/product/${p.id}')" onerror="this.style.visibility='hidden'">
    <div class="ct" onclick="go('#/product/${p.id}')"><b>${esc(p.title)}</b></div>
    <div class="price">${p.price} ₽</div>
    <div class="muted">мин. ${p.min_order} шт · ${esc(p.cities?.name||"")}</div>
    <div class="acts">
      <button class="s" data-fav="${p.id}" onclick="toggleFav(${p.id})">${liked?"❤️":"🤍"} Нравится</button>
      <button class="s" data-cart="${p.id}" onclick="addCart(${p.id},${p.min_order})">${inCart?"В корзине ✓":"🛒 В корзину"}</button>
    </div>
  </div>`;
}

// ---------- ПОИСК (текст, фильтры, камера) ----------
async function searchView(){
  await loadRefs();
  $("#app").innerHTML=`
    <input id="q" placeholder="🔎 Название товара" oninput="runSearch()">
    <div class="cam">
      <label>📷 Найти похожий товар по фото</label>
      <input type="file" id="cam" accept="image/*" capture="environment" onchange="photoSearch(this.files[0])">
    </div>
    <select id="cat" onchange="runSearch()"><option value="">Все категории</option>${catOptions(CATS,FILTER.cat,false)}</select>
    <select id="country" onchange="onSearchCountry()"><option value="">Все страны</option>${countryOptions(FILTER.country)}</select>
    <select id="city" onchange="runSearch()"><option value="">Все города</option>${cityOptions(FILTER.country,FILTER.city)}</select>
    <p id="info" class="muted"></p>
    <div id="list" class="grid"></div>`;
  runSearch();
}
function onSearchCountry(){
  $("#city").innerHTML=`<option value="">Все города</option>${cityOptions($("#country").value||null,null)}`;
  runSearch();
}
async function runSearch(){
  if(!$("#list")) return;
  FILTER={cat:$("#cat").value||null,country:$("#country").value||null,city:$("#city").value||null};
  const q=$("#q").value.trim().replace(/[%,()*]/g,"");
  let req=db.from("products").select("id,title,price,min_order,photos,cities(name)")
    .eq("status","published").order("created_at",{ascending:false}).limit(60);
  if(q) req=req.ilike("title",`%${q}%`);
  if(FILTER.cat) req=req.in("category_id",descIds(FILTER.cat));
  if(FILTER.country) req=req.eq("country_id",FILTER.country);
  if(FILTER.city) req=req.eq("city_id",FILTER.city);
  const {data,error}=await req;
  if(!$("#list")) return;
  if(error){ $("#list").innerHTML="Ошибка: "+esc(error.message); return; }
  $("#info").textContent=(data||[]).length?"":"Товаров не найдено";
  const fv=favs(), cv=cart();
  $("#list").innerHTML=(data||[]).map(p=>card(p,fv,cv)).join("");
}
async function photoSearch(file){
  if(!file||!$("#list")) return;
  $("#info").textContent="Ищем похожие товары...";
  let qh;
  try{
    const u=URL.createObjectURL(file);
    qh=await dhash(u);
    URL.revokeObjectURL(u);
  }catch(e){
    $("#info").textContent="Не удалось прочитать фото. Попробуйте другое.";
    return;
  }
  FILTER={cat:$("#cat").value||null,country:$("#country").value||null,city:$("#city").value||null};
  let req=db.from("products").select("id,title,price,min_order,photos,img_hash,cities(name)").eq("status","published").limit(300);
  if(FILTER.cat) req=req.in("category_id",descIds(FILTER.cat));
  if(FILTER.country) req=req.eq("country_id",FILTER.country);
  if(FILTER.city) req=req.eq("city_id",FILTER.city);
  const {data,error}=await req;
  if(!$("#list")) return;
  if(error){ $("#info").textContent="Ошибка: "+error.message; return; }
  const items=data||[];
  // У старых товаров нет отпечатка: считаем его сейчас, если браузер разрешит
  await Promise.all(items.filter(p=>!p.img_hash&&p.photos?.length).slice(0,40).map(async p=>{
    try{ p.img_hash=await dhash(p.photos[0]); }catch(e){}
  }));
  const ranked=items.filter(p=>p.img_hash)
    .map(p=>({p,d:hamming(qh,p.img_hash)}))
    .sort((a,b)=>a.d-b.d).slice(0,12);
  $("#info").textContent=ranked.length?"Похожие товары (сверху самые похожие):":"Похожих товаров не найдено";
  const fv=favs(), cv=cart();
  $("#list").innerHTML=ranked.map(x=>card(x.p,fv,cv)).join("");
}

// ---------- ИЗБРАННОЕ, КОРЗИНА, ТОВАР ----------
function toggleFav(id){
  let a=favs();
  a=a.includes(id)?a.filter(x=>x!==id):[...a,id];
  setFavs(a);
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{ b.innerHTML=(a.includes(id)?"❤️":"🤍")+" Нравится"; });
}
function addCart(id,min){
  const c=cart();
  if(!c[id]) c[id]=+min||1;
  setCart(c);
  document.querySelectorAll(`[data-cart="${id}"]`).forEach(b=>{ b.innerHTML="В корзине ✓"; });
  renderNav();
}
function igLink(h){
  const u=String(h).trim().replace(/^(https?:\/\/)?(www\.)?instagram\.com\//,"").replace(/^@/,"").replace(/\/$/,"");
  return u?"https://instagram.com/"+encodeURIComponent(u):"";
}
async function productView(id){
  const {data:p}=await db.from("products").select("*,cities(name),countries(name),categories(name)").eq("id",id).maybeSingle();
  if(!p){ $("#app").innerHTML='<p class="muted">Товар не найден или недоступен.</p>'; return; }
  const fv=favs(), cv=cart();
  const ig=igLink(p.instagram||"");
  $("#app").innerHTML=`
    <div class="gal">${(p.photos||[]).map(u=>`<img src="${esc(u)}">`).join("")}</div>
    <h2>${esc(p.title)}</h2>
    <div class="price">${p.price} ₽ за штуку</div>
    <p>Минимальный заказ: ${p.min_order} шт</p>
    <p class="muted">${esc(p.countries?.name||"")} · ${esc(p.cities?.name||"")} · ${esc(p.categories?.name||"")}</p>
    <p class="desc">${esc(p.description||"")}</p>
    <div class="acts">
      <button class="s" data-fav="${p.id}" onclick="toggleFav(${p.id})">${fv.includes(p.id)?"❤️":"🤍"} Нравится</button>
      <button class="s" data-cart="${p.id}" onclick="addCart(${p.id},${p.min_order})">${cv[p.id]?"В корзине ✓":"🛒 В корзину"}</button>
    </div>
    <h3>Продавец</h3>
    ${p.seller_phone?`<a href="tel:${esc(p.seller_phone)}"><button>Позвонить: ${esc(p.seller_phone)}</button></a>`:""}
    ${p.seller_email?`<a href="mailto:${esc(p.seller_email)}"><button>Написать на email</button></a>`:""}
    ${ig?`<a href="${esc(ig)}" target="_blank" rel="noopener"><button>Instagram</button></a>`:""}`;
}
async function cartView(){
  const cv=cart(), fv=favs();
  const ids=[...new Set([...Object.keys(cv).map(Number),...fv])];
  let items=[];
  if(ids.length){
    const {data}=await db.from("products").select("id,title,price,min_order,photos,cities(name)").in("id",ids).eq("status","published");
    items=data||[];
  }
  const inCart=items.filter(p=>cv[p.id]);
  const liked=items.filter(p=>fv.includes(p.id));
  const total=inCart.reduce((s,p)=>s+p.price*cv[p.id],0);
  $("#app").innerHTML=`
    <h2>Корзина</h2>
    ${inCart.map(p=>`
      <div class="row">
        <div><b>${esc(p.title)}</b><div class="muted">${p.price} ₽ за штуку · мин. ${p.min_order} шт</div>

      </div>`).join("")||'<p class="muted">Корзина пуста</p>'}

function setQty(id,val,min){
  const c=cart();

}
function removeCart(id){
  const c=cart(); delete c[id]; setCart(c); renderNav(); cartView();
}

       <input id="files" type="file" accept="image/*" multiple>`;

    <select id="c_country" onchange="onCountryChange()"><option value="">Выберите страну</option>${countryOptions(p.country_id)}</select>
    <select id="c_city"><option value="">Выберите город</option>${p.country_id?cityOptions(p.country_id,p.city_id):""}</select>

function onCountryChange(){
  const k=$("#c_country").value;
  $("#c_city").innerHTML=`<option value="">Выберите город</option>${k?cityOptions(k,null):""}`;
}
async function uploadFiles(files,bucket,folder){
  const out=[];
  for(const [i,f] of files.entries()){
    const path=`${folder}/${Date.now()}_${i}.jpg`;
    const {error}=await db.storage.from(bucket).upload(path,f,{contentType:f.type||"image/jpeg"});
    if(error) throw new Error(error.message);
    out.push(path);
  }
  return out;
}
async function saveProduct(id,minPhotos,curStatus,back,isCatalog){
  const msg=$("#msg");
  const title=$("#t").value.trim(), desc=$("#d").value.trim();
  const cat=+$("#c").value, country=+$("#c_country").value, city=+$("#c_city").value;
  const price=+$("#pr").value, min=+$("#mo").value;
  const phone=$("#ph").value.trim(), email=$("#em2").value.trim(), ig=$("#ig").value.trim();
  const files=$("#files")?[...$("#files").files]:[];
  if(!title||!price||!min||!cat||!country||!city){ msg.textContent="Заполните название, категорию, страну, город, цену и минимальный заказ."; return; }
  if(!phone&&!email){ msg.textContent="Укажите телефон или email для связи."; return; }
  const isNewItem=id==="new"||id==="admin";
  if((isNewItem||files.length)&&(files.length<minPhotos||files.length>6)){ msg.textContent=`Фото: от ${minPhotos} до 6.`; return; }
  msg.textContent="Сохраняем...";
  try{
    const row={title,description:desc,category_id:cat,country_id:country,city_id:city,price,min_order:min,
      seller_phone:phone||null,seller_email:email||null,instagram:ig||null};
    if(files.length){
      if(isCatalog){
        const paths=await uploadFiles(files,"product-photos",user.id);
        row.photos=paths.map(pt=>db.storage.from("product-photos").getPublicUrl(pt).data.publicUrl);
        try{ row.img_hash=await dhash(URL.createObjectURL(files[0])); }catch(e){ row.img_hash=null; }
      } else {
        row.draft_photos=await uploadFiles(files,"product-drafts",user.id);
      }
    }
    if(isNewItem){
      if(isCatalog){ row.seller_id=null; row.status="published"; }
      else { row.seller_id=user.id; row.status="awaiting_payment"; }
      const {data,error}=await db.from("products").insert(row).select().single();
      if(error) throw new Error(error.message);
      return go(isCatalog?"#/admin":"#/pay/"+data.id);
    }
    if(curStatus==="rejected") row.status="awaiting_payment";
    let oldDrafts=[];
    if(row.draft_photos){
      const {data:old}=await db.from("products").select("draft_photos").eq("id",id).maybeSingle();
      oldDrafts=old?.draft_photos||[];
    }
    const {error}=await db.from("products").update(row).eq("id",id);
    if(error) throw new Error(error.message);
    if(oldDrafts.length) await db.storage.from("product-drafts").remove(oldDrafts);
    const toPay=curStatus==="rejected"||curStatus==="awaiting_payment";
    go(toPay&&!isCatalog?"#/pay/"+id:back);
  }catch(err){
    msg.textContent="Ошибка: "+err.message;
  }
}

async function loadModeration(){
  const {data,error}=await db.from("payments")
    .select("id,receipt_url,products(id,title,price,min_order,instagram,seller_phone,seller_email,draft_photos,cities(name),countries(name),categories(name))")
    .eq("status","pending").order("created_at");
  if(!$("#mod")) return;
  if(error){ $("#mod").innerHTML="Ошибка: "+esc(error.message); return; }
  const list=(data||[]).filter(x=>x.products);
  PENDING=list.length;
  document.title=PENDING?`(${PENDING}) Оптовый маркетплейс`:"Оптовый маркетплейс";
  if(!list.length){ $("#mod").innerHTML='<p class="muted">Новых заявок нет</p>'; return; }
  const rows=await Promise.all(list.map(async x=>{
    const p=x.products;
    const {data:rc}=await db.storage.from("receipts").createSignedUrl(x.receipt_url,3600);
    let photos=[];
    if(p.draft_photos&&p.draft_photos.length){
      const {data:ds}=await db.storage.from("product-drafts").createSignedUrls(p.draft_photos,3600);
      photos=(ds||[]).map(d=>d.signedUrl).filter(Boolean);
    }
    return `<div class="card box">
      <b>${esc(p.title)}</b> · ${p.price} ₽ · мин. ${p.min_order} шт
      <div class="muted">${esc(p.countries?.name||"")}, ${esc(p.cities?.name||"")} · ${esc(p.categories?.name||"")}</div>
      <div class="muted">Тел: ${esc(p.seller_phone||"—")} · Email: ${esc(p.seller_email||"—")}${p.instagram?` · Instagram: ${esc(p.instagram)}`:""}</div>
      <div class="gal" style="margin:6px 0">${photos.map(u=>`<img src="${esc(u)}" style="flex:0 0 40%;height:120px">`).join("")}</div>
      <a href="${esc(rc?.signedUrl||"#")}" target="_blank" rel="noopener">Открыть чек (25 ₽)</a>
      <div style="margin-top:8px">
        <button onclick="approve(${x.id},${p.id})">Опубликовать</button>
        <button class="s" onclick="reject(${x.id},${p.id})">Отклонить</button>
      </div>
    </div>`;
  }));
  $("#mod").innerHTML=rows.join("");
}
async function approve(payId,prodId){
  try{
    const {data:p,error:e0}=await db.from("products").select("id,draft_photos").eq("id",prodId).maybeSingle();
    if(e0||!p) throw new Error(e0?.message||"товар не найден");
    const drafts=p.draft_photos||[];
    if(!drafts.length) throw new Error("у товара нет фото");
    const urls=[]; let hash=null;
    for(const [i,path] of drafts.entries()){
      const {data:blob,error:e1}=await db.storage.from("product-drafts").download(path);
      if(e1||!blob) throw new Error(e1?.message||"фото не найдено");
      if(i===0){ try{ hash=await dhash(URL.createObjectURL(blob)); }catch(e){ hash=null; } }
      const np=`${user.id}/${Date.now()}_${i}.jpg`;
      const {error:e2}=await db.storage.from("product-photos").upload(np,blob,{contentType:blob.type||"image/jpeg"});
      if(e2) throw new Error(e2.message);
      urls.push(db.storage.from("product-photos").getPublicUrl(np).data.publicUrl);
    }
    const {error:e3}=await db.from("products").update({photos:urls,draft_photos:[],status:"published",img_hash:hash}).eq("id",prodId);
    if(e3) throw new Error(e3.message);
    const {error:e4}=await db.from("payments").update({status:"confirmed"}).eq("id",payId);
    if(e4) throw new Error(e4.message);
    await db.storage.from("product-drafts").remove(drafts);
    alert("Товар опубликован.");
    loadModeration();
  }catch(err){
    alert("Ошибка: "+err.message);
  }
}
async function reject(payId,prodId){
  const {error:e1}=await db.from("payments").update({status:"rejected"}).eq("id",payId);
  const {error:e2}=await db.from("products").update({status:"rejected"}).eq("id",prodId);
  if(e1||e2) alert("Ошибка: "+((e1||e2).message));
  loadModeration();
}

  $("#cat-"+id).outerHTML=`
    <div class="card box" id="cat-${id}">
      <input id="ecn-${id}" value="${esc(c.name)}">
      <select id="epc-${id}">
        <option value="" ${c.parent_id==null?"selected":""}>— корневая категория —</option>
        ${catOptions(options,c.parent_id,false)}
      </select>
      <button onclick="saveCat(${id})">Сохранить</button>
      <button class="s" onclick="loadTaxonomy()">Отмена</button>
    </div>`;
}
async function saveCat(id){
  const name=$("#ecn-"+id).value.trim();
  const pid=$("#epc-"+id).value;
  if(!name) return alert("Введите название");
  const {error}=await db.from("categories").update({name,parent_id:pid?+pid:null}).eq("id",id);
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function delCat(id){
  if(!confirm("Удалить категорию вместе с вложенными?")) return;
  const {error}=await db.from("categories").delete().eq("id",id);
  if(error) return alert("Нельзя удалить: "+error.message);
  loadTaxonomy();
}
async function addCountry(){
  const name=$("#kn").value.trim(); if(!name) return;
  const {error}=await db.from("countries").insert({name});
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function editCountry(id){
  const k=COUNTRIES.find(x=>x.id===id);
  const name=prompt("Новое название страны",k?k.name:"");
  if(!name||!name.trim()) return;
  const {error}=await db.from("countries").update({name:name.trim()}).eq("id",id);
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function delCountry(id){
  if(!confirm("Удалить страну? Это невозможно, если в ней есть города или товары.")) return;
  const {error}=await db.from("countries").delete().eq("id",id);
  if(error) return alert("Нельзя удалить: "+error.message);
  loadTaxonomy();
}
async function addCity(){
  const name=$("#ctn").value.trim(), cid=+$("#cc").value;
  if(!name||!cid) return alert("Выберите страну и введите город");
  const {error}=await db.from("cities").insert({name,country_id:cid});
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function editCity(id){
  const c=CITIES.find(x=>x.id===id);
  const name=prompt("Новое название города",c?c.name:"");
  if(!name||!name.trim()) return;
  const {error}=await db.from("cities").update({name:name.trim()}).eq("id",id);
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function delCity(id){
  if(!confirm("Удалить город?")) return;
  const {error}=await db.from("cities").delete().eq("id",id);
  if(error) return alert("Нельзя удалить: "+error.message);
  loadTaxonomy();
}

init();
</script>
