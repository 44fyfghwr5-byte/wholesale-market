const store={
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

  try{

    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.07);
  }catch(e){}
}

async function act(btn,fn,doneCls){
  if(!btn||btn.disabled) return false;
  const label=btn.dataset.label||btn.textContent.trim();
  btn.dataset.label=label;
  btn.disabled=true; btn.classList.add("busy");
  btn.innerHTML='<span class="spin"></span>Загрузка...';
  try{
    await fn();

    if(doneCls) btn.classList.add(doneCls);

  }catch(e){

    setTimeout(()=>{ btn.disabled=false; btn.classList.remove("fail"); btn.innerHTML=label; },1600);

async function toDataUrl(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=0.7, out=c.toDataURL("image/jpeg",q);
    while(out.length>330000&&q>0.3){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
    if(out.length>330000) throw new Error("Фото слишком большое");
    return out;
  }finally{ URL.revokeObjectURL(url); }
}
async function toJpegBlob(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Не удалось сжать фото")),"image/jpeg",q));
  }finally{ URL.revokeObjectURL(url); }
}

function dhash(src){
  return new Promise((res,rej)=>{
    const im=new Image(); im.crossOrigin="anonymous";
    im.onload=()=>{
      const c=document.createElement("canvas"); c.width=9; c.height=8;
      const x=c.getContext("2d"); x.drawImage(im,0,0,9,8);
      const d=x.getImageData(0,0,9,8).data;
      const g=k=>0.299*d[k]+0.587*d[k+1]+0.114*d[k+2];
      let bits="";
      for(let y=0;y<8;y++) for(let i=0;i<8;i++) bits+=g((y*9+i)*4)>g((y*9+i+1)*4)?"1":"0";
      res(BigInt("0b"+bits).toString(16).padStart(16,"0"));
    };
    im.onerror=()=>rej(new Error("image"));
    im.src=src;
  });
}
function hamming(a,b){
  let x=BigInt("0x"+a)^BigInt("0x"+b), n=0;
  while(x>0n){ n+=Number(x&1n); x>>=1n; }
  return n;
}

  }catch(e){ info.textContent="Не удалось прочитать фото. Попробуйте другое."; return; }
  const {data,error}=await db.from("products").select("id,title,price,min_order,photos,img_hash,tier,cities(name)")

  info.textContent=ranked.length?"Похожие товары:":"Похожих товаров не найдено";

  }).join("");

  el.innerHTML=`
    <div class="sellerTop"><div class="cav">${ini(name)}</div>
      <div><b>${esc(name)}</b><div class="muted">★ ${s.avg_stars} · отзывов: ${s.cnt}</div></div></div>
    <div class="muted">Телефон продавца</div>
    <div class="phone" id="phoneTxt">${esc(CUR.phone)}</div>
    <div class="acts3">
      <button class="btn sm" data-label="📞 Позвонить" onclick="callSeller(this)">📞 Позвонить</button>
      <button class="btn sm n" onclick="chatWithSeller()">💬 Написать продавцу</button>
    </div>
    <h3>Оценка продавца</h3>
    <div class="starsRow">${stars}</div>
    <p class="muted" style="text-align:center">${user?(my?`Ваша оценка: ${my} ★. Нажмите другую звезду, чтобы изменить.`:"Нажмите звезду, чтобы оценить."):"Зарегистрируйтесь, чтобы оценить продавца."}</p>
    <div class="bars">${bars}</div>
    <h3>Комментарии (${(cm||[]).length})</h3>
    ${user
      ?`<textarea id="cmt" rows="2" placeholder="Ваш комментарий" maxlength="500"></textarea>
        <button class="btn sm" data-label="Отправить" onclick="sendComment(this)">Отправить</button>`
      :`<p class="muted">Комментировать могут только зарегистрированные пользователи. <button class="link" onclick="go('#/register')">Регистрация</button></p>`}
    <div id="cmlist">${comments}</div>`;
}
async function rateSeller(n){
  if(!user) return needAuth("Зарегистрируйтесь, чтобы поставить оценку");
  if(!CUR.sellerId) return;
  const {error}=await db.rpc("rate_seller",{p_seller:CUR.sellerId,p_stars:n});
  if(error) return toast(error.message,"err");
  toast("Спасибо за отзыв!","ok");
  loadSellerBlock();
}
async function sendComment(btn){
  const body=($("#cmt")?.value||"").trim();
  if(!body){ toast("Напишите комментарий","err"); return; }
  const ok=await act(btn,async()=>{
    const {error}=await db.rpc("add_seller_comment",{p_seller:CUR.sellerId,p_body:body});
    if(error) throw new Error(error.message);
  },"ok");
  if(ok){ toast("Спасибо за отзыв!","ok"); loadSellerBlock(); }
}
async function callSeller(btn){
  if(!user) return needAuth("Зарегистрируйтесь, чтобы увидеть номер продавца");
  if(CUR.phoneFull){ location.href="tel:"+CUR.phone; return; }
  let full="";
  const ok=await act(btn,async()=>{
    const {data,error}=await db.rpc("product_contact",{p_id:CUR.id});
    if(error) throw new Error(error.message);
    full=data?.[0]?.phone_full||"";
    if(!full) throw new Error("Номер не указан");
  },"ok");
  if(ok&&full){
    CUR.phone=full; CUR.phoneFull=true;
    $("#phoneTxt").textContent=full;
    btn.outerHTML=`<a class="btn sm ok" href="tel:${esc(full)}">📞 Позвонить</a>`;
  }
}
function chatWithSeller(){
  if(!user) return needAuth("Зарегистрируйтесь, чтобы написать продавцу");
  if(!CUR.sellerId){ location.href="./support/"; return; }
  go("#/chat/"+CUR.sellerId);
}
function openShare(){
  openSheet(`<h3>Поделиться товаром</h3>
    <textarea id="shc" rows="2" placeholder="Комментарий продавцу (необязательно)"></textarea>
    <button class="btn" onclick="shareToSeller()">💬 Отправить продавцу</button>
    <button class="btn n" onclick="shareLink()">🔗 Поделиться ссылкой</button>
    <button class="btn n" onclick="closeSheet()">Отмена</button>`);
}
function shareToSeller(){
  if(!user){ closeSheet(); return needAuth("Зарегистрируйтесь, чтобы написать продавцу"); }
  if(!CUR.sellerId){ closeSheet(); location.href="./support/"; return; }
  const c=($("#shc")?.value||"").trim();
  const link=location.origin+location.pathname+"#/product/"+CUR.id;
  sessionStorage.setItem("opt_prefill",(c?c+"\n":"")+`🛍 ${CUR.title} — ${CUR.price} ₽\n${link}`);
  closeSheet();
  go("#/chat/"+CUR.sellerId);
}
async function shareLink(){
  const url=location.origin+location.pathname+"#/product/"+CUR.id;
  closeSheet();
  try{
    if(navigator.share) await navigator.share({title:CUR.title,url});
    else { await navigator.clipboard.writeText(url); toast("Ссылка скопирована","ok"); }
  }catch(e){}
}

async function chatView(sellerId){
  if(!user) return needAuth("Войдите, чтобы написать продавцу");
  setNav("");
  const [{data:st},{data:tid,error}]=await Promise.all([
    db.rpc("seller_stats",{p_seller:sellerId}),
    db.rpc("open_thread",{p_seller:sellerId})
  ]);
  if(error){ $("#app").innerHTML=`<section><p class="err">${esc(error.message)}</p><a class="btn n" href="#/">На главную</a></section>`; return; }
  const name=st?.[0]?.username||"Продавец";
  CHAT={tid,sid:sellerId,timer:null,photo:null};
  $("#app").innerHTML=`<section class="chatbox">
    <div class="chead"><button class="ibtn sm" onclick="history.back()" aria-label="Назад">←</button>
      <div class="cav sm">${ini(name)}</div>
      <div><b>${esc(name)}</b><div class="muted">Чат с продавцом</div></div></div>
    <div class="cmsgs" id="cmsgs"><p class="muted" style="margin:auto">Загрузка...</p></div>
    <div class="cprev" id="cprev"><img id="cpimg"><button class="btn sm n" onclick="clearChatPhoto()">Убрать</button></div>
    <form class="cform" onsubmit="sendChat(event)">
      <label class="clip">📷<input type="file" accept="image/*" style="display:none" onchange="pickChatPhoto(this.files[0])"></label>
      <textarea id="ctxt" rows="1" placeholder="Сообщение…" maxlength="1000"></textarea>
      <button class="send" id="csend" type="submit">➤</button>
    </form>
    <p class="err" id="cerr"></p>
  </section>`;
  const pre=sessionStorage.getItem("opt_prefill");
  if(pre){ sessionStorage.removeItem("opt_prefill"); const t=$("#ctxt"); if(t) t.value=pre; }
  await loadChat(true);
  clearInterval(CHAT.timer);
  CHAT.timer=setInterval(()=>loadChat(false),8000);
}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>");
}
async function loadChat(scroll){
  const box=$("#cmsgs"); if(!box||!CHAT.tid) return;
  const {data,error}=await db.from("buyer_messages").select("id,sender_id,body,attachment,created_at")
    .eq("thread_id",CHAT.tid).order("created_at");
  if(!$("#cmsgs")) return;
  if(error){ box.innerHTML=`<p class="err">${esc(error.message)}</p>`; return; }
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  box.innerHTML=(data||[]).map(m=>{
    const mine=m.sender_id===user.id;
    return `<div class="bub ${mine?"me":"them"}">${m.attachment?`<img src="${esc(m.attachment)}">`:""}${m.body?linkify(m.body):""}<div class="bt">${fmt(m.created_at)}</div></div>`;
  }).join("")||'<p class="muted" style="margin:auto;text-align:center">Напишите первое сообщение</p>';
  if(scroll||near) box.scrollTop=box.scrollHeight;
}
async function pickChatPhoto(f){
  if(!f) return;
  try{
    CHAT.photo=await toDataUrl(f,800);
    $("#cpimg").src=CHAT.photo; $("#cprev").classList.add("on"); $("#cerr").textContent="";
  }catch(e){ CHAT.photo=null; $("#cerr").textContent=e.message; }
}
function clearChatPhoto(){
  CHAT.photo=null;
  const p=$("#cprev"); if(p) p.classList.remove("on");
  const i=$("#cpimg"); if(i) i.src="";
}
async function sendChat(e){
  e.preventDefault();
  const t=$("#ctxt"), body=t.value.trim();
  if(!body&&!CHAT.photo){ $("#cerr").textContent="Напишите сообщение или прикрепите фото."; return; }
  const btn=$("#csend");
  const ok=await act(btn,async()=>{
    const {error}=await db.rpc("send_buyer_message",{p_thread:CHAT.tid,p_body:body,p_attach:CHAT.photo});
    if(error) throw new Error(error.message);
  },"ok");
  if(ok){ t.value=""; clearChatPhoto(); }
  setTimeout(()=>{ btn.disabled=false; btn.classList.remove("ok"); btn.innerHTML="➤"; },500);
  await loadChat(true);
}

function setAuth(m){ location.hash=m==="reg"?"#/register":"#/profile"; }
function profileView(isReg){
  if(user) return accountView();
  REG_AV=null;
  $("#app").innerHTML=`<section>
    <div class="seg">
      <button class="${isReg?"":"on"}" onclick="setAuth('login')">Войти</button>
      <button class="${isReg?"on":""}" onclick="setAuth('reg')">Регистрация</button>
    </div>
    <div class="card">
      ${isReg?`
        <input id="un" placeholder="Ник (имя пользователя)" oninput="clearF('un')" onchange="checkUn()">
        <div class="ferr" data-for="un"></div>
        <p class="hint">Ник виден продавцам. Email и другие данные никому не показываются.</p>
        <label class="addph">📷 Фото профиля (необязательно)
          <input type="file" accept="image/*" style="display:none" onchange="pickRegAvatar(this.files[0])">
        </label>
        <div class="muted" id="avName"></div>`:""}
      <input id="em" type="email" placeholder="Email" oninput="clearF('em')">
      <div class="ferr" data-for="em"></div>
      <input id="pw" type="password" placeholder="Пароль (минимум 6 символов)" oninput="clearF('pw')">
      <div class="ferr" data-for="pw"></div>
      ${isReg?`
        <input id="pw2" type="password" placeholder="Повторите пароль" oninput="clearF('pw2')">
        <div class="ferr" data-for="pw2"></div>
        <label class="chk"><input type="checkbox" id="agree" onchange="clearF('agree')"><span>Я согласен с <a href="./privacy/" target="_blank" rel="noopener">Политикой конфиденциальности</a></span></label>
        <div class="ferr" data-for="agree"></div>
        <button class="btn" data-label="Зарегистрироваться" onclick="doReg(this)">Зарегистрироваться</button>`
        :`<button class="btn" data-label="Войти" onclick="doLogin(this)">Войти</button>
          <p><button class="link" onclick="resetPw()">Забыли пароль?</button></p>`}
      <p id="authMsg" class="err"></p>
    </div>
  </section>`;
}
function pickRegAvatar(f){
  if(!f) return;
  REG_AV=f;
  const n=$("#avName"); if(n) n.textContent="Фото выбрано: "+f.name;
}
async function checkUn(){
  const un=($("#un")?.value||"").trim();
  if(un.length<3) return;
  const {data}=await db.rpc("username_taken",{p:un});
  if(data) ferr("un","Этот ник уже занят");
}
async function doReg(btn){
  clearAll();
  const un=($("#un").value||"").trim(), em=($("#em").value||"").trim();
  const pw=$("#pw").value, pw2=$("#pw2").value;
  let ok=true;
  if(un.length<3||/\s/.test(un)){ ferr("un","Ник: минимум 3 символа, без пробелов"); ok=false; }
  if(!/^\S+@\S+\.\S+$/.test(em)){ ferr("em","Введите правильный email"); ok=false; }
  if(pw.length<6){ ferr("pw","Пароль: минимум 6 символов"); ok=false; }
  if(pw2!==pw){ ferr("pw2","Пароли не совпадают"); ok=false; }
  if(!$("#agree").checked){ ferr("agree","Нужно согласие с политикой"); ok=false; }
  if(!ok){ toast("Исправьте отмеченные поля","err"); return; }
  let note="";
  const done=await act(btn,async()=>{
    const {data:taken}=await db.rpc("username_taken",{p:un});
    if(taken){ ferr("un","Этот ник уже занят"); throw new Error("Ник занят"); }
    const {data,error}=await db.auth.signUp({email:em,password:pw,options:{data:{username:un,role:"buyer"}}});
    if(error){
      if(/already/i.test(error.message)){ ferr("em","Этот email уже зарегистрирован. Нажмите «Войти»."); throw new Error("Email уже зарегистрирован"); }
      throw new Error(error.message);
    }
    if(data.session){
      user=data.user;
      if(REG_AV){ try{ await saveAvatar(REG_AV); }catch(e){ note="Фото не сохранено: "+e.message; } }
    } else {
      note="Аккаунт создан. Подтвердите email и войдите. Фото можно добавить в профиле.";
    }
  },"ok");
  if(done){
    updateBottom();
    if(user){ toast("Добро пожаловать, "+un+"!","ok"); go("#/profile"); }
    else { setAuth("login"); const m=$("#authMsg"); if(m) m.textContent=note; }
  }
}
async function doLogin(btn){
  clearAll();
  const em=($("#em").value||"").trim(), pw=$("#pw").value;
  let ok=true;
  if(!em){ ferr("em","Введите email"); ok=false; }
  if(!pw){ ferr("pw","Введите пароль"); ok=false; }
  if(!ok) return;
  const done=await act(btn,async()=>{
    const {data,error}=await db.auth.signInWithPassword({email:em,password:pw});
    if(error){
      ferr("em","Неверный пароль или неверный email");
      ferr("pw","Неверный пароль или неверный email");
      throw new Error("Неверный пароль или неверный email");
    }
    user=data.user;
  },"ok");
  if(done){ updateBottom(); go("#/profile"); }
}
async function resetPw(){
  clearAll();
  const em=($("#em").value||"").trim();
  if(!/^\S+@\S+\.\S+$/.test(em)){ ferr("em","Сначала введите email"); return; }
  const {error}=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  const m=$("#authMsg");
  m.className=error?"err":"okt";
  m.textContent=error?error.message:"Ссылка для нового пароля отправлена на "+em+". Проверьте почту и папку «Спам».";
}
function recoveryView(){
  $("#app").innerHTML=`<section><div class="card">
    <h3>Новый пароль</h3>
    <input id="np" type="password" placeholder="Новый пароль (минимум 6 символов)" oninput="clearF('np')">
    <div class="ferr" data-for="np"></div>
    <button class="btn" data-label="Сохранить пароль" onclick="setNewPw(this)">Сохранить пароль</button>
  </div></section>`;
}
async function setNewPw(btn){
  const p=$("#np").value;
  if(p.length<6){ ferr("np","Минимум 6 символов"); return; }
  const done=await act(btn,async()=>{
    const {data,error}=await db.auth.updateUser({password:p});
    if(error) throw new Error(error.message);
    user=data.user;
  },"ok");
  if(done){
    recovery=false;
    history.replaceState(null,"",location.pathname+"#/profile");
    updateBottom(); route();
  }
}
function accountView(){
  const name=user.user_metadata?.username||"Пользователь";
  const av=user.user_metadata?.avatar;
  $("#app").innerHTML=`<section>
    <div class="profile">
      <div class="av">${av?`<img src="${esc(av)}">`:ini(name)}</div>

async function loadDialogs(){
  const {data}=await db.rpc("my_threads");
  const el=$("#dlg"); if(!el) return;
  const list=(data||[]).filter(t=>!t.i_am_seller);
  el.innerHTML=list.map(t=>`<div class="row2 pointer" onclick="go('#/chat/${t.other_id}')">

      <div style="flex:1;min-width:0"><b>${esc(t.other_name)}</b><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.last_body||"Фото")}</div></div>
      <span class="muted">${t.last_at?fmt(t.last_at):""}</span>
    </div>`).join("")||'<p class="muted">Диалогов пока нет. Напишите продавцу из карточки товара.</p>';
}
async function avatarChange(file){
  if(!file) return;
  try{
    await saveAvatar(file);
    toast("Фото профиля сохранено","ok");
    accountView();
  }catch(err){ toast("Ошибка: "+err.message,"err"); }
}
async function changePw(btn){
  const p=$("#npw").value;
  if(p.length<6){ ferr("npw","Минимум 6 символов"); return; }
  await act(btn,async()=>{
    const {error}=await db.auth.updateUser({password:p});
    if(error) throw new Error(error.message);
  },"ok");
  const i=$("#npw"); if(i) i.value="";
}
async function logout(btn){
  await act(btn,async()=>{ await db.auth.signOut(); user=null; },"ok");
  updateBottom();
  setTimeout(()=>go("#/profile"),500);
}
