<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--k);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding-bottom:86px}
body.nologin{padding-bottom:86px}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:24px;letter-spacing:-1px;line-height:.95;cursor:pointer}
.logo small{display:block;font-family:Inter,sans-serif;font-size:9px;letter-spacing:4px;color:var(--m);font-weight:700}
.bell{position:relative;background:var(--card2);border:1px solid var(--line);width:44px;height:44px;border-radius:14px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.bell .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--r2);display:none}
.bell .dot.on{display:block}
main{max-width:620px;margin:0 auto;padding:14px 14px 20px;animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:200% center}}
.hero{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:46px;letter-spacing:-2px;line-height:1;margin:8px 0 14px;background:linear-gradient(90deg,#fff,#fca5a5,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.hero small{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:6px;color:var(--m);font-weight:700;-webkit-text-fill-color:var(--m)}
.sbig{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 16px;box-shadow:0 10px 30px #dc26261a;transition:border-color .2s}
.sbig:focus-within{border-color:var(--r)}

.cam{flex:0 0 auto;width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--r),var(--rd));border:0;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px #dc262666;padding:0}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.hh{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--m);font-weight:700}

h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--m);margin:18px 0 8px}
h2{font-size:22px;font-weight:900;letter-spacing:-.4px;margin:12px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s}
.pc:hover{border-color:var(--r)}
.pimg{position:relative;aspect-ratio:4/5;background:var(--card2);cursor:pointer;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:900;border-radius:8px;padding:3px 8px;letter-spacing:.5px}
.tag.vip{background:var(--gold);color:#1a1a1a;box-shadow:0 0 14px #facc1599}
.tag.top2{background:var(--r);color:#fff}

.pb{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.pt{font-size:14px;font-weight:700;line-height:1.3;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pp{font-weight:900;font-size:16px;color:#fca5a5}
.pm{font-size:12px;color:var(--m)}
.pa{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.ic{background:var(--card2);border:1px solid var(--line);border-radius:12px;width:42px;height:38px;cursor:pointer;font-size:17px;flex:0 0 42px;padding:0}
.ic.on{border-color:var(--r)}
.btn{display:block;width:100%;background:var(--r);color:#fff;border:0;border-radius:16px;padding:14px;font-size:15px;font-weight:800;margin:8px 0;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;transition:background .25s,transform .1s;box-shadow:0 8px 20px #dc262633}
.btn:active{transform:scale(.99)}
.btn.sm{margin:0;padding:9px;font-size:13px;border-radius:12px}
.btn.ok{background:var(--ok)!important;box-shadow:0 8px 20px #16a34a44}
.btn.n{background:var(--card2);border:1px solid var(--line);box-shadow:none}
.btn.busy{background:#525252!important}
.btn.fail{background:#7f1d1d!important}
.btn:disabled{cursor:default}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
.link{background:none;border:0;color:var(--r2);font-weight:700;font-size:14px;cursor:pointer;padding:8px 0;font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
input,select,textarea{width:100%;padding:14px;margin:6px 0;border:1px solid var(--line);border-radius:14px;font-size:16px;background:var(--card2);color:var(--t);font-family:inherit}
input::placeholder,textarea::placeholder{color:#6b6b6b}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--r)}
input.bad{border-color:var(--r)!important;box-shadow:0 0 0 3px #dc262633}
.ferr{color:var(--r2);font-size:13px;font-weight:700;margin:-2px 2px 6px;min-height:0}
.hint{color:var(--m);font-size:12px;margin:-2px 2px 8px;line-height:1.5}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{background:transparent;color:var(--m);border:0;border-radius:11px;padding:11px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--r);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--m);margin:8px 0 4px;line-height:1.4}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--r);flex:0 0 20px}
.chk a{color:var(--r2);font-weight:700}
.err{color:var(--r2);font-size:14px;font-weight:700;margin-top:10px;min-height:18px;line-height:1.4}
.ok{color:#4ade80;font-size:14px;font-weight:700;margin-top:10px}
.muted{color:var(--m);font-size:13px;line-height:1.5}
.crumbs{font-size:13px;color:var(--m);margin:6px 0 10px}
.crumbs a{color:var(--r2);text-decoration:none;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:20px;background:var(--card);border:1px solid var(--line);aspect-ratio:1.4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}
.tile span{font-size:30px}
.tile b{font-size:14px;font-weight:800;padding:0 8px}
.tile.img:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#000d 100%)}
.tile.img b{position:relative;z-index:1;align-self:flex-end;padding-bottom:12px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -2px}
.gal img{flex:0 0 100%;height:300px;object-fit:cover;border-radius:18px;scroll-snap-align:start}
.ptitle{font-size:24px;font-weight:900;letter-spacing:-.4px;margin:12px 0 4px}
.big{font-size:22px}
.qty{display:flex;align-items:center;gap:12px;margin:14px 0}
.qty button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--t);font-size:20px;cursor:pointer;padding:0}
.qty span{min-width:50px;text-align:center;font-size:18px;font-weight:800}
.acts2{display:flex;gap:10px;margin:6px 0 16px}
.acts2 .btn{margin:0;flex:1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px}
.fact b{display:block;font-size:11px;color:var(--m);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.desc{white-space:pre-wrap;color:#d4d4d4;line-height:1.55}
.sellerbox{background:linear-gradient(135deg,#1c0a0a,var(--card));border:1px solid var(--rd);border-radius:20px;padding:16px;margin-top:16px}
.phone{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:800;margin:6px 0 10px;letter-spacing:1px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin:8px 0}
.row img{width:70px;height:70px;object-fit:cover;border-radius:12px;background:var(--card2);flex:0 0 70px}
.row .rt{flex:1;min-width:0}
.row input{width:110px;margin:4px 0}
.total{font-size:20px;margin:14px 0 4px;font-weight:800}
.profile{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.av{width:72px;height:72px;border-radius:50%;background:var(--card2);border:2px solid var(--r);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;flex:0 0 72px}
.av img{width:100%;height:100%;object-fit:cover}
.pname{font-size:20px;font-weight:900}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.langs button{background:var(--card2);border:1px solid var(--line);color:var(--t);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.langs button.on{background:var(--r);border-color:var(--r)}
.about{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;font-size:17px;line-height:1.7}
.bottom{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:620px;bottom:0;z-index:25;background:#0d0d0d;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--m);position:relative;padding:2px 0}
.bottom a i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:19px;height:36px;width:48px;margin:0 auto;border-radius:14px}
.bottom a span{display:block;font-size:10px;font-weight:700;margin-top:3px}
.bottom a.on{color:var(--r2)}
.bottom a.on i{background:var(--r);color:#fff}
.bd{position:absolute;top:-2px;left:calc(50% + 8px);background:var(--r2);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;min-width:17px;line-height:15px;text-align:center}
.bd:empty{display:none}
.sheet{position:fixed;inset:0;background:#000b;display:none;z-index:40;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheetbox{background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:620px;padding:20px;animation:fi .25s ease}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-130px);top:14px;z-index:60;background:var(--card2);border:1px solid var(--line);color:var(--t);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:700;transition:transform .3s;max-width:92%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--rd);color:#fecaca}
.toast.ok{border-color:#14532d;color:#bbf7d0}
</style>
</head>
<body class="nologin">
<header class="top">
  <div class="logo" onclick="go('#/')">700<small>OPTOM</small></div>
  <button class="bell" onclick="toggleBell(true)" aria-label="Уведомления">🛎️<b class="dot" id="dot"></b></button>
</header>
<main id="app"></main>
<nav class="bottom">
  <a href="#/" data-t="home"><i>🏠</i><span>Главная</span></a>
  <a href="#/cat" data-t="cat"><i>▦</i><span>Каталог</span></a>
  <a href="#/fav" data-t="fav"><i>♡</i><span>Избранное</span><b class="bd" id="favn"></b></a>
  <a href="#/cart" data-t="cart"><i>🛒</i><span>Корзина</span><b class="bd" id="cartn"></b></a>
  <a href="#/profile" data-t="prof"><i>👤</i><span>Профиль</span></a>
</nav>
<div id="bell" class="sheet" onclick="if(event.target.id==='bell')toggleBell(false)">
  <div class="sheetbox">
    <h3>Уведомления</h3>
    <p class="muted">Здесь появятся ответы продавцов и поддержки.</p>
    <a class="btn" href="../support/">💬 Поддержка 24/7</a>
    <button class="btn n" onclick="toggleBell(false)">Закрыть</button>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const SB_URL="https://fwvvnzrprjffsmkpvhrl.supabase.co";
const SB_KEY="sb_publishable_wJYMx4Gs-NlZXUBFedcVaQ_H30wRYUz";
const db=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const go=h=>{ if(location.hash===h) route(); else location.hash=h; };
const store={
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const favs=()=>store.get("opt_fav",[]);
const setFavs=a=>store.set("opt_fav",a);
const cart=()=>store.get("opt_cart",{});
const setCart=o=>store.set("opt_cart",o);
const hist=()=>store.get("opt_hist",[]);
const ICON={"Женщинам":"👗","Мужчинам":"👔","Детям":"🧸","Обувь":"👟","Аксессуары":"👜","Электроника":"📱","Дом и уют":"🏠","Красота и гигиена":"💄","Спорт и отдых":"🏋️","Игрушки":"🧩","Продукты питания":"🥫"};
const icon=n=>ICON[n]||"🛍️";
let user=null, CATS=[], QTY=1, LANG="ru", PENDING_FILE=null, recovery=location.hash.includes("type=recovery");
let QT=null;

// ---------- ЗВУК ----------
let AC=null;
function beep(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.07);
  }catch(e){}
}
document.addEventListener("click",e=>{
  if(e.target.closest(".bell,.sheet,.link,.chip")) return;
  if(e.target.closest("button,.btn,.tile,.pt,.pimg")) beep();
},true);

// ---------- УВЕДОМЛЕНИЯ, КНОПКИ ----------
let TT=null;
function toast(msg,type){
  const t=$("#toast"); if(!t) return;
  t.textContent=msg; t.className="toast show "+(type||"");
  clearTimeout(TT); TT=setTimeout(()=>{ t.className="toast"; },2800);
}
async function act(btn,fn,doneCls){
  if(!btn||btn.disabled) return false;
  const label=btn.dataset.label||btn.textContent.trim();
  btn.dataset.label=label;
  btn.disabled=true; btn.classList.add("busy");
  btn.innerHTML='<span class="spin"></span>Загрузка...';
  try{
    await fn();
    btn.classList.remove("busy");
    if(doneCls) btn.classList.add(doneCls);
    btn.innerHTML="✓ "+label;
    return true;
  }catch(e){
    btn.classList.remove("busy"); btn.classList.add("fail");
    btn.innerHTML="✕ "+label;
    toast(e.message||"Ошибка","err");
    setTimeout(()=>{ btn.disabled=false; btn.classList.remove("fail"); btn.innerHTML=label; },1600);
    return false;
  }
}
function toggleBell(on){
  const b=$("#bell");
  if(on){
    if(!store.get("opt_bell_sound",false)){ beep(); store.set("opt_bell_sound",true); }
    b.classList.add("open");
    $("#dot").classList.remove("on");
  } else b.classList.remove("open");
}
function closeBell(){ const b=$("#bell"); if(b) b.classList.remove("open"); }

// ---------- ФОРМЫ ----------
function ferr(key,msg){
  const e=document.querySelector(`.ferr[data-for="${key}"]`); if(e) e.textContent=msg;
  const i=$("#"+key); if(i) i.classList.add("bad");
}
function clearF(key){
  const e=document.querySelector(`.ferr[data-for="${key}"]`); if(e) e.textContent="";
  const i=$("#"+key); if(i) i.classList.remove("bad");
}
function clearAll(){
  document.querySelectorAll(".ferr").forEach(e=>e.textContent="");
  document.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
  const m=$("#authMsg"); if(m) m.textContent="";
}

// ---------- СТАРТ ----------
async function init(){
  const {data}=await db.auth.getSession();
  user=data.session?.user||null;
  if(user){
    const {data:a}=await db.from("admins").select("user_id").eq("user_id",user.id);
    if(a&&a.length) return location.replace("../admin/");
  }
  db.auth.onAuthStateChange((ev,s)=>{ user=s?.user||null; updateBottom(); });
  await loadRefs();
  window.addEventListener("hashchange",route);
  updateBottom();
  route();
}
async function loadRefs(){
  const {data}=await db.from("categories").select("*");
  CATS=data||[];
}
function sortedKids(parent){
  return CATS.filter(c=>(c.parent_id??null)===(parent??null))
    .sort((a,b)=>(a.sort_order??0)-(b.sort_order??0)||a.name.localeCompare(b.name));
}
function updateBottom(){
  const f=favs().length, c=Object.keys(cart()).length;
  const fe=$("#favn"), ce=$("#cartn");
  if(fe) fe.textContent=f||"";
  if(ce) ce.textContent=c||"";
  document.body.classList.toggle("nologin",!user);
}
function setNav(p){
  document.querySelectorAll(".bottom a").forEach(a=>a.classList.toggle("on",a.dataset.t===p));
}
function route(){
  if(recovery) return recoveryView();
  const parts=(location.hash||"#/").slice(2).split("/");
  const page=parts[0]||"", arg=parts[1];
  closeBell(); window.scrollTo(0,0);
  setNav(page==="product"?"":(page||"home"));
  if(page==="cat") return catView(arg?+arg:null);
  if(page==="search") return searchView();
  if(page==="fav") return favView();
  if(page==="cart") return cartView();
  if(page==="profile"||page==="register") return profileView(page==="register");
  if(page==="product") return productView(+arg);
  if(page==="about") return aboutView();
  return homeView();
}

// ---------- ГЛАВНАЯ ----------
function homeView(){
  $("#app").innerHTML=`<section>
    <div class="hero">700<small>OPTOM</small></div>
    <div class="sbig">
      <span class="sph" onclick="go('#/search')">🔎 Поиск товаров</span>
      <button class="cam" onclick="$('#homeCam').click()" aria-label="Поиск по фото">📷</button>
    </div>
    <input id="homeCam" type="file" accept="image/*" style="display:none" onchange="homeCam(this.files[0])">
    <h3>Для вас</h3>
    <div id="feed" class="grid"><p class="muted">Загрузка...</p></div>
  </section>`;
  loadFeed("",null,"feed");
}
function homeCam(f){ if(!f) return; PENDING_FILE=f; go("#/search"); }
async function loadFeed(q,cat,elId){

function dhash(src){
  return new Promise((res,rej)=>{
    const im=new Image(); im.crossOrigin="anonymous";
    im.onload=()=>{
      const c=document.createElement("canvas"); c.width=9; c.height=8;
      const x=c.getContext("2d"); x.drawImage(im,0,0,9,8);
      const d=x.getImageData(0,0,9,8).data;
      const g=k=>0.299*d[k]+0.587*d[k+1]+0.114*d[k+2];
      let bits="";
      for(let y=0;y<8;y++) for(let i=0;i<8;i++) bits+=g((y*9+i)*4)>g((y*9+i+1)*4)?"1":"0";
      res(BigInt("0b"+bits).toString(16).padStart(16,"0"));
    };
    im.onerror=()=>rej(new Error("image"));
    im.src=src;
  });
}
function hamming(a,b){
  let x=BigInt("0x"+a)^BigInt("0x"+b), n=0;
  while(x>0n){ n+=Number(x&1n); x>>=1n; }
  return n;
}
async function photoSearch(file){
  const list=$("#list"), info=$("#info"); if(!file||!list) return;
  info.textContent="Ищем похожие товары...";
  let qh;
  try{
    const u=URL.createObjectURL(file);
    qh=await dhash(u);
    URL.revokeObjectURL(u);
  }catch(e){ info.textContent="Не удалось прочитать фото. Попробуйте другое."; return; }
  const {data,error}=await db.from("products").select("id,title,price,min_order,photos,img_hash,tier,cities(name)")
    .eq("status","published").gt("photos_until",new Date().toISOString()).limit(300);
  if(!$("#list")) return;
  if(error){ info.textContent="Ошибка: "+error.message; return; }
  const items=(data||[]).map(p=>({...p,city_name:p.cities?.name}));
  const ranked=items.filter(p=>p.img_hash).map(p=>({p,d:hamming(qh,p.img_hash)}))
    .sort((a,b)=>(b.p.tier||0)-(a.p.tier||0)||a.d-b.d).slice(0,12);
  info.textContent=ranked.length?"Похожие товары:":"Похожих товаров не найдено";
  list.innerHTML=ranked.map(x=>card(x.p)).join("");
}

async function doReg(btn){
  clearAll();
  const un=($("#un").value||"").trim(), em=($("#em").value||"").trim();
  const pw=$("#pw").value, pw2=$("#pw2").value;
  let ok=true;
  if(un.length<3||/\s/.test(un)){ ferr("un","Ник: минимум 3 символа, без пробелов"); ok=false; }
  if(!/^\S+@\S+\.\S+$/.test(em)){ ferr("em","Введите правильный email"); ok=false; }
  if(pw.length<6){ ferr("pw","Пароль: минимум 6 символов"); ok=false; }

    const {data,error}=await db.auth.signUp({email:em,password:pw,options:{data:{username:un}}});

    else { note="Аккаунт создан. Войдите по email и паролю."; }
  },"ok");
  if(done){
    updateBottom();
    if(user) go("#/profile");

async function avatar(file){
  if(!file) return;
  try{
    const img=await new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>{URL.revokeObjectURL(u);res(i);}; i.onerror=()=>rej(new Error("Не удалось открыть фото")); i.src=u; });
    const k=Math.min(1,512/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Не удалось сжать")),"image/jpeg",0.85));
    const path=`${user.id}/avatar_${Date.now()}.jpg`;
    const {error}=await db.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});
    if(error) throw new Error(error.message);
    const url=db.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    const {data,error:e2}=await db.auth.updateUser({data:{avatar:url}});
    if(e2) throw new Error(e2.message);
    user=data.user;
    toast("Фото профиля сохранено","ok");
    accountView();
  }catch(err){ toast("Ошибка: "+err.message,"err"); }
}

}
