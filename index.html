<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оптовый маркетплейс</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#7c3aed;--bg:#f5f3ff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#1f1235}
header{background:var(--p);color:#fff;padding:14px;position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;z-index:5}
header a{color:#fff;text-decoration:none;margin-left:10px;font-size:14px}
main{padding:12px;max-width:700px;margin:auto}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}
button{background:var(--p);color:#fff;border:0;padding:12px 16px;border-radius:10px;font-size:16px;width:100%;margin:6px 0}
button.s{width:auto;background:#666;padding:6px 10px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:12px;padding:8px;box-shadow:0 1px 3px #0002}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#eee}
.price{font-weight:bold;color:var(--p)}
.gal{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x mandatory}
.gal img{flex:0 0 100%;height:260px;object-fit:cover;scroll-snap-align:start;border-radius:12px}
.muted{color:#777;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0;gap:8px}
.desc{white-space:pre-wrap}
</style>
</head>
<body>
<header><b onclick="go('#/')" style="cursor:pointer">Опт</b><div id="nav"></div></header>
<main id="app">Загрузка...</main>
<script>
const SB_URL="https://fwvvnzrprjffsmkpvhrl.supabase.co";
const SB_KEY="sb_publishable_wJYMx4Gs-NlZXUBFedcVaQ_H30wRYUz";
const SITE_URL=location.origin+location.pathname;
const REQUISITES="Перевод на карту: [НОМЕР КАРТЫ] или СБП: [НОМЕР ТЕЛЕФОНА]. Получатель: [ВАШЕ ИМЯ]";
const STATUS={draft:"Черновик",awaiting_payment:"Оплатить 25 ₽",pending_review:"На проверке",published:"Опубликован",rejected:"Отклонён"};

const db=supabase.createClient(SB_URL,SB_KEY);
let user=null,isAdmin=false,recovery=false,ready=false,CATS=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const go=h=>{ if(location.hash===h) route(); else location.hash=h; };
const ERR=[
  ["already registered","Этот email уже зарегистрирован. Нажмите «Войти» или «Забыли пароль?»."],
  ["Invalid login credentials","Неверный email или пароль."],
  ["Email not confirmed","Email не подтверждён. Обратитесь к владельцу сайта."],
  ["at least 6","Пароль должен быть не короче 6 символов."],
  ["For security purposes","Слишком частые запросы. Подождите минуту и попробуйте снова."],
  ["rate limit","Слишком много писем. Попробуйте позже."]
];
const errText=e=>{const m=e?.message||"";const f=ERR.find(([k])=>m.includes(k));return f?f[1]:"Ошибка: "+m;};
window.addEventListener("hashchange",()=>route());

// ---------- СТАРТ И СЕССИЯ ----------
async function init(){
  const h=location.hash;
  if(h.includes("type=recovery")) recovery=true;
  db.auth.onAuthStateChange((event,session)=>{
    user=session?.user||null;
    if(event==="PASSWORD_RECOVERY"){ recovery=true; recoveryView(); return; }
    setTimeout(async()=>{ await checkAdmin(); renderNav(); },0);
  });
  const {data}=await db.auth.getSession();
  user=data.session?.user||null;
  await checkAdmin(); renderNav();
  ready=true;
  if(recovery) return recoveryView();
  if(h.includes("error_code")){
    history.replaceState(null,"",location.pathname+"#/login");
    loginView();
    $("#msg").textContent="Ссылка недействительна или устарела. Запросите новую.";
    return;
  }
  route();
}
async function checkAdmin(){
  isAdmin=false;
  if(!user) return;
  const {data}=await db.from("admins").select("user_id").eq("user_id",user.id);
  isAdmin=!!(data&&data.length);
}
function renderNav(){
  $("#nav").innerHTML=user
    ?`<a href="#/cabinet">Кабинет</a>${isAdmin?'<a href="#/admin">Админ</a>':''}<a href="#" onclick="logout();return false">Выход</a>`
    :`<a href="#/login">Войти</a>`;
}
async function logout(){
  await db.auth.signOut();
  user=null; isAdmin=false; renderNav();
  go("#/");
}
function route(){
  if(!ready||recovery) return;
  const [,page,arg]=(location.hash||"#/").split("/");
  if(page==="login") return user?go("#/cabinet"):loginView();
  if(page==="cabinet") return user?cabinetView():go("#/login");
  if(page==="sell") return user?sellView(arg||"new"):go("#/login");
  if(page==="pay") return user?payView(arg):go("#/login");
  if(page==="product") return productView(arg);
  if(page==="admin") return isAdmin?adminView():go("#/");
  return homeView();
}

// ---------- КАТЕГОРИИ ----------
function treeOrder(cats){
  const byParent={};
  cats.forEach(c=>{ const k=c.parent_id??"root"; (byParent[k]??=[]).push(c); });
  const out=[];
  const walk=(pid,d)=>(byParent[pid]||[]).forEach(c=>{ out.push({c,d}); walk(c.id,d+1); });
  walk("root",0);
  return out;
}
function catOptions(cats,sel,leafOnly){
  const items=treeOrder(cats||[]);
  const hasKids=id=>items.some(x=>x.c.parent_id===id);
  return items.filter(x=>!leafOnly||!hasKids(x.c.id))
    .map(({c,d})=>`<option value="${c.id}" ${c.id==sel?"selected":""}>${"— ".repeat(d)}${esc(c.name)}</option>`).join("");
}
function descIds(id){
  const out=[+id];
  const walk=pid=>CATS.filter(c=>c.parent_id===pid).forEach(c=>{ out.push(c.id); walk(c.id); });
  walk(+id);
  return out;
}

// ---------- КАТАЛОГ ----------
async function homeView(){
  const [{data:cats},{data:cities}]=await Promise.all([
    db.from("categories").select("*").order("name"),
    db.from("cities").select("*").order("name")
  ]);
  CATS=cats||[];
  $("#app").innerHTML=`
    <button onclick="go('#/sell/new')">+ Разместить товар</button>
    <input id="q" placeholder="Поиск по названию" oninput="loadList()">
    <select id="cat" onchange="loadList()"><option value="">Все категории</option>${catOptions(CATS,null,false)}</select>
    <select id="city" onchange="loadList()"><option value="">Все города</option>${(cities||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
    <div id="list" class="grid" style="margin-top:10px"></div>`;
  loadList();
}
async function loadList(){
  let q=db.from("products").select("id,title,price,min_order,photos,cities(name)")
    .eq("status","published").order("created_at",{ascending:false});
  const s=$("#q").value.trim(); if(s) q=q.ilike("title",`%${s}%`);
  const c=$("#cat").value; if(c) q=q.in("category_id",descIds(c));
  const ci=$("#city").value; if(ci) q=q.eq("city_id",ci);
  const {data,error}=await q.limit(60);
  if(error){ $("#list").innerHTML="Ошибка: "+esc(error.message); return; }
  $("#list").innerHTML=(data||[]).map(p=>`
    <div class="card" style="cursor:pointer" onclick="go('#/product/${p.id}')">
      <img src="${esc(p.photos?.[0]||"")}" onerror="this.style.display='none'">
      <div><b>${esc(p.title)}</b></div>
      <div class="price">${p.price} ₽</div>
      <div class="muted">мин. ${p.min_order} шт · ${esc(p.cities?.name||"")}</div>
    </div>`).join("")||'<p class="muted">Товаров пока нет</p>';
}
async function productView(id){
  const {data:p}=await db.from("products").select("*,cities(name),categories(name)").eq("id",id).maybeSingle();
  if(!p){ $("#app").innerHTML='<p class="muted">Товар не найден или недоступен.</p>'; return; }
  $("#app").innerHTML=`
    <div class="gal">${(p.photos||[]).map(u=>`<img src="${esc(u)}">`).join("")}</div>
    <h2>${esc(p.title)}</h2>
    <div class="price">${p.price} ₽ за штуку</div>
    <p>Минимальный заказ: ${p.min_order} шт</p>
    <p class="muted">Город: ${esc(p.cities?.name||"—")} · ${esc(p.categories?.name||"")}</p>
    <p class="desc">${esc(p.description||"")}</p>
    <h3>Продавец</h3>
    ${p.seller_phone?`<a href="tel:${esc(p.seller_phone)}"><button>Позвонить: ${esc(p.seller_phone)}</button></a>`:""}
    ${p.seller_email?`<a href="mailto:${esc(p.seller_email)}"><button>Написать на email</button></a>`:""}`;
}

// ---------- ВХОД, РЕГИСТРАЦИЯ, ПАРОЛЬ ----------
function loginView(){
  $("#app").innerHTML=`
    <h3>Вход продавца</h3>
    <input id="em" type="email" placeholder="Email">
    <input id="pw" type="password" placeholder="Пароль (не короче 6 символов)">
    <button onclick="login()">Войти</button>
    <button onclick="register()">Зарегистрироваться</button>
    <p><a href="#" onclick="forgot();return false">Забыли пароль?</a></p>
    <p id="msg" class="muted"></p>`;
}
async function login(){
  const email=$("#em").value.trim(), password=$("#pw").value;
  if(!email||!password){ $("#msg").textContent="Введите email и пароль."; return; }
  $("#msg").textContent="Входим...";
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){ $("#msg").textContent=errText(error); return; }
  user=data.user; await checkAdmin(); renderNav(); go("#/cabinet");
}
async function register(){
  const email=$("#em").value.trim(), password=$("#pw").value;
  if(!email||password.length<6){ $("#msg").textContent="Введите email и пароль (не короче 6 символов)."; return; }
  $("#msg").textContent="Регистрируем...";
  const {data,error}=await db.auth.signUp({email,password});
  if(error){ $("#msg").textContent=errText(error); return; }
  if(!data.session){ $("#msg").textContent="Аккаунт создан. Подтвердите email по письму и нажмите «Войти»."; return; }
  user=data.user; await checkAdmin(); renderNav(); go("#/cabinet");
}
async function forgot(){
  const email=$("#em").value.trim();
  if(!email){ $("#msg").textContent="Сначала введите email."; return; }
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});
  if(error){ $("#msg").textContent=errText(error); return; }
  $("#msg").textContent="Ссылка для смены пароля отправлена на "+email+". Откройте письмо и перейдите по ссылке.";
}
function recoveryView(){
  $("#app").innerHTML=`
    <h3>Новый пароль</h3>
    <p class="muted">Придумайте новый пароль (не короче 6 символов).</p>
    <input id="np" type="password" placeholder="Новый пароль">
    <button onclick="setNewPassword()">Сохранить пароль</button>
    <p id="msg" class="muted"></p>`;
}
async function setNewPassword(){
  const p=$("#np").value;
  if(p.length<6){ $("#msg").textContent="Пароль должен быть не короче 6 символов."; return; }
  const {data,error}=await db.auth.updateUser({password:p});
  if(error){ $("#msg").textContent=errText(error); return; }
  user=data.user; recovery=false;
  history.replaceState(null,"",location.pathname+"#/cabinet");
  await checkAdmin(); renderNav(); route();
}

// ---------- КАБИНЕТ ПРОДАВЦА ----------
function actions(p){
  let b="";
  if(p.status==="awaiting_payment") b+=`<button class="s" onclick="go('#/pay/${p.id}')">Оплатить</button>`;
  if(p.status==="rejected") b+=`<button class="s" onclick="go('#/sell/${p.id}')">Исправить</button>`;
  if(["draft","awaiting_payment","pending_review"].includes(p.status)) b+=`<button class="s" onclick="go('#/sell/${p.id}')">Изменить</button>`;
  return b+`<button class="s" onclick="delProduct(${p.id})">Удалить</button>`;
}
async function cabinetView(){
  const {data}=await db.from("products").select("id,title,status").eq("seller_id",user.id).order("created_at",{ascending:false});
  $("#app").innerHTML=`
    <button onclick="go('#/sell/new')">+ Добавить товар</button>
    ${(data||[]).map(p=>`
      <div class="row">
        <div><b>${esc(p.title)}</b><div class="muted">${STATUS[p.status]||esc(p.status)}</div></div>
        <div>${actions(p)}</div>
      </div>`).join("")||'<p class="muted">У вас пока нет товаров</p>'}`;
}
async function delProduct(id,catalog){
  if(!confirm("Удалить товар?")) return;
  const {error}=await db.from("products").delete().eq("id",id);
  if(error) return alert("Ошибка: "+error.message);
  if(catalog) loadCatalog(); else cabinetView();
}

// ---------- ФОРМА ТОВАРА ----------
async function sellView(id){
  const isNewItem=id==="new"||id==="admin";
  let p={};
  if(!isNewItem){
    const {data}=await db.from("products").select("*").eq("id",id).maybeSingle();
    if(!data) return go("#/cabinet");
    p=data;
  }
  const isCatalog=id==="admin"||p.seller_id===null;
  const minPhotos=isCatalog?1:3;
  const back=isCatalog?"#/admin":"#/cabinet";
  const [{data:cats},{data:cities}]=await Promise.all([
    db.from("categories").select("*").order("name"),
    db.from("cities").select("*").order("name")
  ]);
  CATS=cats||[];
  const heading=id==="admin"?"Товар в каталог магазина":isCatalog?"Товар каталога":isNewItem?"Новый товар":"Редактирование";
  $("#app").innerHTML=`
    <h3>${heading}</h3>
    <input id="t" placeholder="Название" value="${esc(p.title)}">
    <textarea id="d" rows="3" placeholder="Описание">${esc(p.description)}</textarea>
    <select id="c"><option value="">Выберите категорию или модель телефона</option>${catOptions(CATS,p.category_id,true)}</select>
    <select id="ci"><option value="">Выберите город</option>${(cities||[]).map(c=>`<option value="${c.id}" ${c.id==p.city_id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
    <input id="pr" type="number" placeholder="Цена за штуку, ₽" value="${p.price??""}">
    <input id="mo" type="number" placeholder="Минимальный заказ, шт" value="${p.min_order??""}">
    <input id="ph" type="tel" placeholder="Телефон для связи" value="${esc(p.seller_phone)}">
    <input id="em2" type="email" placeholder="Email для связи" value="${esc(p.seller_email)}">
    <p class="muted">Фото: ${isNewItem?`от ${minPhotos} до 6`:`если выберете новые, они заменят старые (от ${minPhotos} до 6)`}, из галереи телефона.</p>
    <input id="files" type="file" accept="image/*" multiple>
    <button onclick="saveProduct('${id}',${minPhotos},'${p.status||""}','${back}')">Сохранить</button>
    <p id="msg" class="muted"></p>`;
}
async function saveProduct(id,minPhotos,curStatus,back){
  const msg=$("#msg");
  const title=$("#t").value.trim();
  const price=+$("#pr").value, min=+$("#mo").value;
  const cat=+$("#c").value, city=+$("#ci").value;
  const phone=$("#ph").value.trim(), email=$("#em2").value.trim();
  const files=[...$("#files").files];
  if(!title||!price||!min||!cat||!city){ msg.textContent="Заполните название, категорию, город, цену и минимальный заказ."; return; }
  if(!phone&&!email){ msg.textContent="Укажите телефон или email для связи."; return; }
  const isNewItem=id==="new"||id==="admin";
  if(isNewItem&&files.length<minPhotos){ msg.textContent=`Загрузите от ${minPhotos} до 6 фото.`; return; }
  if(files.length&&files.length<minPhotos){ msg.textContent=`Новых фото должно быть от ${minPhotos} до 6.`; return; }
  if(files.length>6){ msg.textContent="Не больше 6 фото."; return; }
  msg.textContent="Сохраняем...";

  const photos=[];
  for(const [i,f] of files.entries()){
    const path=`${user.id}/${Date.now()}_${i}.jpg`;
    const {error}=await db.storage.from("product-photos").upload(path,f,{contentType:f.type||"image/jpeg"});
    if(error){ msg.textContent="Ошибка фото: "+error.message; return; }
    photos.push(db.storage.from("product-photos").getPublicUrl(path).data.publicUrl);
  }

  const row={title,description:$("#d").value.trim(),category_id:cat,city_id:city,price,min_order:min,seller_phone:phone,seller_email:email};
  if(photos.length) row.photos=photos;

  if(isNewItem){
    if(id==="admin"){ row.seller_id=null; row.status="published"; }
    else { row.seller_id=user.id; row.status="awaiting_payment"; }
    const {data,error}=await db.from("products").insert(row).select().single();
    if(error){ msg.textContent="Ошибка: "+error.message; return; }
    return go(id==="admin"?"#/admin":"#/pay/"+data.id);
  }
  if(curStatus==="rejected") row.status="awaiting_payment";
  const {error}=await db.from("products").update(row).eq("id",id);
  if(error){ msg.textContent="Ошибка: "+error.message; return; }
  const toPay=curStatus==="rejected"||curStatus==="awaiting_payment";
  go(toPay?"#/pay/"+id:back);
}

// ---------- ОПЛАТА 25 ₽ ----------
async function payView(id){
  if(!id) return go("#/cabinet");
  const {data:p}=await db.from("products").select("title,status").eq("id",id).maybeSingle();
  if(!p||p.status!=="awaiting_payment") return go("#/cabinet");
  $("#app").innerHTML=`
    <h3>Оплата публикации</h3>
    <p><b>${esc(p.title)}</b></p>
    <p>Сумма: <b>25 ₽</b> за этот товар.</p>
    <p class="desc">${esc(REQUISITES)}</p>
    <p class="muted">После перевода сделайте скриншот чека и загрузите его ниже. Товар появится на сайте после проверки.</p>
    <input id="rc" type="file" accept="image/*">
    <button onclick="sendPayment(${id})">Я оплатил</button>
    <p id="msg" class="muted"></p>`;
}
async function sendPayment(id){
  const f=$("#rc").files[0], msg=$("#msg");
  if(!f){ msg.textContent="Загрузите скриншот чека."; return; }
  msg.textContent="Отправляем...";
  const path=`${user.id}/${id}_${Date.now()}.jpg`;
  const {error:e1}=await db.storage.from("receipts").upload(path,f,{contentType:f.type||"image/jpeg"});
  if(e1){ msg.textContent="Ошибка загрузки чека: "+e1.message; return; }
  const {error:e2}=await db.from("payments").insert({product_id:id,seller_id:user.id,receipt_url:path});
  if(e2){ msg.textContent="Ошибка: "+e2.message; return; }
  await db.from("products").update({status:"pending_review"}).eq("id",id);
  alert("Чек отправлен. Товар появится на сайте после проверки.");
  go("#/cabinet");
}

// ---------- АДМИН ----------
async function adminView(){
  $("#app").innerHTML=`
    <h3>Модерация (оплаты 25 ₽)</h3><div id="mod">Загрузка...</div>
    <h3>Каталог магазина</h3>
    <button onclick="go('#/sell/admin')">+ Добавить товар в каталог</button>
    <div id="catalog"></div>
    <h3>Категории</h3><div id="cats"></div>
    <h3>Города</h3><div id="cities"></div>`;
  loadModeration(); loadCatalog(); loadTaxonomy();
}
async function loadModeration(){
  const {data}=await db.from("payments").select("id,receipt_url,products(id,title,price,photos)").eq("status","pending").order("created_at");
  const rows=await Promise.all((data||[]).filter(p=>p.products).map(async p=>{
    const {data:s}=await db.storage.from("receipts").createSignedUrl(p.receipt_url,3600);
    return `<div class="card" style="margin:8px 0">
      <b>${esc(p.products.title)}</b> · ${p.products.price} ₽
      <div class="gal" style="margin:6px 0">${(p.products.photos||[]).map(u=>`<img src="${esc(u)}" style="flex:0 0 40%;height:120px">`).join("")}</div>
      <a href="${esc(s?.signedUrl||"#")}" target="_blank">Открыть чек</a>
      <div>
        <button onclick="moderate(${p.id},${p.products.id},true)">Подтвердить и опубликовать</button>
        <button onclick="moderate(${p.id},${p.products.id},false)">Отклонить</button>
      </div></div>`;
  }));
  $("#mod").innerHTML=rows.join("")||'<p class="muted">Нет товаров на проверке</p>';
}
async function moderate(payId,prodId,ok){
  const {error:e1}=await db.from("payments").update({status:ok?"confirmed":"rejected"}).eq("id",payId);
  const {error:e2}=await db.from("products").update({status:ok?"published":"rejected"}).eq("id",prodId);
  if(e1||e2) alert("Ошибка: "+(e1||e2).message);
  loadModeration();
}
async function loadCatalog(){
  const {data}=await db.from("products").select("id,title,price").is("seller_id",null).order("created_at",{ascending:false});
  $("#catalog").innerHTML=(data||[]).map(p=>`
    <div class="row"><div><b>${esc(p.title)}</b><div class="muted">${p.price} ₽</div></div>
    <div><button class="s" onclick="go('#/sell/${p.id}')">Изменить</button>
    <button class="s" onclick="delProduct(${p.id},true)">Удалить</button></div></div>`).join("")||'<p class="muted">Товаров в каталоге пока нет</p>';
}
async function loadTaxonomy(){
  const [{data:cats},{data:cities}]=await Promise.all([
    db.from("categories").select("*").order("name"),
    db.from("cities").select("*").order("name")
  ]);
  CATS=cats||[];
  $("#cats").innerHTML=`
    <select id="pc"><option value="">— корневая категория —</option>${catOptions(CATS,null,false)}</select>
    <input id="cn" placeholder="Название (категория или модель телефона)">
    <button onclick="addCat()">Добавить категорию</button>
    ${treeOrder(CATS).map(({c,d})=>`<div class="row"><span>${"&nbsp;&nbsp;&nbsp;&nbsp;".repeat(d)}${esc(c.name)}</span><button class="s" onclick="delCat(${c.id})">Удалить</button></div>`).join("")}`;
  $("#cities").innerHTML=`
    <input id="ctn" placeholder="Город">
    <button onclick="addCity()">Добавить город</button>
    ${(cities||[]).map(c=>`<div class="row"><span>${esc(c.name)}</span></div>`).join("")}`;
}
async function addCat(){
  const name=$("#cn").value.trim(); if(!name) return;
  const pid=$("#pc").value;
  const {error}=await db.from("categories").insert({name,parent_id:pid?+pid:null});
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}
async function delCat(id){
  if(!confirm("Удалить категорию вместе с вложенными?")) return;
  const {error}=await db.from("categories").delete().eq("id",id);
  if(error) return alert("Нельзя удалить: "+error.message);
  loadTaxonomy();
}
async function addCity(){
  const name=$("#ctn").value.trim(); if(!name) return;
  const {error}=await db.from("cities").insert({name});
  if(error) return alert("Ошибка: "+error.message);
  loadTaxonomy();
}

init();
</script>
</body>
</html>
